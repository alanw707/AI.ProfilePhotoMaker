<!DOCTYPE html>
<html>
<head>
    <title>Atomic Operations Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { margin: 5px; padding: 10px; }
        #results { background: #f5f5f5; padding: 10px; margin: 10px 0; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Atomic Operations Test</h1>
    
    <div class="section">
        <h2>Authentication</h2>
        <input type="email" id="email" placeholder="Email" value="test@example.com">
        <input type="password" id="password" placeholder="Password" value="TestPassword123!">
        <button onclick="login()">Login</button>
        <button onclick="register()">Register</button>
        <div id="authStatus" class="info">Not authenticated</div>
    </div>

    <div class="section">
        <h2>Test Upload (should create both DB record and storage)</h2>
        <input type="file" id="uploadFile" accept="image/*" multiple>
        <button onclick="testUpload()">Test Atomic Upload</button>
    </div>

    <div class="section">
        <h2>Test Delete (should remove both DB record and storage)</h2>
        <button onclick="getImages()">Get Current Images</button>
        <select id="imageSelect"></select>
        <button onclick="testDelete()">Test Atomic Delete</button>
    </div>

    <div class="section">
        <h2>Verify Sync Status</h2>
        <button onclick="checkSync()">Check DB vs Storage Sync</button>
    </div>

    <div id="results">
        <div>Test results will appear here...</div>
    </div>

    <script>
        const API_BASE = 'https://localhost:7173/api';
        let authToken = null;

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }

        async function apiCall(endpoint, options = {}) {
            const config = {
                headers: {
                    'Content-Type': 'application/json',
                    ...(authToken && { 'Authorization': `Bearer ${authToken}` })
                },
                ...options
            };

            if (options.body && !(options.body instanceof FormData)) {
                config.body = JSON.stringify(options.body);
            } else if (options.body instanceof FormData) {
                delete config.headers['Content-Type'];
            }

            const response = await fetch(`${API_BASE}${endpoint}`, config);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${await response.text()}`);
            }
            
            return response.json();
        }

        async function register() {
            try {
                log('Attempting to register user...', 'info');
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                await apiCall('/auth/register', {
                    method: 'POST',
                    body: {
                        email: email,
                        password: password,
                        confirmPassword: password
                    }
                });
                
                log('Registration successful', 'success');
                await login();
            } catch (error) {
                log(`Registration failed: ${error.message}`, 'error');
            }
        }

        async function login() {
            try {
                log('Attempting to login...', 'info');
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                const result = await apiCall('/auth/login', {
                    method: 'POST',
                    body: {
                        email: email,
                        password: password
                    }
                });
                
                authToken = result.token;
                document.getElementById('authStatus').textContent = `Authenticated as ${email}`;
                document.getElementById('authStatus').className = 'success';
                log('Login successful', 'success');
            } catch (error) {
                log(`Login failed: ${error.message}`, 'error');
                document.getElementById('authStatus').textContent = 'Authentication failed';
                document.getElementById('authStatus').className = 'error';
            }
        }

        async function testUpload() {
            try {
                log('Testing atomic upload...', 'info');
                
                if (!authToken) {
                    log('Please login first', 'error');
                    return;
                }

                const fileInput = document.getElementById('uploadFile');
                if (!fileInput.files || fileInput.files.length === 0) {
                    log('Please select files to upload', 'error');
                    return;
                }

                const formData = new FormData();
                for (let file of fileInput.files) {
                    formData.append('images', file);
                }
                formData.append('forTraining', 'true');
                formData.append('firstName', 'Test');
                formData.append('lastName', 'User');
                formData.append('gender', 'Male');
                formData.append('ethnicity', 'Other');

                const result = await apiCall('/image/upload', {
                    method: 'POST',
                    body: formData
                });

                log(`Upload successful! Uploaded ${result.uploadedFiles.length} files`, 'success');
                log(`Database records created: ${result.uploadedImageIds.length}`, 'success');
                
                // Refresh image list
                await getImages();
                
            } catch (error) {
                log(`Upload failed: ${error.message}`, 'error');
            }
        }

        async function getImages() {
            try {
                if (!authToken) {
                    log('Please login first', 'error');
                    return;
                }

                const result = await apiCall('/image/images');
                
                log(`Found ${result.totalImages} total images`, 'info');
                log(`Original uploads: ${result.originalUploads}`, 'info');
                log(`Generated images: ${result.generatedImages}`, 'info');
                
                // Populate select dropdown
                const select = document.getElementById('imageSelect');
                select.innerHTML = '';
                
                if (result.images && result.images.length > 0) {
                    result.images.forEach(img => {
                        const option = document.createElement('option');
                        option.value = img.id;
                        option.textContent = `Image ${img.id} (${img.style}) - ${img.isOriginalUpload ? 'Original' : 'Generated'}`;
                        select.appendChild(option);
                    });
                } else {
                    const option = document.createElement('option');
                    option.textContent = 'No images found';
                    select.appendChild(option);
                }
                
            } catch (error) {
                log(`Failed to get images: ${error.message}`, 'error');
            }
        }

        async function testDelete() {
            try {
                log('Testing atomic delete...', 'info');
                
                if (!authToken) {
                    log('Please login first', 'error');
                    return;
                }

                const select = document.getElementById('imageSelect');
                const imageId = select.value;
                
                if (!imageId || imageId === 'No images found') {
                    log('Please select an image to delete', 'error');
                    return;
                }

                log(`Deleting image ${imageId}...`, 'info');
                
                const result = await apiCall(`/image/images/${imageId}`, {
                    method: 'DELETE'
                });

                log(`Delete successful!`, 'success');
                log(`Database records deleted: ${result.databaseRecordsDeleted}`, 'success');
                log(`Files deleted: ${result.filesDeleted}`, 'success');
                
                // Refresh image list
                await getImages();
                
            } catch (error) {
                log(`Delete failed: ${error.message}`, 'error');
            }
        }

        async function checkSync() {
            try {
                log('Checking database vs storage synchronization...', 'info');
                
                if (!authToken) {
                    log('Please login first', 'error');
                    return;
                }

                // Get images from database
                const dbResult = await apiCall('/image/images');
                log(`Database shows ${dbResult.totalImages} images`, 'info');
                
                // Check each image URL for accessibility
                let syncIssues = 0;
                for (const img of dbResult.images) {
                    try {
                        // Try to access the image URL
                        const imgResponse = await fetch(img.originalImageUrl || img.processedImageUrl);
                        if (!imgResponse.ok) {
                            log(`❌ Image ${img.id}: Database record exists but file not accessible (${imgResponse.status})`, 'error');
                            syncIssues++;
                        } else {
                            log(`✅ Image ${img.id}: Database and storage in sync`, 'success');
                        }
                    } catch (error) {
                        log(`❌ Image ${img.id}: Database record exists but file not accessible (${error.message})`, 'error');
                        syncIssues++;
                    }
                }
                
                if (syncIssues === 0) {
                    log('🎉 All database records are synchronized with storage!', 'success');
                } else {
                    log(`⚠️ Found ${syncIssues} synchronization issues between database and storage`, 'error');
                }
                
            } catch (error) {
                log(`Sync check failed: ${error.message}`, 'error');
            }
        }

        // Auto-refresh images on page load
        document.addEventListener('DOMContentLoaded', function() {
            log('Atomic Operations Test loaded. Please login to start testing.', 'info');
        });
    </script>
</body>
</html>
