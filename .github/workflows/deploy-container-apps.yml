name: Deploy to Azure Container Apps (MVP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP }}
  ACR_NAME: ${{ secrets.AZ_ACR_NAME }}
  BACKEND_APP_NAME: ${{ secrets.AZ_BACKEND_APP_NAME }}
  FRONTEND_APP_NAME: ${{ secrets.AZ_FRONTEND_APP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve Azure resources (ACR login server, FQDNs)
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            if [ -z "$RESOURCE_GROUP" ] || [ -z "$ACR_NAME" ] || [ -z "$BACKEND_APP_NAME" ] || [ -z "$FRONTEND_APP_NAME" ]; then
              echo "Required secrets AZ_RESOURCE_GROUP / AZ_ACR_NAME / AZ_BACKEND_APP_NAME / AZ_FRONTEND_APP_NAME are missing" >&2
              exit 1
            fi

            ACR_LOGIN_SERVER=$(az acr show -n "$ACR_NAME" -g "$RESOURCE_GROUP" --query loginServer -o tsv)
            echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> $GITHUB_ENV

            API_FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query "properties.configuration.ingress.fqdn" -o tsv)
            WEB_FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "$FRONTEND_APP_NAME" --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "API_FQDN=$API_FQDN" >> $GITHUB_ENV
            echo "WEB_FQDN=$WEB_FQDN" >> $GITHUB_ENV

      - name: Patch frontend environment (v1) with actual API URL
        run: |
          set -euo pipefail
          file="AI.ProfilePhotoMaker.UI/src/environments/environment.v1.ts"
          if [ -f "$file" ]; then
            sed -i "s|apiUrl: '.*'|apiUrl: 'https://${API_FQDN}/api'|" "$file"
            sed -i "s|baseUrl: '.*'|baseUrl: 'https://${API_FQDN}'|" "$file"
          fi

      - name: Azure Container Registry login
        run: |
          set -euo pipefail
          az acr login -n "$ACR_NAME"

      - name: Build and push backend image
        run: |
          set -euo pipefail
          docker build -f Dockerfile.backend -t ${ACR_LOGIN_SERVER}/aiprofilemaker-api:${{ github.sha }} -t ${ACR_LOGIN_SERVER}/aiprofilemaker-api:latest .
          docker push ${ACR_LOGIN_SERVER}/aiprofilemaker-api:${{ github.sha }}
          docker push ${ACR_LOGIN_SERVER}/aiprofilemaker-api:latest

      - name: Build and push frontend image
        run: |
          set -euo pipefail
          docker build -f AI.ProfilePhotoMaker.UI/Dockerfile -t ${ACR_LOGIN_SERVER}/aiprofilemaker-web:${{ github.sha }} -t ${ACR_LOGIN_SERVER}/aiprofilemaker-web:latest .
          docker push ${ACR_LOGIN_SERVER}/aiprofilemaker-web:${{ github.sha }}
          docker push ${ACR_LOGIN_SERVER}/aiprofilemaker-web:latest

      - name: Update Container Apps to latest images and env
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az containerapp update -g "$RESOURCE_GROUP" -n "$BACKEND_APP_NAME" \
              --image ${ACR_LOGIN_SERVER}/aiprofilemaker-api:latest \
              --set-env-vars \
                AppBaseUrl=https://${WEB_FQDN} \
                ExternalApiBaseUrl=https://${API_FQDN} \
                Webhooks__BaseUrl=https://${API_FQDN}

            az containerapp update -g "$RESOURCE_GROUP" -n "$FRONTEND_APP_NAME" \
              --image ${ACR_LOGIN_SERVER}/aiprofilemaker-web:latest

      - name: Health check
        run: |
          set -euo pipefail
          curl -fsS https://${API_FQDN}/api/health | head -c 1000


