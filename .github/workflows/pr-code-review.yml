name: 🔍 PR Static Analysis

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'ClaudeDocs/**'

permissions:
  contents: read
  security-events: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  static-analysis:
    name: 🧭 Static Analysis (API + UI)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore .NET Dependencies
        run: dotnet restore AI.ProfilePhotoMaker.sln

      - name: 🐶 Setup reviewdog
        uses: reviewdog/action-setup@v1

      - name: 🐶 Annotate .NET analyzer issues (reviewdog)
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          dotnet build AI.ProfilePhotoMaker.sln \
            --no-restore \
            -c Release \
            -p:EnableNETAnalyzers=true \
            -p:AnalysisLevel=latest \
            | reviewdog -f=msbuild -name=".NET Analyzers" -reporter=github-pr-check -filter-mode=nofilter -level=error

      - name: 🔍 .NET Analyzers (bugs/best practices/perf)
        run: |
          # --no-incremental: the reviewdog step above already compiled, so an incremental build would skip the
          # compiler and report 0 warnings without checking anything.
          dotnet build AI.ProfilePhotoMaker.sln \
            --no-restore \
            --no-incremental \
            -c Release \
            -warnaserror \
            -p:EnableNETAnalyzers=true \
            -p:AnalysisLevel=latest

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: AI.ProfilePhotoMaker.UI/package-lock.json

      - name: 📦 Install UI Dependencies
        working-directory: AI.ProfilePhotoMaker.UI
        run: npm ci --no-audit --no-fund

      - name: 🐶 Annotate ESLint issues (reviewdog)
        working-directory: AI.ProfilePhotoMaker.UI
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npm run -s lint:ci | reviewdog -f=eslint -name="ESLint" -reporter=github-pr-check -filter-mode=nofilter -level=error || true

      - name: 🔍 ESLint (errors only)
        working-directory: AI.ProfilePhotoMaker.UI
        run: npm run lint:errors-only

      - name: ✅ TypeScript Type Check
        working-directory: AI.ProfilePhotoMaker.UI
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: ♿ Contrast gate (axe, mocked API)
        working-directory: AI.ProfilePhotoMaker.UI
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/axe-contrast.spec.ts tests/axe-contrast-populated.spec.ts tests/live-contrast-regressions.spec.ts --reporter=line

  # Unit tests used to run only in Simple Deploy, after the merge to main. Running them here blocks the merge instead.
  # Integration tests run too (in-memory/SQLite, no external services). Performance tests stay out: their timing
  # and allocation targets are noisy on shared runners (#446).
  tests:
    name: 🧪 Tests (API + UI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🧪 API tests (unit + integration)
        run: |
          dotnet test AI.ProfilePhotoMaker.API.Tests/AI.ProfilePhotoMaker.API.Tests.csproj \
            -c Release \
            --filter "FullyQualifiedName!~Performance" \
            --logger "trx;LogFileName=api-tests.trx" \
            --results-directory TestResults

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: AI.ProfilePhotoMaker.UI/package-lock.json

      - name: 📦 Install UI Dependencies
        working-directory: AI.ProfilePhotoMaker.UI
        env:
          HUSKY: 0
        run: npm ci --no-audit --no-fund

      - name: 🧪 UI unit tests (Karma, headless Chrome)
        working-directory: AI.ProfilePhotoMaker.UI
        env:
          CI: true
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: 📤 Upload API test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: TestResults/
          retention-days: 7

  codeql:
    name: 🛡️ CodeQL (C# + JS)
    runs-on: ubuntu-latest
    if: ${{ vars.CODEQL_ADVANCED_ENABLED == 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'csharp,javascript'

      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: 🔍 Analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:all'
      - name: 📝 Note on CodeQL default setup
        if: ${{ always() }}
        run: |
          echo "Set CODEQL_ADVANCED_ENABLED=true to run this job. Leave it unset when CodeQL default setup is enabled to avoid SARIF upload conflicts."
