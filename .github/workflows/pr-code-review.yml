name: 🔍 PR Static Analysis

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'ClaudeDocs/**'

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  static-analysis:
    name: 🧭 Static Analysis (API + UI)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore .NET Dependencies
        run: dotnet restore AI.ProfilePhotoMaker.sln

      - name: 🔍 .NET Analyzers (bugs/best practices/perf)
        run: |
          dotnet build AI.ProfilePhotoMaker.sln \
            -warnaserror \
            -p:Configuration=Release \
            -p:EnableNETAnalyzers=true \
            -p:AnalysisLevel=latest \
            -p:TreatWarningsAsErrors=true

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: AI.ProfilePhotoMaker.UI/package-lock.json

      - name: 📦 Install UI Dependencies
        working-directory: AI.ProfilePhotoMaker.UI
        run: npm ci

      - name: 🔍 ESLint (fail on warnings)
        working-directory: AI.ProfilePhotoMaker.UI
        run: npx eslint "src/**/*.{ts,html}" --max-warnings=0

      - name: ✅ TypeScript Type Check
        working-directory: AI.ProfilePhotoMaker.UI
        run: npx tsc -p tsconfig.app.json --noEmit
