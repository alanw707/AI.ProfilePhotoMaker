name: '🧪 Test & Quality Assurance (Minimal)'

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Frontend Linting (ESLint)
  frontend-linting:
    name: '⚡ Frontend Linting (ESLint)'
    runs-on: ubuntu-latest
    outputs:
      lint-errors: ${{ steps.lint-results.outputs.errors }}
      lint-warnings: ${{ steps.lint-results.outputs.warnings }}
    
    steps:
      - name: '📥 Checkout Code'
        uses: actions/checkout@v4

      - name: '⚙️ Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'AI.ProfilePhotoMaker.UI/package-lock.json'

      - name: '🔧 Install Dependencies'
        working-directory: AI.ProfilePhotoMaker.UI
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: '📋 Run ESLint'
        working-directory: AI.ProfilePhotoMaker.UI
        run: |
          echo "🔍 Running ESLint analysis..."
          
          if npm run lint:errors-only -- --format json --output-file eslint-results.json; then
            echo "✅ ESLint passed"
          else
            echo "❌ ESLint issues found"
          fi

      - name: '📊 Process Lint Results'
        id: lint-results
        if: always()
        working-directory: AI.ProfilePhotoMaker.UI
        run: |
          if [ -f "eslint-results.json" ]; then
            ERRORS=$(cat eslint-results.json | jq '[.[].messages[] | select(.severity == 2)] | length')
            WARNINGS=$(cat eslint-results.json | jq '[.[].messages[] | select(.severity == 1)] | length')
            TOTAL_FILES=$(cat eslint-results.json | jq 'length')
            
            echo "errors=$ERRORS" >> $GITHUB_OUTPUT
            echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
            
            echo "📊 ESLint Results:"
            echo "  • Files Checked: $TOTAL_FILES"
            echo "  • Errors: $ERRORS"
            echo "  • Warnings: $WARNINGS"
            
            if [ "$ERRORS" -gt 0 ]; then
              echo "::error::ESLint found $ERRORS errors"
              exit 1
            fi
          else
            echo "errors=0" >> $GITHUB_OUTPUT
            echo "warnings=0" >> $GITHUB_OUTPUT
          fi

  # TypeScript Type Checking
  frontend-typecheck:
    name: '🔍 TypeScript Type Check'
    runs-on: ubuntu-latest
    outputs:
      typecheck-status: ${{ steps.type-check.outputs.status }}
    
    steps:
      - name: '📥 Checkout Code'
        uses: actions/checkout@v4

      - name: '⚙️ Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'AI.ProfilePhotoMaker.UI/package-lock.json'

      - name: '🔧 Install Dependencies'
        working-directory: AI.ProfilePhotoMaker.UI
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: '🔍 Run TypeScript Type Check'
        id: type-check
        working-directory: AI.ProfilePhotoMaker.UI
        run: |
          echo "🔍 Running TypeScript type check..."
          
          if npm run type-check; then
            echo "✅ TypeScript type check passed"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "❌ TypeScript type errors found"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

  # .NET Code Quality
  dotnet-quality:
    name: '📝 .NET Code Quality'
    runs-on: ubuntu-latest
    outputs:
      dotnet-format-status: ${{ steps.dotnet-format.outputs.status }}
    
    steps:
      - name: '📥 Checkout Code'
        uses: actions/checkout@v4

      - name: '⚙️ Setup .NET'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: '🔧 Restore .NET Packages'
        run: dotnet restore --verbosity minimal

      - name: '📋 .NET Format Check'
        id: dotnet-format
        run: |
          echo "🔍 Checking .NET code formatting..."
          
          if dotnet format --verify-no-changes --verbosity diagnostic; then
            echo "✅ .NET code formatting is correct"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "❌ .NET code formatting issues found"
            echo "::error::Code formatting issues detected. Run 'dotnet format' to fix."
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

  # Quality Gate (Minimal)
  quality-gate:
    name: '🚪 Quality Gate (Essential)'
    runs-on: ubuntu-latest
    needs: [frontend-linting, frontend-typecheck, dotnet-quality]
    if: always()
    
    steps:
      - name: '📊 Quality Gate Analysis'
        id: quality-gate
        run: |
          echo "🚪 Evaluating essential quality criteria..."
          
          # Get results from parallel jobs
          FRONTEND_LINT_ERRORS="${{ needs.frontend-linting.outputs.lint-errors || '0' }}"
          FRONTEND_TYPECHECK_STATUS="${{ needs.frontend-typecheck.outputs.typecheck-status || 'unknown' }}"
          DOTNET_FORMAT_STATUS="${{ needs.dotnet-quality.outputs.dotnet-format-status || 'unknown' }}"
          
          # Define thresholds (deployment-blocking only)
          MAX_LINT_ERRORS=0
          
          # Evaluate criteria
          LINT_PASS=$( [ $FRONTEND_LINT_ERRORS -le $MAX_LINT_ERRORS ] && echo "true" || echo "false" )
          TYPECHECK_PASS=$( [ "$FRONTEND_TYPECHECK_STATUS" = "passed" ] && echo "true" || echo "false" )
          DOTNET_PASS=$( [ "$DOTNET_FORMAT_STATUS" = "passed" ] && echo "true" || echo "false" )
          
          # Overall gate status
          if [ "$LINT_PASS" = "true" ] && [ "$TYPECHECK_PASS" = "true" ] && [ "$DOTNET_PASS" = "true" ]; then
            GATE_STATUS="passed"
            echo "✅ Essential quality gate PASSED"
          else
            GATE_STATUS="failed"
            echo "❌ Essential quality gate FAILED"
          fi
          
          echo "gate-status=$GATE_STATUS" >> $GITHUB_OUTPUT
          
          # Essential results only
          echo "📊 Essential Quality Gate Results:"
          echo "  • Frontend Linting: $FRONTEND_LINT_ERRORS errors $([ "$LINT_PASS" = "true" ] && echo "✅" || echo "❌")"
          echo "  • TypeScript Types: $FRONTEND_TYPECHECK_STATUS $([ "$TYPECHECK_PASS" = "true" ] && echo "✅" || echo "❌")"
          echo "  • .NET Formatting: $DOTNET_FORMAT_STATUS $([ "$DOTNET_PASS" = "true" ] && echo "✅" || echo "❌")"
          
          # Create summary
          echo "## 🚪 Essential Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Overall Status: $([ "$GATE_STATUS" = "passed" ] && echo "✅ PASSED" || echo "❌ FAILED")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Essential Criteria | Result | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Linting | $FRONTEND_LINT_ERRORS errors | $([ "$LINT_PASS" = "true" ] && echo "✅ Pass" || echo "❌ Fail") |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Types | $FRONTEND_TYPECHECK_STATUS | $([ "$TYPECHECK_PASS" = "true" ] && echo "✅ Pass" || echo "❌ Fail") |" >> $GITHUB_STEP_SUMMARY
          echo "| .NET Formatting | $DOTNET_FORMAT_STATUS | $([ "$DOTNET_PASS" = "true" ] && echo "✅ Pass" || echo "❌ Fail") |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Simplified Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "- **Essential Only**: Focused on deployment-blocking issues" >> $GITHUB_STEP_SUMMARY
          echo "- **Fast Feedback**: 3 jobs instead of 8 for quicker results" >> $GITHUB_STEP_SUMMARY
          echo "- **Parallel Execution**: All checks run simultaneously" >> $GITHUB_STEP_SUMMARY
          echo "- **Progressive Enhancement**: Add more checks as project matures" >> $GITHUB_STEP_SUMMARY
          
          # Exit with error if gate failed
          if [ "$GATE_STATUS" = "failed" ]; then
            echo "::error::Essential quality gate failed - deployment blocked"
            exit 1
          fi

      - name: '📝 Update PR with Results'
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const lintErrors = '${{ needs.frontend-linting.outputs.lint-errors }}';
            const lintWarnings = '${{ needs.frontend-linting.outputs.lint-warnings }}';
            const typecheckStatus = '${{ needs.frontend-typecheck.outputs.typecheck-status }}';
            const dotnetStatus = '${{ needs.dotnet-quality.outputs.dotnet-format-status }}';
            const gateStatus = '${{ steps.quality-gate.outputs.gate-status }}';
            
            const statusIcon = gateStatus === 'passed' ? '✅' : '❌';
            const statusText = gateStatus === 'passed' ? 'PASSED' : 'FAILED';
            
            const body = `## 🚪 Essential Quality Gate ${statusIcon} ${statusText}
            
            ### 📊 Essential Quality Metrics
            | Criterion | Result | Status |
            |-----------|--------|--------|
            | **Frontend Linting** | ${lintErrors} errors, ${lintWarnings} warnings | ${lintErrors == 0 ? '✅' : '❌'} |
            | **TypeScript Types** | ${typecheckStatus} | ${typecheckStatus === 'passed' ? '✅' : '❌'} |
            | **.NET Formatting** | ${dotnetStatus} | ${dotnetStatus === 'passed' ? '✅' : '❌'} |
            
            ### 🚀 Minimal Pipeline Approach
            - **Essential Only**: Focused on deployment-blocking issues
            - **Fast Feedback**: 3 jobs instead of 8 (70% reduction)
            - **Parallel Execution**: All checks run simultaneously
            - **Progressive Enhancement**: Add more checks as needed
            
            ${gateStatus === 'failed' ? '⚠️ **Quality gate failed** - Please fix the essential issues above.' : '🎉 **All essential checks passed** - Ready for deployment!'}
            
            ---
            _Updated by [Minimal Quality Gate](../../actions/runs/${{ github.run_id }})_`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });