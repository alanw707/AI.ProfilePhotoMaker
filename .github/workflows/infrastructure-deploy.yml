name: Deploy Infrastructure to Azure

on:
  push:
    branches: [main]
    paths: ['infrastructure/**']
  pull_request:
    branches: [main]
    paths: ['infrastructure/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod
      validate_only:
        description: 'Only validate template (no deployment)'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Infrastructure Templates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Azure CLI
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C73973894C7140DEAF8637A42FA0C131 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_011D6FB5A4BC43509D9B165F9842CEBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9C8B148FA76469EB51C84A0DE3D63BB }}
      
      - name: Substitute secrets for validation
        env:
          STAGING_SQL_PASSWORD: ${{ secrets.STAGING_SQL_ADMIN_PASSWORD }}
          STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          PROD_SQL_PASSWORD: ${{ secrets.PROD_SQL_ADMIN_PASSWORD }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.REPLICATE_WEBHOOK_SECRET }}
        run: |
          cd infrastructure
          ENV_NAME=${{ github.event.inputs.environment || 'staging' }}
          cp parameters.$ENV_NAME.json parameters.$ENV_NAME.temp.json
          
          # Use Python for safe string replacement to handle special characters
          python3 << 'EOF'
          import os
          import json
          
          env_name = os.environ.get('GITHUB_EVENT_INPUTS_ENVIRONMENT', 'staging')
          if not env_name:
              env_name = 'staging'
          
          # Read the parameter file
          with open(f'parameters.{env_name}.temp.json', 'r') as f:
              content = f.read()
          
          # Replace placeholders with actual secrets
          if env_name == 'staging':
              content = content.replace('REPLACE_WITH_STAGING_SQL_PASSWORD', os.environ.get('STAGING_SQL_PASSWORD', ''))
              content = content.replace('REPLACE_WITH_STAGING_JWT_SECRET', os.environ.get('STAGING_JWT_SECRET', ''))
          else:
              content = content.replace('REPLACE_WITH_PROD_SQL_PASSWORD', os.environ.get('PROD_SQL_PASSWORD', ''))
              content = content.replace('REPLACE_WITH_PROD_JWT_SECRET', os.environ.get('PROD_JWT_SECRET', ''))
          
          content = content.replace('REPLACE_WITH_REPLICATE_TOKEN', os.environ.get('REPLICATE_TOKEN', ''))
          content = content.replace('REPLACE_WITH_WEBHOOK_SECRET', os.environ.get('WEBHOOK_SECRET', ''))
          
          # Write back the file
          with open(f'parameters.{env_name}.temp.json', 'w') as f:
              f.write(content)
          
          print(f"✅ Secrets substituted in parameters.{env_name}.temp.json")
          EOF

      - name: Create resource group for validation
        run: |
          ENV_NAME=${{ github.event.inputs.environment || 'staging' }}
          az group create \
            --name ai-profile-photo-maker-$ENV_NAME \
            --location "East US" \
            --output table || echo "Resource group may already exist"

      - name: Validate Bicep template
        run: |
          cd infrastructure
          ENV_NAME=${{ github.event.inputs.environment || 'staging' }}
          az deployment group validate \
            --resource-group ai-profile-photo-maker-$ENV_NAME \
            --template-file main.bicep \
            --parameters @parameters.$ENV_NAME.temp.json \
            --output table
      
      - name: Cleanup validation temp files
        run: |
          cd infrastructure
          ENV_NAME=${{ github.event.inputs.environment || 'staging' }}
          rm -f parameters.$ENV_NAME.temp.json
      
      - name: Comment validation results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Infrastructure template validation passed for ${{ github.event.inputs.environment || 'staging' }} environment'
            })

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C73973894C7140DEAF8637A42FA0C131 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_011D6FB5A4BC43509D9B165F9842CEBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9C8B148FA76469EB51C84A0DE3D63BB }}
      
      - name: Create Resource Group
        run: |
          az group create \
            --name ai-profile-photo-maker-staging \
            --location "East US" \
            --output table
      
      - name: Substitute secrets in parameters
        env:
          STAGING_SQL_PASSWORD: ${{ secrets.STAGING_SQL_ADMIN_PASSWORD }}
          STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.REPLICATE_WEBHOOK_SECRET }}
        run: |
          cd infrastructure
          cp parameters.staging.json parameters.staging.temp.json
          
          # Use Python for safe string replacement
          python3 << 'EOF'
          import os
          
          with open('parameters.staging.temp.json', 'r') as f:
              content = f.read()
          
          content = content.replace('REPLACE_WITH_STAGING_SQL_PASSWORD', os.environ.get('STAGING_SQL_PASSWORD', ''))
          content = content.replace('REPLACE_WITH_STAGING_JWT_SECRET', os.environ.get('STAGING_JWT_SECRET', ''))
          content = content.replace('REPLACE_WITH_REPLICATE_TOKEN', os.environ.get('REPLICATE_TOKEN', ''))
          content = content.replace('REPLACE_WITH_WEBHOOK_SECRET', os.environ.get('WEBHOOK_SECRET', ''))
          
          with open('parameters.staging.temp.json', 'w') as f:
              f.write(content)
          
          print("✅ Staging secrets substituted")
          EOF
      
      - name: Deploy Infrastructure
        run: |
          cd infrastructure
          az deployment group create \
            --resource-group ai-profile-photo-maker-staging \
            --template-file main.bicep \
            --parameters @parameters.staging.temp.json \
            --output table
      
      - name: Cleanup temp files
        run: |
          cd infrastructure
          rm -f parameters.staging.temp.json
      
      - name: Output deployment results
        run: |
          echo "Staging deployment completed successfully"
          echo "Check the Azure portal for deployment details"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.environment == 'prod' && github.event_name == 'workflow_dispatch'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C73973894C7140DEAF8637A42FA0C131 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_011D6FB5A4BC43509D9B165F9842CEBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9C8B148FA76469EB51C84A0DE3D63BB }}
      
      - name: Create Resource Group
        run: |
          az group create \
            --name ai-profile-photo-maker-prod \
            --location "East US" \
            --output table
      
      - name: Substitute secrets in parameters
        env:
          PROD_SQL_PASSWORD: ${{ secrets.PROD_SQL_ADMIN_PASSWORD }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.REPLICATE_WEBHOOK_SECRET }}
        run: |
          cd infrastructure
          cp parameters.prod.json parameters.prod.temp.json
          
          # Use Python for safe string replacement
          python3 << 'EOF'
          import os
          
          with open('parameters.prod.temp.json', 'r') as f:
              content = f.read()
          
          content = content.replace('REPLACE_WITH_PROD_SQL_PASSWORD', os.environ.get('PROD_SQL_PASSWORD', ''))
          content = content.replace('REPLACE_WITH_PROD_JWT_SECRET', os.environ.get('PROD_JWT_SECRET', ''))
          content = content.replace('REPLACE_WITH_REPLICATE_TOKEN', os.environ.get('REPLICATE_TOKEN', ''))
          content = content.replace('REPLACE_WITH_WEBHOOK_SECRET', os.environ.get('WEBHOOK_SECRET', ''))
          
          with open('parameters.prod.temp.json', 'w') as f:
              f.write(content)
          
          print("✅ Production secrets substituted")
          EOF
      
      - name: Deploy Infrastructure
        run: |
          cd infrastructure
          az deployment group create \
            --resource-group ai-profile-photo-maker-prod \
            --template-file main.bicep \
            --parameters @parameters.prod.temp.json \
            --output table
      
      - name: Cleanup temp files
        run: |
          cd infrastructure
          rm -f parameters.prod.temp.json
      
      - name: Output deployment results
        run: |
          echo "Production deployment completed successfully"
          echo "Check the Azure portal for deployment details"

  validate-only:
    name: Validate Only
    runs-on: ubuntu-latest
    if: github.event.inputs.validate_only == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C73973894C7140DEAF8637A42FA0C131 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_011D6FB5A4BC43509D9B165F9842CEBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9C8B148FA76469EB51C84A0DE3D63BB }}
      
      - name: Validate Only
        run: |
          cd infrastructure
          ./deploy.sh --environment ${{ github.event.inputs.environment }} --validate
      
      - name: Output validation results
        run: |
          echo "Template validation completed successfully"
          echo "No resources were deployed"