name: Deploy Infrastructure to Azure

on:
  push:
    branches: [main]
    paths: ['infrastructure/**']
  pull_request:
    branches: [main]
    paths: ['infrastructure/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod
      validate_only:
        description: 'Only validate template (no deployment)'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Infrastructure Templates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Azure CLI
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C73973894C7140DEAF8637A42FA0C131 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_011D6FB5A4BC43509D9B165F9842CEBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9C8B148FA76469EB51C84A0DE3D63BB }}
      
      - name: Substitute secrets for validation
        run: |
          cd infrastructure
          ENV_NAME=${{ github.event.inputs.environment || 'staging' }}
          cp parameters.$ENV_NAME.json parameters.$ENV_NAME.temp.json
          
          if [ "$ENV_NAME" = "staging" ]; then
            sed -i 's/REPLACE_WITH_STAGING_SQL_PASSWORD/${{ secrets.STAGING_SQL_ADMIN_PASSWORD }}/g' parameters.$ENV_NAME.temp.json
            sed -i 's/REPLACE_WITH_STAGING_JWT_SECRET/${{ secrets.STAGING_JWT_SECRET }}/g' parameters.$ENV_NAME.temp.json
          else
            sed -i 's/REPLACE_WITH_PROD_SQL_PASSWORD/${{ secrets.PROD_SQL_ADMIN_PASSWORD }}/g' parameters.$ENV_NAME.temp.json
            sed -i 's/REPLACE_WITH_PROD_JWT_SECRET/${{ secrets.PROD_JWT_SECRET }}/g' parameters.$ENV_NAME.temp.json
          fi
          
          sed -i 's/REPLACE_WITH_REPLICATE_TOKEN/${{ secrets.REPLICATE_API_TOKEN }}/g' parameters.$ENV_NAME.temp.json
          sed -i 's/REPLACE_WITH_WEBHOOK_SECRET/${{ secrets.REPLICATE_WEBHOOK_SECRET }}/g' parameters.$ENV_NAME.temp.json

      - name: Create resource group for validation
        run: |
          ENV_NAME=${{ github.event.inputs.environment || 'staging' }}
          az group create \
            --name ai-profile-photo-maker-$ENV_NAME \
            --location "East US" \
            --output table || echo "Resource group may already exist"

      - name: Validate Bicep template
        run: |
          cd infrastructure
          ENV_NAME=${{ github.event.inputs.environment || 'staging' }}
          az deployment group validate \
            --resource-group ai-profile-photo-maker-$ENV_NAME \
            --template-file main.bicep \
            --parameters @parameters.$ENV_NAME.temp.json \
            --output table
      
      - name: Cleanup validation temp files
        run: |
          cd infrastructure
          ENV_NAME=${{ github.event.inputs.environment || 'staging' }}
          rm -f parameters.$ENV_NAME.temp.json
      
      - name: Comment validation results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Infrastructure template validation passed for ${{ github.event.inputs.environment || 'staging' }} environment'
            })

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C73973894C7140DEAF8637A42FA0C131 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_011D6FB5A4BC43509D9B165F9842CEBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9C8B148FA76469EB51C84A0DE3D63BB }}
      
      - name: Create Resource Group
        run: |
          az group create \
            --name ai-profile-photo-maker-staging \
            --location "East US" \
            --output table
      
      - name: Substitute secrets in parameters
        run: |
          cd infrastructure
          # Create a copy of the parameters file with secrets substituted
          cp parameters.staging.json parameters.staging.temp.json
          sed -i 's/REPLACE_WITH_STAGING_SQL_PASSWORD/${{ secrets.STAGING_SQL_ADMIN_PASSWORD }}/g' parameters.staging.temp.json
          sed -i 's/REPLACE_WITH_REPLICATE_TOKEN/${{ secrets.REPLICATE_API_TOKEN }}/g' parameters.staging.temp.json
          sed -i 's/REPLACE_WITH_STAGING_JWT_SECRET/${{ secrets.STAGING_JWT_SECRET }}/g' parameters.staging.temp.json
          sed -i 's/REPLACE_WITH_WEBHOOK_SECRET/${{ secrets.REPLICATE_WEBHOOK_SECRET }}/g' parameters.staging.temp.json
      
      - name: Deploy Infrastructure
        run: |
          cd infrastructure
          az deployment group create \
            --resource-group ai-profile-photo-maker-staging \
            --template-file main.bicep \
            --parameters @parameters.staging.temp.json \
            --output table
      
      - name: Cleanup temp files
        run: |
          cd infrastructure
          rm -f parameters.staging.temp.json
      
      - name: Output deployment results
        run: |
          echo "Staging deployment completed successfully"
          echo "Check the Azure portal for deployment details"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.environment == 'prod' && github.event_name == 'workflow_dispatch'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C73973894C7140DEAF8637A42FA0C131 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_011D6FB5A4BC43509D9B165F9842CEBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9C8B148FA76469EB51C84A0DE3D63BB }}
      
      - name: Create Resource Group
        run: |
          az group create \
            --name ai-profile-photo-maker-prod \
            --location "East US" \
            --output table
      
      - name: Substitute secrets in parameters
        run: |
          cd infrastructure
          # Create a copy of the parameters file with secrets substituted
          cp parameters.prod.json parameters.prod.temp.json
          sed -i 's/REPLACE_WITH_PROD_SQL_PASSWORD/${{ secrets.PROD_SQL_ADMIN_PASSWORD }}/g' parameters.prod.temp.json
          sed -i 's/REPLACE_WITH_REPLICATE_TOKEN/${{ secrets.REPLICATE_API_TOKEN }}/g' parameters.prod.temp.json
          sed -i 's/REPLACE_WITH_PROD_JWT_SECRET/${{ secrets.PROD_JWT_SECRET }}/g' parameters.prod.temp.json
          sed -i 's/REPLACE_WITH_WEBHOOK_SECRET/${{ secrets.REPLICATE_WEBHOOK_SECRET }}/g' parameters.prod.temp.json
      
      - name: Deploy Infrastructure
        run: |
          cd infrastructure
          az deployment group create \
            --resource-group ai-profile-photo-maker-prod \
            --template-file main.bicep \
            --parameters @parameters.prod.temp.json \
            --output table
      
      - name: Cleanup temp files
        run: |
          cd infrastructure
          rm -f parameters.prod.temp.json
      
      - name: Output deployment results
        run: |
          echo "Production deployment completed successfully"
          echo "Check the Azure portal for deployment details"

  validate-only:
    name: Validate Only
    runs-on: ubuntu-latest
    if: github.event.inputs.validate_only == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C73973894C7140DEAF8637A42FA0C131 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_011D6FB5A4BC43509D9B165F9842CEBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9C8B148FA76469EB51C84A0DE3D63BB }}
      
      - name: Validate Only
        run: |
          cd infrastructure
          ./deploy.sh --environment ${{ github.event.inputs.environment }} --validate
      
      - name: Output validation results
        run: |
          echo "Template validation completed successfully"
          echo "No resources were deployed"