name: 🚀 Simple Deploy (Local Build to MVP environment)
# Simplified deployment workflow for local build approach
# Prerequisites: Images must be built locally and pushed to ACR first
# 1. Build images locally: ./scripts/build-local.sh
# 2. Push to ACR: ./scripts/push-to-acr.sh  
# 3. Deploy infrastructure: This workflow (triggered by git push)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests for quick deploy'
        required: false
        default: false
        type: boolean

env:
  RESOURCE_GROUP: aiprofilemaker-v1
  # Use a timestamped image tag for each deployment to avoid stale :latest
  IMAGE_TAG: ${{ github.run_number }}-${{ github.run_id }}
  
permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest    
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: AI.ProfilePhotoMaker.UI/package-lock.json
          
      - name: 🧪 Test Backend
        run: |
          cd AI.ProfilePhotoMaker.API
          dotnet restore
          dotnet build --configuration Release
          
      - name: 🧪 Test Frontend
        run: |
          cd AI.ProfilePhotoMaker.UI
          npm ci
          npm run lint:errors-only
          npm run build:mvp-v1

  validate-secrets:
    name: 🔐 Validate Secrets
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🔐 Validate GitHub Actions Secrets
        env:
          # Required secrets for validation - ALL REQUIRED (referenced in infrastructure)
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          REPLICATE_WEBHOOK_SECRET: ${{ secrets.REPLICATE_WEBHOOK_SECRET }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER_NAME: ${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
        run: |
          echo "🔍 Validating GitHub Actions secrets for deployment..."
          
          # Function to validate secret
          validate_secret() {
            local secret_name="$1"
            local secret_value="$2"
            local min_length="${3:-1}"
            
            if [[ -z "$secret_value" ]]; then
              echo "❌ MISSING: $secret_name"
              return 1
            elif [[ ${#secret_value} -lt $min_length ]]; then
              echo "❌ TOO SHORT: $secret_name (${#secret_value} chars, min: $min_length)"
              return 1
            else
              echo "✅ VALID: $secret_name (${#secret_value} chars)"
              return 0
            fi
          }
          
          # Validate all required secrets
          errors=0
          
          validate_secret "AZURE_CLIENT_ID" "$AZURE_CLIENT_ID" 30 || ((errors++))
          validate_secret "AZURE_SUBSCRIPTION_ID" "$AZURE_SUBSCRIPTION_ID" 30 || ((errors++))
          validate_secret "AZURE_TENANT_ID" "$AZURE_TENANT_ID" 30 || ((errors++))
          validate_secret "JWT_SECRET" "$JWT_SECRET" 32 || ((errors++))
          # Enhanced Azure SQL password validation (production requires stronger passwords)
          if [[ -z "$SQL_ADMIN_PASSWORD" ]]; then
            echo "❌ MISSING: SQL_ADMIN_PASSWORD"
            ((errors++))
          elif [[ ${#SQL_ADMIN_PASSWORD} -lt 8 ]]; then
            echo "❌ TOO SHORT: SQL_ADMIN_PASSWORD (${#SQL_ADMIN_PASSWORD} chars, min: 8)"
            ((errors++))
          elif [[ ${#SQL_ADMIN_PASSWORD} -gt 128 ]]; then
            echo "❌ TOO LONG: SQL_ADMIN_PASSWORD (${#SQL_ADMIN_PASSWORD} chars, max: 128)"
            ((errors++))
          elif [[ ! "$SQL_ADMIN_PASSWORD" =~ [A-Z] ]]; then
            echo "❌ INVALID: SQL_ADMIN_PASSWORD must contain uppercase letters (Azure SQL requirement)"
            ((errors++))
          elif [[ ! "$SQL_ADMIN_PASSWORD" =~ [a-z] ]]; then
            echo "❌ INVALID: SQL_ADMIN_PASSWORD must contain lowercase letters (Azure SQL requirement)"
            ((errors++))
          elif [[ ! "$SQL_ADMIN_PASSWORD" =~ [0-9] ]]; then
            echo "❌ INVALID: SQL_ADMIN_PASSWORD must contain numbers (Azure SQL requirement)"
            ((errors++))
          elif [[ "$SQL_ADMIN_PASSWORD" != *"!"* && "$SQL_ADMIN_PASSWORD" != *"@"* && "$SQL_ADMIN_PASSWORD" != *"#"* && "$SQL_ADMIN_PASSWORD" != *"$"* && "$SQL_ADMIN_PASSWORD" != *"%"* && "$SQL_ADMIN_PASSWORD" != *"^"* && "$SQL_ADMIN_PASSWORD" != *"&"* && "$SQL_ADMIN_PASSWORD" != *"*"* && "$SQL_ADMIN_PASSWORD" != *"("* && "$SQL_ADMIN_PASSWORD" != *")"* && "$SQL_ADMIN_PASSWORD" != *"-"* && "$SQL_ADMIN_PASSWORD" != *"_"* && "$SQL_ADMIN_PASSWORD" != *"+"* && "$SQL_ADMIN_PASSWORD" != *"="* ]]; then
            echo "❌ INVALID: SQL_ADMIN_PASSWORD must contain special characters (Azure SQL requirement)"
            ((errors++))
          elif [[ "$SQL_ADMIN_PASSWORD" =~ (Test|test|Dev|dev|Pass|pass|Admin|admin|123|password|Password) ]]; then
            echo "❌ INSECURE: SQL_ADMIN_PASSWORD contains common weak patterns (not suitable for production)"
            echo "   Avoid: Test, Dev, Pass, Admin, 123, password variations"
            ((errors++))
          else
            echo "✅ VALID: SQL_ADMIN_PASSWORD (Azure SQL complexity requirements met)"
          fi
          validate_secret "REPLICATE_API_TOKEN" "$REPLICATE_API_TOKEN" 20 || ((errors++))
          validate_secret "REPLICATE_WEBHOOK_SECRET" "$REPLICATE_WEBHOOK_SECRET" 32 || ((errors++))
          
          # Enhanced Google OAuth validation (detect the current production issue)
          if [[ -z "$GOOGLE_CLIENT_ID" ]]; then
            echo "❌ MISSING: GOOGLE_CLIENT_ID"
            ((errors++))
          elif [[ "$GOOGLE_CLIENT_ID" == *"Specify --help"* ]] || [[ "$GOOGLE_CLIENT_ID" == *"command"* ]]; then
            echo "❌ INVALID: GOOGLE_CLIENT_ID contains help text instead of OAuth client ID"
            echo "   Current value appears to be: ${GOOGLE_CLIENT_ID:0:50}..."
            echo "   Expected format: 123456789-abc123.apps.googleusercontent.com"
            ((errors++))
          elif [[ ! "$GOOGLE_CLIENT_ID" == *".apps.googleusercontent.com" ]]; then
            echo "❌ INVALID: GOOGLE_CLIENT_ID should end with .apps.googleusercontent.com"
            ((errors++))
          else
            echo "✅ VALID: GOOGLE_CLIENT_ID (OAuth format confirmed)"
          fi
          
          validate_secret "GOOGLE_CLIENT_SECRET" "$GOOGLE_CLIENT_SECRET" 20 || ((errors++))
          
          # Stripe secrets validation - ALL REQUIRED (referenced in infrastructure)
          validate_secret "STRIPE_SECRET_KEY" "$STRIPE_SECRET_KEY" 20 || ((errors++))
          validate_secret "STRIPE_PUBLISHABLE_KEY" "$STRIPE_PUBLISHABLE_KEY" 20 || ((errors++))
          validate_secret "STRIPE_WEBHOOK_SECRET" "$STRIPE_WEBHOOK_SECRET" 20 || ((errors++))
          
          # Azure Storage secrets validation - REQUIRED (referenced in infrastructure)
          validate_secret "AZURE_STORAGE_CONNECTION_STRING" "$AZURE_STORAGE_CONNECTION_STRING" 50 || ((errors++))
          validate_secret "AZURE_STORAGE_CONTAINER_NAME" "$AZURE_STORAGE_CONTAINER_NAME" 3 || ((errors++))
          
          echo ""
          if [[ $errors -eq 0 ]]; then
            echo "✅ All secrets validation passed! Deployment can proceed."
          else
            echo "❌ Secrets validation failed with $errors error(s)"
            echo "🛑 DEPLOYMENT BLOCKED - Fix secrets before deploying"
            exit 1
          fi

  deploy:
    name: 🚀 Simple Deploy
    runs-on: ubuntu-latest
    needs: [test, validate-secrets]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.validate-secrets.result == 'success')
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🔧 Install Azure CLI
        run: |
          echo "🔧 [SETUP] Azure CLI is pre-installed on Ubuntu runners"
          az version
          
      - name: 🔐 Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🐳 Login to ACR
        run: |
          az acr login --name aipmcrv16j74jubocuukg

      - name: 🏗️ Build Docker images (backend/frontend)
        run: |
          IMAGE_TAG=${{ env.IMAGE_TAG }} ./scripts/build-local.sh

      - name: 📤 Push Docker images to ACR
        run: |
          IMAGE_TAG=${{ env.IMAGE_TAG }} ./scripts/push-to-acr.sh
          
      - name: 🏗️ Ensure Resource Group
        run: |
          echo "🏗️ [SETUP] Creating resource group if it doesn't exist..."
          
          # Check if resource group exists
          if az group show --name "${{ env.RESOURCE_GROUP }}" --output none 2>/dev/null; then
            echo "✅ [SUCCESS] Resource group already exists"
          else
            echo "📝 [INFO] Creating new resource group: ${{ env.RESOURCE_GROUP }}"
            az group create \
              --name "${{ env.RESOURCE_GROUP }}" \
              --location "East US 2" \
              --tags Environment=v1 Application=AIProfileMaker
            echo "✅ [SUCCESS] Resource group created successfully"
          fi
          
          # Show resource group details
          echo "📊 [INFO] Resource Group Details:"
          az group show --name "${{ env.RESOURCE_GROUP }}" --query "{Name:name, Location:location, Status:properties.provisioningState}" --output table
          
      - name: 🔍 Validate Infrastructure Configuration
        run: |
          echo "🔍 [VALIDATE] Validating infrastructure configuration alignment..."
          
          # Compile Bicep template
          echo "📝 [INFO] Compiling Bicep template..."
          az bicep build --file infrastructure/simple-deploy.bicep
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Bicep template compilation failed"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Bicep template compiled successfully"
          
          # Extract environment variables from Bicep template
          echo ""
          echo "📊 [ANALYSIS] Extracting environment variables from Bicep template..."
          
          # Parse Bicep file for environment variable definitions
          BICEP_ENV_VARS=$(grep -E "^\s*name:\s*'[A-Z_]+'" infrastructure/simple-deploy.bicep | sed "s/.*name: '//" | sed "s/'.*$//" | sort -u)
          
          # Also extract ASP.NET Core configuration pattern variables (Section__Key format)
          BICEP_CONFIG_VARS=$(grep -E "^\s*name:\s*'[A-Za-z]+__[A-Za-z]+'" infrastructure/simple-deploy.bicep | sed "s/.*name: '//" | sed "s/'.*$//" | sort -u)
          
          echo "🔍 [FOUND] Environment variables defined in Bicep template:"
          echo "$BICEP_ENV_VARS" | while read var; do
            echo "  • $var"
          done
          
          if [[ -n "$BICEP_CONFIG_VARS" ]]; then
            echo ""
            echo "🔍 [FOUND] ASP.NET Core configuration variables in Bicep template:"
            echo "$BICEP_CONFIG_VARS" | while read var; do
              echo "  • $var"
            done
          fi
          
          # Extract environment variable constants from EnvironmentConfiguration.cs
          echo ""
          echo "📊 [ANALYSIS] Extracting expected environment variables from application code..."
          
          APP_ENV_VARS=$(grep -E "^\s*public const string [A-Z_]+ = \"[A-Z_]+\";" AI.ProfilePhotoMaker.API/Configuration/EnvironmentConfiguration.cs | sed -E 's/.*= "([^"]+)".*/\1/' | sort -u)
          
          echo "🔍 [FOUND] Environment variables expected by application:"
          echo "$APP_ENV_VARS" | while read var; do
            echo "  • $var"
          done
          
          # Cross-reference critical environment variables
          echo ""
          echo "🔍 [VALIDATION] Cross-referencing critical environment variables..."
          
          # Critical variables that must match between Bicep and application
          CRITICAL_VARS=(
            "AZURE_STORAGE_CONNECTION_STRING"
            "AZURE_STORAGE_CONTAINER_NAME"
            "JWT_SECRET"
            "REPLICATE_API_TOKEN"
            "REPLICATE_WEBHOOK_SECRET"
            "GOOGLE_CLIENT_ID"
            "GOOGLE_CLIENT_SECRET"
          )
          
          validation_errors=0
          
          # Function to check if a variable is provided in infrastructure (direct or config pattern)
          check_infrastructure_provides() {
            local var_name="$1"
            
            # Check direct environment variable
            local direct_match=$(echo "$BICEP_ENV_VARS" | grep -x "$var_name" || true)
            if [[ -n "$direct_match" ]]; then
              echo "direct"
              return 0
            fi
            
            # Check ASP.NET Core configuration pattern mappings
            case "$var_name" in
              "JWT_SECRET")
                local config_match=$(echo "$BICEP_CONFIG_VARS" | grep -x "Jwt__Secret" || true)
                if [[ -n "$config_match" ]]; then
                  echo "config:Jwt__Secret"
                  return 0
                fi
                ;;
              "REPLICATE_API_TOKEN")
                local config_match=$(echo "$BICEP_CONFIG_VARS" | grep -x "Replicate__ApiToken" || true)
                if [[ -n "$config_match" ]]; then
                  echo "config:Replicate__ApiToken"
                  return 0
                fi
                ;;
              "REPLICATE_WEBHOOK_SECRET")
                local config_match=$(echo "$BICEP_CONFIG_VARS" | grep -x "Replicate__WebhookSecret" || true)
                if [[ -n "$config_match" ]]; then
                  echo "config:Replicate__WebhookSecret"
                  return 0
                fi
                ;;
              "AZURE_STORAGE_CONNECTION_STRING")
                # Check for ConnectionStrings__AzureStorage (primary pattern)
                local conn_match=$(echo "$BICEP_CONFIG_VARS" | grep -x "ConnectionStrings__AzureStorage" || true)
                if [[ -n "$conn_match" ]]; then
                  echo "config:ConnectionStrings__AzureStorage"
                  return 0
                fi
                # Check for AzureStorage__ConnectionString (fallback pattern)
                local storage_match=$(echo "$BICEP_CONFIG_VARS" | grep -x "AzureStorage__ConnectionString" || true)
                if [[ -n "$storage_match" ]]; then
                  echo "config:AzureStorage__ConnectionString"
                  return 0
                fi
                ;;
              "AZURE_STORAGE_CONTAINER_NAME")
                local config_match=$(echo "$BICEP_CONFIG_VARS" | grep -x "AzureStorage__ContainerName" || true)
                if [[ -n "$config_match" ]]; then
                  echo "config:AzureStorage__ContainerName"
                  return 0
                fi
                ;;
            esac
            
            # Check if it's provided via connection string pattern
            if [[ "$var_name" == "MSSQL_SA_PASSWORD" ]]; then
              local conn_match=$(echo "$BICEP_CONFIG_VARS" | grep -x "ConnectionStrings__DefaultConnection" || true)
              if [[ -n "$conn_match" ]]; then
                echo "config:ConnectionStrings__DefaultConnection"
                return 0
              fi
            fi
            
            echo ""
            return 1
          }
          
          # Check each critical variable
          for var in "${CRITICAL_VARS[@]}"; do
            infrastructure_provides=$(check_infrastructure_provides "$var")
            app_expects_var=$(echo "$APP_ENV_VARS" | grep -x "$var" || true)
            
            echo -n "  Checking $var: "
            
            if [[ -n "$app_expects_var" ]]; then
              if [[ -n "$infrastructure_provides" ]]; then
                if [[ "$infrastructure_provides" == "direct" ]]; then
                  echo "✅ MATCH (Direct environment variable)"
                else
                  echo "✅ MATCH (Via $infrastructure_provides)"
                fi
              else
                echo "❌ MISSING in Bicep template (Application expects this variable)"
                ((validation_errors++))
              fi
            else
              if [[ -n "$infrastructure_provides" ]]; then
                echo "⚠️  PROVIDED but not explicitly expected (May be unused)"
              else
                echo "ℹ️  Not configured (Neither provided nor expected)"
              fi
            fi
          done
          
          # Check for specific naming mismatches that have caused issues
          echo ""
          echo "🔍 [MISMATCH DETECTION] Checking for common naming pattern issues..."
          
          # Look for similar but incorrect variable names in Bicep
          BICEP_SIMILAR_VARS=$(grep -E "^\s*name:\s*'[A-Za-z_]*[Ss]torage[A-Za-z_]*'" infrastructure/simple-deploy.bicep | sed "s/.*name: '//" | sed "s/'.*$//" || true)
          if [[ -n "$BICEP_SIMILAR_VARS" ]]; then
            echo "🔍 [FOUND] Storage-related variables in Bicep:"
            echo "$BICEP_SIMILAR_VARS" | while read var; do
              # Valid Azure Storage configuration patterns - these are correct and should not be flagged as errors
              if [[ "$var" == "AZURE_STORAGE_CONNECTION_STRING" || "$var" == "AZURE_STORAGE_CONTAINER_NAME" || 
                    "$var" == "ConnectionStrings__AzureStorage" || "$var" == "AzureStorage__ConnectionString" || "$var" == "AzureStorage__ContainerName" ]]; then
                echo "  ✅ $var (Correct Azure Storage configuration pattern)"
              else
                echo "  ⚠️  $var (Potential mismatch - check if this should be AZURE_STORAGE_*)"
                ((validation_errors++))
              fi
            done
          fi
          
          # Check for ConnectionStrings pattern vs direct environment variables
          BICEP_CONN_STRINGS=$(grep -E "ConnectionStrings__" infrastructure/simple-deploy.bicep || true)
          if [[ -n "$BICEP_CONN_STRINGS" ]]; then
            echo ""
            echo "ℹ️  [INFO] Found ConnectionStrings__ pattern in Bicep (this is correct for ASP.NET Core)"
            echo "$BICEP_CONN_STRINGS" | while read line; do
              echo "    $line"
            done
          fi
          
          # Final validation summary
          echo ""
          echo "📊 [SUMMARY] Infrastructure validation results:"
          if [[ $validation_errors -eq 0 ]]; then
            echo "✅ All critical environment variables are properly aligned between infrastructure and application"
            echo "✅ No naming mismatches detected"
            echo "✅ Infrastructure configuration validation PASSED"
          else
            echo "❌ Found $validation_errors validation error(s)"
            echo "❌ Infrastructure and application environment variable configuration MISMATCH detected"
            echo ""
            echo "🛠️  [FIX] To resolve these issues:"
            echo "  1. Check infrastructure/simple-deploy.bicep for environment variable names"
            echo "  2. Compare against constants in AI.ProfilePhotoMaker.API/Configuration/EnvironmentConfiguration.cs"
            echo "  3. Ensure exact name matching (case-sensitive)"
            echo "  4. Common mistake: AzureStorage__ConnectionString vs AZURE_STORAGE_CONNECTION_STRING"
            echo ""
            echo "🚫 DEPLOYMENT BLOCKED - Fix environment variable mismatches before deploying"
            exit 1
          fi
          
          # Standard Bicep deployment validation
          echo ""
          echo "🧪 [INFO] Validating Bicep deployment template..."
          
          # Create Azure parameters file for reliable parameter passing
          echo "🔍 [SOLUTION] Using parameters file approach to fix parameter parsing issues..."
          
          # Create parameters file with environment variable expansion
          cat > deployment-parameters.json << EOF
          {
            "\$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            "contentVersion": "1.0.0.0",
            "parameters": {
              "sqlAdminPassword": {
                "value": "${{ secrets.SQL_ADMIN_PASSWORD }}"
              },
              "jwtSecret": {
                "value": "${{ secrets.JWT_SECRET }}"
              },
              "replicateApiToken": {
                "value": "${{ secrets.REPLICATE_API_TOKEN }}"
              },
              "replicateWebhookSecret": {
                "value": "${{ secrets.REPLICATE_WEBHOOK_SECRET }}"
              },
              "googleClientId": {
                "value": "${{ secrets.GOOGLE_CLIENT_ID }}"
              },
              "googleClientSecret": {
                "value": "${{ secrets.GOOGLE_CLIENT_SECRET }}"
              },
              "stripeSecretKey": {
                "value": "${{ secrets.STRIPE_SECRET_KEY }}"
              },
              "stripePublishableKey": {
                "value": "${{ secrets.STRIPE_PUBLISHABLE_KEY }}"
              },
              "stripeWebhookSecret": {
                "value": "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
              }
            }
          }
          EOF
          
          echo "✅ [SUCCESS] Parameters file created with all required parameters"
          echo "🔍 [DEBUG] Parameter file keys:"
          jq -r '.parameters | keys[]' deployment-parameters.json
          
          # Run validation using parameters file (much more reliable than inline parameters)
          echo "🧪 [INFO] Validating Bicep deployment with parameters file..."
          az deployment group validate \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --template-file infrastructure/simple-deploy.bicep \
            --parameters @deployment-parameters.json imageTag='${{ env.IMAGE_TAG }}' \
            --verbose
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Bicep deployment validation failed"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Infrastructure configuration validation completed successfully"
          
      - name: 🏗️ Deploy Infrastructure
        id: infra
        run: |
          echo "🚀 [DEPLOY] Starting infrastructure deployment..."
          echo "📝 [INFO] This deployment expects images to already exist in ACR"
          echo "📝 [INFO] If images are missing, run: ./scripts/build-local.sh && ./scripts/push-to-acr.sh"
          echo ""
          
          # Cancel any running deployments first
          echo "🧹 [CLEANUP] Checking for and canceling running deployments..."
          RUNNING_DEPLOYMENTS=$(az deployment group list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?properties.provisioningState=='Running'].name" --output tsv 2>/dev/null || true)
          
          if [ -n "$RUNNING_DEPLOYMENTS" ]; then
            echo "⏹️ [CANCEL] Found running deployments, canceling them..."
            echo "$RUNNING_DEPLOYMENTS" | while read deployment; do
              echo "⏹️ [CANCEL] Canceling deployment: $deployment"
              az deployment group cancel --resource-group "${{ env.RESOURCE_GROUP }}" --name "$deployment" || true
            done
          else
            echo "✅ [INFO] No running deployments to cancel"
          fi
          
          # Generate unique deployment name
          DEPLOYMENT_NAME="simple-deploy-$RANDOM-$(date +%Y%m%d-%H%M%S)"
          echo "📝 [INFO] Deployment name: $DEPLOYMENT_NAME"
          
          # Deploy with retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "🔄 [INFO] Attempt $RETRY_COUNT of $MAX_RETRIES"
            
            # Debug: Confirm parameters for deployment
            echo "🔍 [DEBUG] Deployment parameters:"
            echo "  sqlAdminPassword: ✓"
            echo "  jwtSecret: ✓"
            echo "  replicateApiToken: ✓"
            echo "  replicateWebhookSecret: ✓"
            echo "  googleClientId: ✓"
            echo "  googleClientSecret: ✓"
            echo "  stripeSecretKey: ✓"
            echo "  stripePublishableKey: ✓"
            echo "  stripeWebhookSecret: ✓"
            
            # Start deployment using parameters file (consistent with validation step)
            if az deployment group create \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --template-file infrastructure/simple-deploy.bicep \
              --name "$DEPLOYMENT_NAME" \
              --mode Incremental \
              --parameters @deployment-parameters.json imageTag='${{ env.IMAGE_TAG }}' \
              --output json > deployment_result.json; then
              
              echo "✅ [SUCCESS] Deployment completed successfully!"
              break
            else
              echo "⚠️ [WARNING] Deployment attempt $RETRY_COUNT failed"
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⏳ [INFO] Waiting 30 seconds before retry..."
                sleep 30
              else
                echo "❌ [ERROR] Deployment failed after $MAX_RETRIES attempts"
                echo ""
                echo "🔍 [DEBUG] Common issues:"
                echo "  1. Images missing from ACR - run: ./scripts/build-local.sh && ./scripts/push-to-acr.sh"
                echo "  2. ACR authentication issues - check ACR admin credentials"
                echo "  3. Resource quota limits - check Azure quotas"
                echo ""
                cat deployment_result.json 2>/dev/null || echo "No deployment result available"
                exit 1
              fi
            fi
          done
          
          # Get deployment outputs
          echo "📤 [INFO] Retrieving deployment outputs..."
          DEPLOYMENT_OUTPUTS=$(az deployment group show --resource-group "${{ env.RESOURCE_GROUP }}" --name "$DEPLOYMENT_NAME" --query "properties.outputs" --output json)
          
          if [ -z "$DEPLOYMENT_OUTPUTS" ] || [ "$DEPLOYMENT_OUTPUTS" = "null" ]; then
            echo "❌ [ERROR] No outputs found in deployment"
            exit 1
          fi
          
          # Extract outputs using jq
          REGISTRY_NAME=$(echo "$DEPLOYMENT_OUTPUTS" | jq -r '.containerRegistryName.value // empty')
          REGISTRY_SERVER=$(echo "$DEPLOYMENT_OUTPUTS" | jq -r '.containerRegistryLoginServer.value // empty')
          FRONTEND_URL=$(echo "$DEPLOYMENT_OUTPUTS" | jq -r '.frontendUrl.value // empty')
          BACKEND_URL=$(echo "$DEPLOYMENT_OUTPUTS" | jq -r '.backendUrl.value // empty')
          
          # Validate required outputs
          if [ -z "$REGISTRY_NAME" ] || [ -z "$REGISTRY_SERVER" ] || [ -z "$FRONTEND_URL" ] || [ -z "$BACKEND_URL" ]; then
            echo "❌ [ERROR] Missing required outputs from deployment:"
            echo "  Registry Name: '$REGISTRY_NAME'"
            echo "  Registry Server: '$REGISTRY_SERVER'"
            echo "  Frontend URL: '$FRONTEND_URL'"
            echo "  Backend URL: '$BACKEND_URL'"
            exit 1
          fi
          
          # Set GitHub outputs
          echo "registry-name=$REGISTRY_NAME" >> $GITHUB_OUTPUT
          echo "registry-server=$REGISTRY_SERVER" >> $GITHUB_OUTPUT
          echo "frontend-url=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "backend-url=$BACKEND_URL" >> $GITHUB_OUTPUT
          
          # Export storage account name for later CORS validation
          STORAGE_ACCOUNT=$(echo "$DEPLOYMENT_OUTPUTS" | jq -r '.storageAccountName.value // empty')
          if [ -z "$STORAGE_ACCOUNT" ] || [ "$STORAGE_ACCOUNT" = "null" ]; then
            echo "⚠️  [WARN] storageAccountName not found in outputs; falling back to known production account"
            STORAGE_ACCOUNT="aipmstv16j74jubocuukg"
          fi
          echo "STORAGE_ACCOUNT=$STORAGE_ACCOUNT" >> $GITHUB_ENV
          
          echo "📊 [INFO] Infrastructure outputs:"
          echo "  Registry: $REGISTRY_SERVER"
          echo "  Frontend: $FRONTEND_URL"
          echo "  Backend: $BACKEND_URL"
          echo "✅ [SUCCESS] Infrastructure deployment completed successfully!"
          
      - name: 🔍 Post-Deployment Storage Validation
        run: |
          echo "🔍 [VALIDATE] Performing post-deployment Azure Storage validation..."
          echo "📝 [INFO] This validates that container apps have correct environment variables"
          
          # Wait for container app to be fully updated
          echo "⏳ [INFO] Waiting for container app to stabilize after deployment..."
          sleep 15
          
          # Function to validate storage environment variables in container app
          validate_storage_config() {
            local app_name="$1"
            local validation_errors=0
            
            echo "🔍 [CHECK] Validating storage configuration for: $app_name"
            
            # Get all environment variables from the container app
            echo "📋 [INFO] Retrieving environment variables from container app..."
            local env_vars=$(az containerapp show --name "$app_name" --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "properties.template.containers[0].env[].name" --output tsv 2>/dev/null || echo "")
            
            if [[ -z "$env_vars" ]]; then
              echo "❌ [ERROR] Failed to retrieve environment variables from $app_name"
              return 1
            fi
            
            echo "📊 [FOUND] Environment variables in $app_name:"
            echo "$env_vars" | while read var; do
              echo "  • $var"
            done
            
            # Check for required Azure Storage environment variables
            echo ""
            echo "🔍 [VALIDATE] Checking required Azure Storage environment variables..."
            
            # Check for ConnectionStrings__AzureStorage (primary .NET pattern)
            if echo "$env_vars" | grep -q "^ConnectionStrings__AzureStorage$"; then
              echo "✅ [FOUND] ConnectionStrings__AzureStorage (.NET Core pattern)"
            else
              echo "❌ [MISSING] ConnectionStrings__AzureStorage"
              ((validation_errors++))
            fi
            
            # Check for AzureStorage__ConnectionString (alternative pattern)
            if echo "$env_vars" | grep -q "^AzureStorage__ConnectionString$"; then
              echo "✅ [FOUND] AzureStorage__ConnectionString (Alternative pattern)"
            else
              echo "⚠️  [MISSING] AzureStorage__ConnectionString (Alternative pattern)"
              echo "   Note: This is optional if ConnectionStrings__AzureStorage is present"
            fi
            
            # Check for container name
            if echo "$env_vars" | grep -q "^AzureStorage__ContainerName$"; then
              echo "✅ [FOUND] AzureStorage__ContainerName"
            else
              echo "❌ [MISSING] AzureStorage__ContainerName"
              ((validation_errors++))
            fi
            
            # Check for legacy incorrect naming (should NOT be present)
            if echo "$env_vars" | grep -q "^AZURE_STORAGE_CONNECTION_STRING$"; then
              echo "⚠️  [LEGACY] Found AZURE_STORAGE_CONNECTION_STRING (legacy naming)"
              echo "   Note: This works but ConnectionStrings__AzureStorage is preferred"
            fi
            
            return $validation_errors
          }
          
          # Validate backend container app storage configuration
          echo "🎯 [TARGET] Validating backend API storage configuration..."
          if ! validate_storage_config "aipm-api-v1"; then
            echo "❌ [ERROR] Backend storage validation failed"
            backend_validation_failed=true
          else
            echo "✅ [SUCCESS] Backend storage validation passed"
            backend_validation_failed=false
          fi
          
          echo ""
          
          # Additional validation: Check if storage account actually exists
          echo "🔍 [VALIDATE] Verifying Azure Storage account exists..."
          STORAGE_ACCOUNTS=$(az storage account list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[].name" --output tsv)
          
          if [[ -z "$STORAGE_ACCOUNTS" ]]; then
            echo "❌ [ERROR] No storage accounts found in resource group"
            storage_account_exists=false
          else
            echo "✅ [FOUND] Storage accounts in resource group:"
            echo "$STORAGE_ACCOUNTS" | while read account; do
              echo "  • $account"
            done
            storage_account_exists=true
          fi
          
          # Check if profile-images container exists
          if [[ "$storage_account_exists" == "true" ]]; then
            STORAGE_ACCOUNT=$(echo "$STORAGE_ACCOUNTS" | head -n1)
            echo ""
            echo "🔍 [VALIDATE] Checking profile-images container in storage account: $STORAGE_ACCOUNT"
            
            # Get storage account key for container check
            STORAGE_KEY=$(az storage account keys list --account-name "$STORAGE_ACCOUNT" --resource-group "${{ env.RESOURCE_GROUP }}" --query "[0].value" --output tsv)
            
            # Check if container exists
            if az storage container exists --name "profile-images" --account-name "$STORAGE_ACCOUNT" --account-key "$STORAGE_KEY" --query "exists" --output tsv | grep -q "true"; then
              echo "✅ [FOUND] profile-images container exists"
              container_exists=true
            else
              echo "❌ [ERROR] profile-images container not found"
              container_exists=false
            fi
          else
            container_exists=false
          fi
          
          # Summary of validation results
          echo ""
          echo "📊 [SUMMARY] Post-deployment storage validation results:"
          
          overall_success=true
          
          if [[ "$backend_validation_failed" == "true" ]]; then
            echo "❌ Backend storage environment variables: FAILED"
            overall_success=false
          else
            echo "✅ Backend storage environment variables: PASSED"
          fi
          
          if [[ "$storage_account_exists" == "true" ]]; then
            echo "✅ Azure Storage account: FOUND"
          else
            echo "❌ Azure Storage account: NOT FOUND"
            overall_success=false
          fi
          
          if [[ "$container_exists" == "true" ]]; then
            echo "✅ profile-images container: FOUND"
          else
            echo "❌ profile-images container: NOT FOUND"
            overall_success=false
          fi
          
          # Final validation result
          if [[ "$overall_success" == "true" ]]; then
            echo ""
            echo "🎉 [SUCCESS] All post-deployment storage validation checks PASSED"
            echo "✅ Production environment properly configured for Azure Blob Storage"
            echo ""
            echo "📝 [INFO] Expected application behavior:"
            echo "  • Application will use AzureBlobStorageService"
            echo "  • Images will generate URLs like: https://{storage}.blob.core.windows.net/profile-images/..."
            echo "  • Images will be directly accessible from Azure Blob Storage"
          else
            echo ""
            echo "❌ [FAILURE] Post-deployment storage validation FAILED"
            echo "🚨 [CRITICAL] Production may experience image upload issues"
            echo ""
            echo "🛠️  [FIXES] To resolve validation failures:"
            echo "  1. Check Bicep template environment variable configuration"
            echo "  2. Verify GitHub Actions secrets are properly set"
            echo "  3. Ensure storage account deployment succeeded"
            echo "  4. Re-run deployment if infrastructure is incomplete"
            echo ""
            echo "🚫 [WARNING] Deployment technically succeeded but storage configuration issues detected"
            echo "📞 [ACTION] Monitor application logs and test image upload functionality"
            
            # Don't fail the deployment, but warn about potential issues
            echo ""
            echo "⚠️  [DECISION] Allowing deployment to continue with warnings"
          echo "📝 [REASON] Storage issues can be fixed without full redeployment"
          fi
          
      - name: 🔄 Refresh Container App secrets and roll revision
        run: |
          echo "🔄 [SYNC] Refreshing Container App secrets from GitHub Secrets and forcing new revision"
          az containerapp secret set \
            --name aipm-api-v1 \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --secrets \
              replicate-token='${{ secrets.REPLICATE_API_TOKEN }}' \
              replicate-webhook-secret='${{ secrets.REPLICATE_WEBHOOK_SECRET }}'

          # Force a new revision so app reads updated secrets at startup
          REV_TS=$(date +%s)
          az containerapp update \
            --name aipm-api-v1 \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --set-env-vars REVISION_ROLL_TIMESTAMP=$REV_TS

          echo "✅ [SUCCESS] Container App secrets refreshed and revision rolled ($REV_TS)"

      - name: 🛡️ Validate Blob CORS (post-deploy)
        run: |
          set -e
          echo "🛡️ [CORS] Validating Azure Blob CORS configuration for: $STORAGE_ACCOUNT"

          echo "🔎 [CORS] Listing current CORS rules..."
          az storage cors list --services b \
            --account-name "$STORAGE_ACCOUNT" \
            --output json > cors.json

          cat cors.json | jq '.' || true

          REQUIRED_ORIGIN="https://app.aiprofilephotomaker.com"
          if ! grep -q "$REQUIRED_ORIGIN" cors.json; then
            echo "❌ [CORS] Required origin not found: $REQUIRED_ORIGIN"
            exit 1
          fi

          TEST_BLOB_PATH="profile-images/prod/uploads/cors-validation.txt"
          echo "🔎 [CORS] Performing OPTIONS preflight against $TEST_BLOB_PATH..."
          RESPONSE_HEADERS=$(mktemp)
          curl -s -D "$RESPONSE_HEADERS" -o /dev/null -X OPTIONS \
            "https://$STORAGE_ACCOUNT.blob.core.windows.net/$TEST_BLOB_PATH" \
            -H "Origin: $REQUIRED_ORIGIN" \
            -H "Access-Control-Request-Method: GET"

          if grep -q "403 CORS not enabled" "$RESPONSE_HEADERS"; then
            echo "❌ [CORS] Preflight failed: CORS not enabled or no matching rule"
            echo "--- Response ---"
            cat "$RESPONSE_HEADERS"
            exit 1
          fi

          if ! grep -qi "Access-Control-Allow-Origin: $REQUIRED_ORIGIN" "$RESPONSE_HEADERS"; then
            echo "❌ [CORS] Missing Access-Control-Allow-Origin in preflight response"
            echo "--- Response ---"
            cat "$RESPONSE_HEADERS"
            exit 1
          fi

          echo "✅ [CORS] Validation passed: Required origin and preflight behavior confirmed."

      - name: 🧪 Health Check
        run: |
          echo "🧪 [HEALTH] Performing health checks..."
          
          # Wait for deployment to stabilize
          echo "⏳ [INFO] Waiting for deployment to stabilize..."
          sleep 30
          
          # Get URLs from deployment outputs
          BACKEND_URL="${{ steps.infra.outputs.backend-url }}"
          FRONTEND_URL="${{ steps.infra.outputs.frontend-url }}"
          
          if [ -z "$BACKEND_URL" ] || [ -z "$FRONTEND_URL" ]; then
            echo "⚠️ [WARNING] Missing application URLs from deployment:"
            echo "  Backend URL: '$BACKEND_URL'"
            echo "  Frontend URL: '$FRONTEND_URL'"
            echo "Deployment may have succeeded but URLs are not available yet."
          else
            # Test backend health
            echo "🔍 [TEST] Testing backend health: $BACKEND_URL/api/health"
            backend_health_passed=false
            
            if curl -f -s --max-time 30 "$BACKEND_URL/api/health" > /dev/null; then
              echo "✅ [SUCCESS] Backend is healthy"
              backend_health_passed=true
            else
              echo "⚠️ [WARNING] Backend health check failed (application may still be starting up)"
              # Fallback to legacy health endpoint
              echo "🔍 [FALLBACK] Trying legacy health endpoint: $BACKEND_URL/health"
              if curl -f -s --max-time 30 "$BACKEND_URL/health" > /dev/null; then
                echo "✅ [SUCCESS] Backend is healthy (via legacy endpoint)"
                backend_health_passed=true
              else
                echo "❌ [WARNING] Both health endpoints failed"
                echo "📝 [INFO] This may indicate missing images in ACR"
                echo "📝 [INFO] Run: ./scripts/build-local.sh && ./scripts/push-to-acr.sh"
              fi
            fi
            
            # Critical Storage Service Configuration Validation
            if [[ "$backend_health_passed" == "true" ]]; then
              echo ""
              echo "🔍 [CRITICAL] Validating storage service configuration..."
              echo "📝 [INFO] This ensures production uses Azure Blob Storage (not Local Storage)"
              
              # Get storage health information
              # Do not use -f so we can read JSON even if the endpoint returns 503 (Unhealthy)
              storage_health_response=$(curl -s --max-time 15 "$BACKEND_URL/api/health/storage" 2>/dev/null || echo "")
              
              if [[ -n "$storage_health_response" ]]; then
                echo "✅ [SUCCESS] Storage health endpoint accessible"
                
                # Parse provider from JSON response
                storage_provider=$(echo "$storage_health_response" | grep -o '"provider":"[^"]*"' | sed 's/"provider":"//' | sed 's/"//' || echo "")
                has_connection_string=$(echo "$storage_health_response" | grep -o '"hasConnectionString":[^,}]*' | sed 's/"hasConnectionString"://' || echo "")
                can_connect=$(echo "$storage_health_response" | grep -o '"canConnect":[^,}]*' | sed 's/"canConnect"://' || echo "")
                
                echo "📊 [INFO] Storage Configuration Analysis:"
                echo "  • Provider: $storage_provider"
                echo "  • Has Connection String: $has_connection_string"
                echo "  • Can Connect: $can_connect"
                
                # Validate provider type for production
                if [[ "$storage_provider" == "AzureBlobStorage" ]]; then
                  echo "✅ [SUCCESS] Production is correctly using Azure Blob Storage"
                  
                  if [[ "$has_connection_string" == "true" ]]; then
                    echo "✅ [SUCCESS] Azure Storage connection string is configured"
                  else
                    echo "⚠️ [WARNING] Connection string flag shows false (may be parsing issue)"
                  fi
                  
                  if [[ "$can_connect" == "true" ]]; then
                    echo "✅ [SUCCESS] Azure Storage connectivity test passed"
                    echo ""
                    echo "🎉 [VALIDATION] Storage service configuration is CORRECT for production"
                    echo "📝 [INFO] Expected behavior:"
                    echo "  • Images will generate URLs like: https://{storage}.blob.core.windows.net/profile-images/..."
                    echo "  • Images will be directly accessible from Azure Blob Storage"
                    echo "  • No 404 errors on uploaded images"
                  else
                    echo "❌ [ERROR] Azure Storage connectivity test failed"
                    echo "🚨 [CRITICAL] Production may experience image upload issues"
                  fi
                  
                elif [[ "$storage_provider" == "LocalStorage" ]]; then
                  echo "❌ [CRITICAL] Production is incorrectly using Local Storage!"
                  echo "🚨 [PROBLEM] This will cause 404 errors on uploaded images in containerized environments"
                  echo ""
                  echo "🛠️ [SOLUTION] Root cause analysis:"
                  echo "  1. Azure Storage environment variables are missing or incorrectly named"
                  echo "  2. Connection string format may be invalid"
                  echo "  3. Infrastructure deployment may have failed to set environment variables"
                  echo ""
                  echo "🔧 [IMMEDIATE ACTIONS]:"
                  echo "  1. Check container app environment variables contain:"
                  echo "     - ConnectionStrings__AzureStorage"
                  echo "     - AzureStorage__ContainerName"
                  echo "  2. Verify GitHub Actions secrets are properly configured"
                  echo "  3. Consider manual environment variable update if needed"
                  echo ""
                  echo "⚠️ [DEPLOYMENT WARNING] Image uploads will fail until storage service is fixed"
                  
                else
                  echo "❓ [UNKNOWN] Unexpected storage provider: $storage_provider"
                  echo "⚠️ [WARNING] Cannot validate storage configuration"
                fi
                
              else
                echo "❌ [ERROR] Could not retrieve storage health information"
                echo "📝 [INFO] This may indicate the application is not fully started"
                echo "⚠️ [WARNING] Cannot validate storage service configuration"
              fi
            else
              echo "⚠️ [SKIP] Skipping storage validation because backend health check failed"
            fi
            
            # Test frontend
            echo "🔍 [TEST] Testing frontend: $FRONTEND_URL"
            if curl -f -s --max-time 30 "$FRONTEND_URL" > /dev/null; then
              echo "✅ [SUCCESS] Frontend is healthy"
            else
              echo "⚠️ [WARNING] Frontend health check failed (application may still be starting up)"
            fi
          fi
          
          echo ""
          echo "🎉 [SUCCESS] Deployment completed!"
          echo "📊 [INFO] Application URLs:"
          echo "  Frontend: ${FRONTEND_URL:-'Not available'}"
          echo "  Backend API: ${BACKEND_URL:-'Not available'}"
          echo "  Registry: ${{ steps.infra.outputs.registry-server }}"
          echo ""
          echo "📝 [INFO] Next steps:"
          echo "  1. If health checks failed, ensure images exist in ACR:"
          echo "     ./scripts/build-local.sh && ./scripts/push-to-acr.sh"
          echo "  2. Re-run deployment if images were missing"
          echo "  3. Monitor Container Apps logs for startup issues"
