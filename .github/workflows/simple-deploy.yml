name: 🚀 Staging Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests for quick deploy'
        required: false
        default: false
        type: boolean

env:
  RESOURCE_GROUP: rg-aiprofilemaker-staging
  
permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: AI.ProfilePhotoMaker.UI/package-lock.json
          
      - name: 🧪 Test Backend
        run: |
          cd AI.ProfilePhotoMaker.API
          dotnet restore
          dotnet build --configuration Release
          
      - name: 🧪 Test Frontend
        run: |
          cd AI.ProfilePhotoMaker.UI
          npm ci
          npm run lint:errors-only
          npm run build:prod

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🔐 Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: 🏗️ Create Resource Group
        run: |
          az group create \
            --name ${{ env.RESOURCE_GROUP }} \
            --location eastus2 \
            --tags Environment=staging Application=AIProfileMaker
            
      - name: 🔍 Check for Existing Resources
        id: resource_check
        run: |
          echo "🔍 Checking for existing core resources..."
          
          # Check for existing Container Registry (consistent staging naming)
          REGISTRY_NAME="aiprofilemakercrstaging"
          if az acr show --name "$REGISTRY_NAME" --resource-group "${{ env.RESOURCE_GROUP }}" --output none 2>/dev/null; then
            echo "✅ Found existing Container Registry: $REGISTRY_NAME"
            echo "registry-exists=true" >> $GITHUB_OUTPUT
            echo "registry-name=$REGISTRY_NAME" >> $GITHUB_OUTPUT
          else
            echo "❌ Container Registry not found - will create with idempotent script"
            echo "registry-exists=false" >> $GITHUB_OUTPUT
          fi
          
          # Check for duplicate registries (cleanup old random suffix ones)
          echo "🔍 Checking for duplicate Container Registries..."
          DUPLICATE_REGISTRIES=$(az acr list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?starts_with(name, 'aiprofilemaker') && name != 'aiprofilemakercrstaging'].name" -o tsv || true)
          if [ -n "$DUPLICATE_REGISTRIES" ]; then
            echo "⚠️ Found old registries with inconsistent naming:"
            echo "$DUPLICATE_REGISTRIES"
            echo "duplicate-registries<<EOF" >> $GITHUB_OUTPUT
            echo "$DUPLICATE_REGISTRIES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "✅ No duplicate registries found"
          fi

      - name: 🏗️ Deploy Infrastructure (Idempotent)
        id: infra
        shell: pwsh
        run: |
          # Run IDEMPOTENT PowerShell deployment script - prevents duplicates
          cd scripts
          
          # Use consistent deterministic naming - no random suffixes
          ./deploy-infrastructure-idempotent.ps1 `
            -ResourceGroupName "${{ env.RESOURCE_GROUP }}" `
            -Location "eastus2" `
            -SqlAdminPassword "${{ secrets.SQL_ADMIN_PASSWORD }}" `
            -JwtSecret "${{ secrets.JWT_SECRET }}" `
            -ReplicateApiToken "${{ secrets.REPLICATE_API_TOKEN }}" `
            -AppName "aiprofilemaker" `
            -Environment "staging" `
            -BuildImages
          
      - name: ⚠️ Duplicate Resources Warning
        if: steps.resource_check.outputs.duplicate-registries != ''
        run: |
          echo "⚠️ WARNING: Found old Container Registries with inconsistent naming!"
          echo "These should be cleaned up to avoid unnecessary costs:"
          echo "${{ steps.resource_check.outputs.duplicate-registries }}"
          echo ""
          echo "💡 The deployment will use the correct consistent registry: aiprofilemaker-cr-staging"
          echo "💰 Cleanup these duplicates to save \$150-250/month"

      - name: 🐳 Build & Push Images
        run: |
          # Use the correct registry name (deterministic)
          REGISTRY_NAME="${{ steps.infra.outputs.registry-name }}"
          
          # Login to registry
          echo "🔐 Logging into Container Registry: $REGISTRY_NAME"
          az acr login --name "$REGISTRY_NAME"
          
          # Build and push backend with proper tagging
          echo "🔧 Building backend API image..."
          docker build -f Dockerfile.backend -t ${{ steps.infra.outputs.registry-server }}/aiprofilemaker-backend:latest .
          docker push ${{ steps.infra.outputs.registry-server }}/aiprofilemaker-backend:latest
          
          # Build and push frontend with proper tagging
          echo "🎨 Building frontend UI image..."
          docker build -f Dockerfile.frontend -t ${{ steps.infra.outputs.registry-server }}/aiprofilemaker-frontend:latest .
          docker push ${{ steps.infra.outputs.registry-server }}/aiprofilemaker-frontend:latest
          
          echo "✅ Container images built and pushed successfully"
          
      - name: 🔄 Update Container Apps (PowerShell)
        shell: pwsh
        run: |
          # Update container apps with new images using PowerShell script
          cd scripts
          
          ./update-container-apps.ps1 `
            -ResourceGroupName "${{ env.RESOURCE_GROUP }}" `
            -RegistryServer "${{ steps.infra.outputs.registry-server }}" `
            -BackendImageTag "latest" `
            -FrontendImageTag "latest"
          
      - name: 🎉 Deployment Summary
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "📋 Application URLs:"
          echo "  Frontend: ${{ steps.infra.outputs.frontend-url }}"
          echo "  Backend: ${{ steps.infra.outputs.backend-url }}"
          echo ""
          echo "🔧 Infrastructure:"
          echo "  Container Registry: ${{ steps.infra.outputs.registry-server }}"
          echo "  SQL Server: ${{ steps.infra.outputs.sql-server }}"
          echo "  Storage Account: ${{ steps.infra.outputs.storage-account }}"
          echo "  Key Vault: ${{ steps.infra.outputs.key-vault }}"