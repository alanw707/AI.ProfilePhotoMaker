name: 🚀 V1 Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests for quick deploy'
        required: false
        default: false
        type: boolean

env:
  RESOURCE_GROUP: aiprofilemaker-v1
  
permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: AI.ProfilePhotoMaker.UI/package-lock.json
          
      - name: 🧪 Test Backend
        run: |
          cd AI.ProfilePhotoMaker.API
          dotnet restore
          dotnet build --configuration Release
          
      - name: 🧪 Test Frontend
        run: |
          cd AI.ProfilePhotoMaker.UI
          npm ci
          npm run lint:errors-only
          npm run build:prod

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🔐 Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: 🏗️ Ensure Resource Group
        run: |
          az group create \
            --name ${{ env.RESOURCE_GROUP }} \
            --location eastus \
            --tags Environment=v1 Application=AIProfileMaker
            
      - name: 🏗️ Deploy Infrastructure
        id: infra
        run: |
          cd infrastructure
          
          DEPLOYMENT_NAME="simple-deploy-$(date +%Y%m%d-%H%M%S)"
          
          echo "🚀 Deploying infrastructure with Bicep..."
          echo "Deployment name: $DEPLOYMENT_NAME"
          
          echo "🚀 Starting deployment (skipping what-if to avoid Azure CLI bug)..."
          # Skip what-if validation to completely avoid content consumption error
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file simple-deploy.bicep \
            --parameters \
              sqlAdminPassword='${{ secrets.SQL_ADMIN_PASSWORD }}' \
              jwtSecret='${{ secrets.JWT_SECRET }}' \
              replicateApiToken='${{ secrets.REPLICATE_API_TOKEN }}' \
            --name "$DEPLOYMENT_NAME" \
            --mode Incremental \
            --no-wait
          
          echo "⏳ Waiting for deployment completion..."
          az deployment group wait --resource-group ${{ env.RESOURCE_GROUP }} --name "$DEPLOYMENT_NAME" --created
          
          echo "📄 Getting deployment results..."
          az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name "$DEPLOYMENT_NAME" \
            --output json > deployment_result.json
          
          echo "✅ Deployment completed successfully, extracting outputs..."
          
          # Extract outputs from deployment result file
          REGISTRY_NAME=$(jq -r '.properties.outputs.containerRegistryName.value // empty' deployment_result.json)
          REGISTRY_SERVER=$(jq -r '.properties.outputs.containerRegistryLoginServer.value // empty' deployment_result.json)
          FRONTEND_URL=$(jq -r '.properties.outputs.frontendUrl.value // empty' deployment_result.json)
          BACKEND_URL=$(jq -r '.properties.outputs.backendUrl.value // empty' deployment_result.json)
          
          # Validate that required outputs were extracted
          if [ -z "$REGISTRY_NAME" ] || [ -z "$REGISTRY_SERVER" ] || [ -z "$FRONTEND_URL" ] || [ -z "$BACKEND_URL" ]; then
            echo "❌ Failed to extract required outputs from deployment"
            echo "Registry Name: '$REGISTRY_NAME'"
            echo "Registry Server: '$REGISTRY_SERVER'"
            echo "Frontend URL: '$FRONTEND_URL'"
            echo "Backend URL: '$BACKEND_URL'"
            echo ""
            echo "Raw deployment output:"
            cat deployment_result.json
            exit 1
          fi
          
          # Set GitHub outputs
          echo "registry-name=$REGISTRY_NAME" >> $GITHUB_OUTPUT
          echo "registry-server=$REGISTRY_SERVER" >> $GITHUB_OUTPUT
          echo "frontend-url=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "backend-url=$BACKEND_URL" >> $GITHUB_OUTPUT
          
          echo "📋 Infrastructure outputs:"
          echo "  Registry: $REGISTRY_SERVER"
          echo "  Frontend: $FRONTEND_URL"
          echo "  Backend: $BACKEND_URL"
          
      - name: 🐳 Build & Push Images
        run: |
          # Validate required outputs are available
          if [ -z "${{ steps.infra.outputs.registry-name }}" ] || [ -z "${{ steps.infra.outputs.registry-server }}" ]; then
            echo "❌ Missing registry information from infrastructure deployment"
            echo "Registry Name: '${{ steps.infra.outputs.registry-name }}'"
            echo "Registry Server: '${{ steps.infra.outputs.registry-server }}'"
            exit 1
          fi
          
          echo "🔐 Logging into container registry: ${{ steps.infra.outputs.registry-name }}"
          az acr login --name ${{ steps.infra.outputs.registry-name }}
          
          echo "🐳 Building and pushing backend image..."
          docker build -f Dockerfile.backend -t ${{ steps.infra.outputs.registry-server }}/aiprofilemaker-backend:latest .
          docker push ${{ steps.infra.outputs.registry-server }}/aiprofilemaker-backend:latest
          
          echo "🐳 Building and pushing frontend image..."
          docker build -f Dockerfile.frontend -t ${{ steps.infra.outputs.registry-server }}/aiprofilemaker-frontend:latest .
          docker push ${{ steps.infra.outputs.registry-server }}/aiprofilemaker-frontend:latest
          
          echo "✅ Images built and pushed successfully"
          
      - name: 🔄 Restart Container Apps
        run: |
          echo "🔍 Finding container apps in resource group: ${{ env.RESOURCE_GROUP }}"
          
          # Find container apps with proper error handling
          BACKEND_APP=$(az containerapp list -g ${{ env.RESOURCE_GROUP }} --query "[?contains(name, 'api')].name" -o tsv 2>/dev/null || echo "")
          FRONTEND_APP=$(az containerapp list -g ${{ env.RESOURCE_GROUP }} --query "[?contains(name, 'web')].name" -o tsv 2>/dev/null || echo "")
          
          echo "Found apps - Backend: '$BACKEND_APP', Frontend: '$FRONTEND_APP'"
          
          # Restart backend app if found
          if [ -n "$BACKEND_APP" ]; then
            echo "🔄 Restarting backend app: $BACKEND_APP"
            BACKEND_REVISION=$(az containerapp revision list --name "$BACKEND_APP" --resource-group ${{ env.RESOURCE_GROUP }} --query '[0].name' -o tsv 2>/dev/null)
            if [ -n "$BACKEND_REVISION" ]; then
              az containerapp revision restart --revision "$BACKEND_REVISION" --resource-group ${{ env.RESOURCE_GROUP }}
              echo "✅ Backend app restarted successfully"
            else
              echo "⚠️ Could not find active revision for backend app"
            fi
          else
            echo "⚠️ Backend container app not found"
          fi
          
          # Restart frontend app if found
          if [ -n "$FRONTEND_APP" ]; then
            echo "🔄 Restarting frontend app: $FRONTEND_APP"
            FRONTEND_REVISION=$(az containerapp revision list --name "$FRONTEND_APP" --resource-group ${{ env.RESOURCE_GROUP }} --query '[0].name' -o tsv 2>/dev/null)
            if [ -n "$FRONTEND_REVISION" ]; then
              az containerapp revision restart --revision "$FRONTEND_REVISION" --resource-group ${{ env.RESOURCE_GROUP }}
              echo "✅ Frontend app restarted successfully"
            else
              echo "⚠️ Could not find active revision for frontend app"
            fi
          else
            echo "⚠️ Frontend container app not found"
          fi
          
      - name: 🧪 Health Check
        run: |
          echo "⏳ Waiting for deployment to stabilize..."
          sleep 30
          
          # Use outputs from infrastructure deployment
          BACKEND_URL="${{ steps.infra.outputs.backend-url }}"
          FRONTEND_URL="${{ steps.infra.outputs.frontend-url }}"
          
          # Validate URLs are available
          if [ -z "$BACKEND_URL" ] || [ -z "$FRONTEND_URL" ]; then
            echo "⚠️ Missing application URLs from deployment:"
            echo "  Backend URL: '$BACKEND_URL'"
            echo "  Frontend URL: '$FRONTEND_URL'"
            echo "Deployment may have succeeded but URLs are not available yet."
          else
            echo "🔍 Testing backend: $BACKEND_URL"
            if curl -f -s --max-time 30 "$BACKEND_URL/health" > /dev/null 2>&1; then
              echo "✅ Backend is healthy"
            else
              echo "⚠️ Backend health check failed (may still be starting up)"
            fi
            
            echo "🔍 Testing frontend: $FRONTEND_URL"
            if curl -f -s --max-time 30 "$FRONTEND_URL" > /dev/null 2>&1; then
              echo "✅ Frontend is healthy"
            else
              echo "⚠️ Frontend health check failed (may still be starting up)"
            fi
          fi
          
          echo ""
          echo "🎉 Deployment completed successfully!"
          echo "📋 Application URLs:"
          echo "  🌐 Frontend: ${FRONTEND_URL:-'Not available'}"
          echo "  🔧 Backend API: ${BACKEND_URL:-'Not available'}"
          echo "  📊 Registry: ${{ steps.infra.outputs.registry-server }}"
