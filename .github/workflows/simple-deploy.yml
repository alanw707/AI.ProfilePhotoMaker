name: 🚀 Staging Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests for quick deploy'
        required: false
        default: false
        type: boolean

env:
  RESOURCE_GROUP: rg-aiprofilemaker-staging
  
permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: AI.ProfilePhotoMaker.UI/package-lock.json
          
      - name: 🧪 Test Backend
        run: |
          cd AI.ProfilePhotoMaker.API
          dotnet restore
          dotnet build --configuration Release
          
      - name: 🧪 Test Frontend
        run: |
          cd AI.ProfilePhotoMaker.UI
          npm ci
          npm run lint:errors-only
          npm run build:prod

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🔐 Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: 🏗️ Create Resource Group
        run: |
          az group create \
            --name ${{ env.RESOURCE_GROUP }} \
            --location eastus2 \
            --tags Environment=staging Application=AIProfileMaker
            
      - name: 🏗️ Deploy Infrastructure (PowerShell)
        id: infra
        shell: pwsh
        run: |
          # Run PowerShell deployment script to avoid ARM API consumption issues
          cd scripts
          
          ./deploy-infrastructure.ps1 `
            -ResourceGroupName "${{ env.RESOURCE_GROUP }}" `
            -Location "eastus2" `
            -SqlAdminPassword "${{ secrets.SQL_ADMIN_PASSWORD }}" `
            -JwtSecret "${{ secrets.JWT_SECRET }}" `
            -ReplicateApiToken "${{ secrets.REPLICATE_API_TOKEN }}" `
            -AppName "aiprofilemaker" `
            -Environment "staging"
          
      - name: 🐳 Build & Push Images
        run: |
          # Login to registry
          az acr login --name ${{ steps.infra.outputs.registry-name }}
          
          # Build and push backend
          docker build -f Dockerfile.backend -t ${{ steps.infra.outputs.registry-server }}/aiprofilemaker-backend:latest .
          docker push ${{ steps.infra.outputs.registry-server }}/aiprofilemaker-backend:latest
          
          # Build and push frontend
          docker build -f Dockerfile.frontend -t ${{ steps.infra.outputs.registry-server }}/aiprofilemaker-frontend:latest .
          docker push ${{ steps.infra.outputs.registry-server }}/aiprofilemaker-frontend:latest
          
      - name: 🔄 Update Container Apps (PowerShell)
        shell: pwsh
        run: |
          # Update container apps with new images using PowerShell script
          cd scripts
          
          ./update-container-apps.ps1 `
            -ResourceGroupName "${{ env.RESOURCE_GROUP }}" `
            -RegistryServer "${{ steps.infra.outputs.registry-server }}" `
            -BackendImageTag "latest" `
            -FrontendImageTag "latest"
          
      - name: 🎉 Deployment Summary
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "📋 Application URLs:"
          echo "  Frontend: ${{ steps.infra.outputs.frontend-url }}"
          echo "  Backend: ${{ steps.infra.outputs.backend-url }}"
          echo ""
          echo "🔧 Infrastructure:"
          echo "  Container Registry: ${{ steps.infra.outputs.registry-server }}"
          echo "  SQL Server: ${{ steps.infra.outputs.sql-server }}"
          echo "  Storage Account: ${{ steps.infra.outputs.storage-account }}"
          echo "  Key Vault: ${{ steps.infra.outputs.key-vault }}"