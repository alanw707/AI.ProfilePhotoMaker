name: Deploy Frontend to Azure Static Web App

on:
  push:
    branches: [main]
    paths: ['AI.ProfilePhotoMaker.UI/**']
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths: ['AI.ProfilePhotoMaker.UI/**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'AI.ProfilePhotoMaker.UI/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd AI.ProfilePhotoMaker.UI
          npm ci
      
      - name: Build application
        run: |
          cd AI.ProfilePhotoMaker.UI
          npm run build:prod
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      
      - name: Deploy to Azure Static Web App
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "AI.ProfilePhotoMaker.UI"
          api_location: ""
          output_location: "dist/ai.profile-photo-maker.ui"
          
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"