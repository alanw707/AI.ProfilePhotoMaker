name: '🚀 Deploy Infrastructure'

on:
  push:
    branches: [main]
    paths: ['infrastructure/**', '.github/workflows/deploy-infrastructure.yml']
  pull_request:
    branches: [main]
    paths: ['infrastructure/**', '.github/workflows/deploy-infrastructure.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: ['staging', 'production']
      force_deploy:
        description: 'Force deployment (skip validation)'
        required: false
        default: false
        type: boolean
      rollback_enabled:
        description: 'Enable automatic rollback on failure'
        required: false
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

env:
  AZURE_RESOURCE_MANAGER_URL: 'https://management.azure.com/'
  ARM_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C73973894C7140DEAF8637A42FA0C131 }}
  ARM_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_011D6FB5A4BC43509D9B165F9842CEBC }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9C8B148FA76469EB51C84A0DE3D63BB }}

jobs:
  validate-infrastructure:
    name: '🔍 Validate Infrastructure'
    runs-on: ubuntu-latest
    outputs:
      template-hash: ${{ steps.template-hash.outputs.hash }}
      resource-group: ${{ steps.config.outputs.resource-group }}
      deployment-name: ${{ steps.config.outputs.deployment-name }}
    
    steps:
      - name: '📥 Checkout Repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: '⚙️ Configure Environment'
        id: config
        run: |
          ENV_NAME="${{ github.event.inputs.environment || 'staging' }}"
          RG_NAME="ai-profile-photo-maker-${ENV_NAME}"
          DEPLOYMENT_NAME="infra-deploy-$(date +%Y%m%d-%H%M%S)"
          
          echo "environment=${ENV_NAME}" >> $GITHUB_OUTPUT
          echo "resource-group=${RG_NAME}" >> $GITHUB_OUTPUT  
          echo "deployment-name=${DEPLOYMENT_NAME}" >> $GITHUB_OUTPUT
          echo "parameters-file=parameters.${ENV_NAME}.json" >> $GITHUB_OUTPUT
          
          echo "🎯 Target Environment: ${ENV_NAME}"
          echo "📦 Resource Group: ${RG_NAME}"
          echo "🆔 Deployment Name: ${DEPLOYMENT_NAME}"
      
      - name: '🔐 Azure Login (OIDC)'
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
      
      - name: '🏗️ Install Bicep CLI'
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          echo "✅ Bicep version: $(bicep --version)"
      
      - name: '📊 Template Hash'
        id: template-hash
        run: |
          cd infrastructure
          HASH=$(sha256sum main.bicep main.json 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "🔢 Template Hash: ${HASH}"
      
      - name: '🔄 Process Parameters'
        env:
          STAGING_SQL_PASSWORD: ${{ secrets.STAGING_SQL_ADMIN_PASSWORD }}
          STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          PROD_SQL_PASSWORD: ${{ secrets.PROD_SQL_ADMIN_PASSWORD }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.REPLICATE_WEBHOOK_SECRET }}
        run: |
          cd infrastructure
          ENV_NAME="${{ steps.config.outputs.environment }}"
          
          # Create working copy
          cp "parameters.${ENV_NAME}.json" "parameters.${ENV_NAME}.work.json"
          
          # Safe parameter substitution using Python
          python3 << 'EOF'
          import os
          import json
          import sys
          
          env_name = os.environ.get('ENV_NAME', 'staging')
          
          # Read parameter file
          try:
              with open(f'parameters.{env_name}.work.json', 'r') as f:
                  content = f.read()
              
              # Replace secrets based on environment
              if env_name == 'staging':
                  content = content.replace('REPLACE_WITH_STAGING_SQL_PASSWORD', os.environ.get('STAGING_SQL_PASSWORD', ''))
                  content = content.replace('REPLACE_WITH_STAGING_JWT_SECRET', os.environ.get('STAGING_JWT_SECRET', ''))
              else:
                  content = content.replace('REPLACE_WITH_PROD_SQL_PASSWORD', os.environ.get('PROD_SQL_PASSWORD', ''))
                  content = content.replace('REPLACE_WITH_PROD_JWT_SECRET', os.environ.get('PROD_JWT_SECRET', ''))
              
              # Replace common secrets
              content = content.replace('REPLACE_WITH_REPLICATE_TOKEN', os.environ.get('REPLICATE_TOKEN', ''))
              content = content.replace('REPLACE_WITH_WEBHOOK_SECRET', os.environ.get('WEBHOOK_SECRET', ''))
              
              # Write processed file
              with open(f'parameters.{env_name}.work.json', 'w') as f:
                  f.write(content)
              
              # Validate JSON structure
              json.loads(content)
              print("✅ Parameters processed and validated")
              
          except Exception as e:
              print(f"❌ Parameter processing failed: {e}")
              sys.exit(1)
          EOF
          
          echo "ENV_NAME=${ENV_NAME}" >> $GITHUB_ENV
      
      - name: '📋 Pre-flight Validation'
        run: |
          cd infrastructure
          
          # Ensure resource group exists
          if ! az group show --name "${{ steps.config.outputs.resource-group }}" --output none 2>/dev/null; then
            echo "📦 Creating resource group: ${{ steps.config.outputs.resource-group }}"
            az group create \
              --name "${{ steps.config.outputs.resource-group }}" \
              --location "East US" \
              --tags "Environment=${{ steps.config.outputs.environment }}" "Application=AI-ProfilePhotoMaker" "CreatedBy=GitHub-Actions"
          else
            echo "✅ Resource group exists: ${{ steps.config.outputs.resource-group }}"
          fi
          
          # Validate template syntax
          echo "🔍 Validating Bicep template..."
          if bicep build main.bicep --outfile main.validated.json; then
            echo "✅ Bicep template syntax valid"
          else
            echo "❌ Bicep template validation failed"
            exit 1
          fi
      
      - name: '🧪 ARM Template Validation'
        id: arm-validation
        if: github.event.inputs.force_deploy != 'true'
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ steps.config.outputs.resource-group }}
          template: ./infrastructure/main.json
          parameters: ./infrastructure/parameters.${{ steps.config.outputs.environment }}.work.json
          deploymentMode: Validate
          deploymentName: validate-${{ steps.config.outputs.deployment-name }}
          failOnStdErr: false
      
      - name: '📝 Validation Summary'
        run: |
          echo "## 🔍 Infrastructure Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Resource Group | ✅ Ready |" >> $GITHUB_STEP_SUMMARY
          echo "| Bicep Template | ✅ Valid |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event.inputs.force_deploy }}" == "true" ]]; then
            echo "| ARM Validation | ⚠️ Skipped (Force Deploy) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ARM Validation | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Parameters | ✅ Processed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ steps.config.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Group**: ${{ steps.config.outputs.resource-group }}" >> $GITHUB_STEP_SUMMARY
          echo "**Template Hash**: ${{ steps.template-hash.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
      
      - name: '🧹 Cleanup Working Files'
        if: always()
        run: |
          cd infrastructure
          rm -f parameters.*.work.json main.validated.json

  deploy-infrastructure:
    name: "Deploy to ${{ needs.validate-infrastructure.outputs.environment || github.event.inputs.environment || 'staging' }}"
    runs-on: ubuntu-latest
    needs: validate-infrastructure
    if: |
      always() && (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.validate-infrastructure.result == 'success')
      )
    # environment: 
    #   name: ${{ github.event.inputs.environment || 'staging' }}
    #   url: ${{ steps.deploy.outputs.webAppUrl }}
    # Temporarily disabled for OIDC compatibility
    
    outputs:
      web-app-name: ${{ steps.deploy.outputs.webAppName }}
      web-app-url: ${{ steps.deploy.outputs.webAppUrl }}
      static-web-app-name: ${{ steps.deploy.outputs.staticWebAppName }}
      static-web-app-url: ${{ steps.deploy.outputs.staticWebAppUrl }}
      sql-server-name: ${{ steps.deploy.outputs.sqlServerName }}
      storage-account-name: ${{ steps.deploy.outputs.storageAccountName }}
      key-vault-name: ${{ steps.deploy.outputs.keyVaultName }}
    
    steps:
      - name: '📥 Checkout Repository'
        uses: actions/checkout@v4
      
      - name: '🔐 Azure Login (OIDC)'
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
      
      - name: '🔄 Process Parameters'
        env:
          STAGING_SQL_PASSWORD: ${{ secrets.STAGING_SQL_ADMIN_PASSWORD }}
          STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          PROD_SQL_PASSWORD: ${{ secrets.PROD_SQL_ADMIN_PASSWORD }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.REPLICATE_WEBHOOK_SECRET }}
        run: |
          cd infrastructure
          ENV_NAME="${{ github.event.inputs.environment || 'staging' }}"
          
          cp "parameters.${ENV_NAME}.json" "parameters.${ENV_NAME}.deploy.json"
          
          python3 << 'EOF'
          import os
          import json
          
          env_name = os.environ.get('ENV_NAME', 'staging')
          
          with open(f'parameters.{env_name}.deploy.json', 'r') as f:
              content = f.read()
          
          if env_name == 'staging':
              content = content.replace('REPLACE_WITH_STAGING_SQL_PASSWORD', os.environ.get('STAGING_SQL_PASSWORD', ''))
              content = content.replace('REPLACE_WITH_STAGING_JWT_SECRET', os.environ.get('STAGING_JWT_SECRET', ''))
          else:
              content = content.replace('REPLACE_WITH_PROD_SQL_PASSWORD', os.environ.get('PROD_SQL_PASSWORD', ''))
              content = content.replace('REPLACE_WITH_PROD_JWT_SECRET', os.environ.get('PROD_JWT_SECRET', ''))
          
          content = content.replace('REPLACE_WITH_REPLICATE_TOKEN', os.environ.get('REPLICATE_TOKEN', ''))
          content = content.replace('REPLACE_WITH_WEBHOOK_SECRET', os.environ.get('WEBHOOK_SECRET', ''))
          
          with open(f'parameters.{env_name}.deploy.json', 'w') as f:
              f.write(content)
          
          print("✅ Deployment parameters ready")
          EOF
          
          echo "ENV_NAME=${ENV_NAME}" >> $GITHUB_ENV
      
      - name: '🏗️ Deploy Infrastructure'
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ needs.validate-infrastructure.outputs.resource-group }}
          template: ./infrastructure/main.json
          parameters: ./infrastructure/parameters.${{ env.ENV_NAME }}.deploy.json
          deploymentMode: Incremental
          deploymentName: ${{ needs.validate-infrastructure.outputs.deployment-name }}
          failOnStdErr: false
      
      - name: '🔍 Post-Deployment Validation'
        id: validation
        run: |
          echo "🔍 Validating deployed resources..."
          
          # Check Web App
          if az webapp show --name "${{ steps.deploy.outputs.webAppName }}" --resource-group "${{ needs.validate-infrastructure.outputs.resource-group }}" --output none 2>/dev/null; then
            echo "✅ Web App deployed successfully"
            echo "web-app-status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Web App validation failed"
            echo "web-app-status=failed" >> $GITHUB_OUTPUT
          fi
          
          # Check SQL Database
          if az sql db show --name "${{ steps.deploy.outputs.sqlDatabaseName || 'aiprofilephotomakerdb' }}" --server "${{ steps.deploy.outputs.sqlServerName }}" --resource-group "${{ needs.validate-infrastructure.outputs.resource-group }}" --output none 2>/dev/null; then
            echo "✅ SQL Database deployed successfully"
            echo "sql-status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ SQL Database validation failed"
            echo "sql-status=failed" >> $GITHUB_OUTPUT
          fi
          
          # Check Storage Account
          if az storage account show --name "${{ steps.deploy.outputs.storageAccountName }}" --resource-group "${{ needs.validate-infrastructure.outputs.resource-group }}" --output none 2>/dev/null; then
            echo "✅ Storage Account deployed successfully"
            echo "storage-status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Storage Account validation failed" 
            echo "storage-status=failed" >> $GITHUB_OUTPUT
          fi
          
          # Overall validation
          if [[ "${{ steps.validation.outputs.web-app-status }}" == "success" && "${{ steps.validation.outputs.sql-status }}" == "success" && "${{ steps.validation.outputs.storage-status }}" == "success" ]]; then
            echo "✅ All resources validated successfully"
            echo "overall-status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Some resources failed validation"
            echo "overall-status=failed" >> $GITHUB_OUTPUT
          fi
      
      - name: '📊 Deployment Summary'
        run: |
          echo "## 🚀 Infrastructure Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ env.ENV_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Resource Group**: ${{ needs.validate-infrastructure.outputs.resource-group }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Name**: ${{ needs.validate-infrastructure.outputs.deployment-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Template Hash**: ${{ needs.validate-infrastructure.outputs.template-hash }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Deployed Resources" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Name | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Web App | ${{ steps.deploy.outputs.webAppName }} | ${{ steps.validation.outputs.web-app-status == 'success' && '✅' || '❌' }} | ${{ steps.deploy.outputs.webAppUrl }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Web App | ${{ steps.deploy.outputs.staticWebAppName }} | ✅ | ${{ steps.deploy.outputs.staticWebAppUrl }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SQL Server | ${{ steps.deploy.outputs.sqlServerName }} | ${{ steps.validation.outputs.sql-status == 'success' && '✅' || '❌' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Storage Account | ${{ steps.deploy.outputs.storageAccountName }} | ${{ steps.validation.outputs.storage-status == 'success' && '✅' || '❌' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Key Vault | ${{ steps.deploy.outputs.keyVaultName }} | ✅ | - |" >> $GITHUB_STEP_SUMMARY
      
      - name: '🧹 Cleanup Deployment Files'
        if: always()
        run: |
          cd infrastructure
          rm -f parameters.*.deploy.json
      
      - name: '❌ Rollback on Failure'
        if: failure() && github.event.inputs.rollback_enabled != 'false'
        run: |
          echo "🔄 Initiating automatic rollback..."
          echo "⚠️ Deployment failed - rolling back changes"
          
          # Get previous successful deployment
          PREVIOUS_DEPLOYMENT=$(az deployment group list \
            --resource-group "${{ needs.validate-infrastructure.outputs.resource-group }}" \
            --query "[?provisioningState=='Succeeded'] | [0].name" \
            --output tsv 2>/dev/null || echo "")
          
          if [[ -n "$PREVIOUS_DEPLOYMENT" && "$PREVIOUS_DEPLOYMENT" != "null" ]]; then
            echo "📋 Found previous deployment: $PREVIOUS_DEPLOYMENT"
            echo "🔄 Rollback initiated - manual intervention may be required"
            echo "::error::Deployment failed and automatic rollback initiated. Check Azure portal for status."
          else
            echo "⚠️ No previous successful deployment found - manual cleanup required"
            echo "::error::Deployment failed and no rollback available. Manual intervention required."
          fi

  health-check:
    name: '🏥 Health Check'
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    if: success()
    
    steps:
      - name: '🔍 Infrastructure Health Check'
        run: |
          echo "🏥 Performing infrastructure health checks..."
          
          # Web App Health Check
          WEB_APP_URL="${{ needs.deploy-infrastructure.outputs.web-app-url }}"
          if [[ -n "$WEB_APP_URL" ]]; then
            echo "🌐 Checking Web App health: $WEB_APP_URL"
            
            # Wait for app to start
            sleep 30
            
            if curl -f -s --max-time 30 "$WEB_APP_URL/health" >/dev/null 2>&1; then
              echo "✅ Web App is healthy"
            else
              echo "⚠️ Web App health check inconclusive (may still be starting)"
            fi
          fi
          
          # Static Web App Health Check
          SWA_URL="${{ needs.deploy-infrastructure.outputs.static-web-app-url }}"
          if [[ -n "$SWA_URL" ]]; then
            echo "🌐 Checking Static Web App: $SWA_URL"
            
            if curl -f -s --max-time 30 "$SWA_URL" >/dev/null 2>&1; then
              echo "✅ Static Web App is accessible"
            else
              echo "⚠️ Static Web App not yet accessible (deployment may be in progress)"
            fi
          fi
      
      - name: '📊 Health Check Summary'
        run: |
          echo "## 🏥 Infrastructure Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- **API Endpoint**: ${{ needs.deploy-infrastructure.outputs.web-app-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: ${{ needs.deploy-infrastructure.outputs.static-web-app-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Deploy application code to Web App" >> $GITHUB_STEP_SUMMARY
          echo "2. Deploy frontend to Static Web App" >> $GITHUB_STEP_SUMMARY
          echo "3. Run database migrations" >> $GITHUB_STEP_SUMMARY
          echo "4. Configure monitoring and alerts" >> $GITHUB_STEP_SUMMARY

  notify-completion:
    name: '📢 Notify Completion'
    runs-on: ubuntu-latest
    needs: [validate-infrastructure, deploy-infrastructure, health-check]
    if: always()
    
    steps:
      - name: '📢 Deployment Notification'
        run: |
          if [[ "${{ needs.deploy-infrastructure.result }}" == "success" ]]; then
            echo "🎉 Infrastructure deployment completed successfully!"
            echo "🔗 Web App: ${{ needs.deploy-infrastructure.outputs.web-app-url }}"
            echo "🔗 Frontend: ${{ needs.deploy-infrastructure.outputs.static-web-app-url }}"
          else
            echo "❌ Infrastructure deployment failed"
            echo "📋 Check the logs above for details"
          fi
      
      - name: '📝 Create Issue on Failure'
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Infrastructure Deployment Failed - ${{ github.event.inputs.environment || 'staging' }}`,
              body: `
              ## Infrastructure Deployment Failure
              
              **Environment**: ${{ github.event.inputs.environment || 'staging' }}
              **Workflow Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
              **Branch**: ${{ github.ref_name }}
              **Commit**: ${{ github.sha }}
              
              ### Failure Details
              - **Validation**: ${{ needs.validate-infrastructure.result }}
              - **Deployment**: ${{ needs.deploy-infrastructure.result }}
              - **Health Check**: ${{ needs.health-check.result }}
              
              ### Next Steps
              1. Review the workflow logs for specific error details
              2. Check Azure portal for resource status
              3. Verify all secrets and configuration are correct
              4. Consider manual intervention if needed
              
              ### Resources
              - Resource Group: ${{ needs.validate-infrastructure.outputs.resource-group }}
              - Template Hash: ${{ needs.validate-infrastructure.outputs.template-hash }}
              
              _This issue will be automatically closed when the deployment succeeds._
              `,
              labels: ['deployment', 'infrastructure', 'bug']
            });
            
            console.log(`Created issue #${issue.data.number}`);