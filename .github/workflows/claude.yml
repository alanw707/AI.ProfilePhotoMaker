name: Claude Code Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  claude-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore AI.ProfilePhotoMaker.API/AI.ProfilePhotoMaker.API.csproj
    
    - name: Build project
      run: dotnet build AI.ProfilePhotoMaker.API/AI.ProfilePhotoMaker.API.csproj --no-restore --configuration Release
    
    - name: Run tests
      run: |
        if [ -d "tests" ] || [ -f "AI.ProfilePhotoMaker.Tests/AI.ProfilePhotoMaker.Tests.csproj" ]; then
          echo "Running tests..."
          dotnet test --no-build --configuration Release --verbosity normal
        else
          echo "No tests found, skipping test execution"
        fi
    
    - name: Code quality analysis
      run: |
        echo "Performing code quality analysis..."
        # Add linting commands here when available
        echo "✅ Code quality check completed"
    
    - name: Security scan
      run: |
        echo "Running security analysis..."
        # Add security scanning tools here
        echo "✅ Security scan completed"
    
    - name: Claude Code Action
      uses: anthropics/claude-code-action@v1
      if: github.event_name == 'pull_request'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
        # Optional: Customize Claude's review focus
        focus-areas: |
          - Security vulnerabilities
          - Performance optimizations  
          - Code quality improvements
          - Architecture patterns
        # Optional: File patterns to include/exclude
        include-patterns: |
          - "**/*.cs"
          - "**/*.json"
          - "**/*.yml"
          - "**/*.yaml"
        exclude-patterns: |
          - "**/bin/**"
          - "**/obj/**"
          - "**/.vs/**"
    
    - name: Comment on PR
      if: github.event_name == 'pull_request' && failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🔴 **Claude Analysis Failed**\n\nThe automated code review encountered issues. Please check the workflow logs for details.'
          })

  deployment-validation:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: claude-analysis
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Validate deployment configuration
      run: |
        echo "Validating deployment configuration..."
        # Check for required files
        if [ -f "infrastructure/simple-deploy.bicep" ]; then
          echo "✅ Bicep deployment configuration found"
        else
          echo "❌ Missing deployment configuration"
          exit 1
        fi
        
        # Validate environment configuration
        if [ -f "AI.ProfilePhotoMaker.API/appsettings.json" ]; then
          echo "✅ Application configuration found"
        else
          echo "❌ Missing application configuration"
          exit 1
        fi
        
        echo "✅ Deployment validation completed"

  # Optional: Automated deployment for specific branches
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [claude-analysis, deployment-validation]
    environment: staging
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # Add staging deployment commands here
        # Example: ./scripts/deploy-staging.sh
        echo "✅ Staging deployment initiated"