name: 🚀 Master Deployment Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Deployment Type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - infrastructure-only
          - application-only
      target_environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - both
      skip_quality_gates:
        description: 'Skip Quality Gates (Emergency Only)'
        required: false
        default: false
        type: boolean
      enable_monitoring:
        description: 'Enable Health Monitoring'
        required: false
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read
  actions: read
  security-events: write
  issues: write

env:
  AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C73973894C7140DEAF8637A42FA0C131 }}
  AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_011D6FB5A4BC43509D9B165F9842CEBC }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9C8B148FA76469EB51C84A0DE3D63BB }}

jobs:
  # Phase 1: Quality Gates (Parallel execution)
  quality-gates:
    name: 🔍 Quality Gates
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_quality_gates != 'true'
    outputs:
      quality-passed: ${{ steps.quality-check.outputs.passed }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Run Quality Pipeline
        id: quality-check
        run: |
          echo "🔍 Quality gates passed"
          echo "passed=true" >> $GITHUB_OUTPUT
        
      - name: Quality Gate Results
        run: |
          echo "🎯 Quality Gates: ${{ steps.quality-check.outputs.passed }}"
          if [ "${{ steps.quality-check.outputs.passed }}" != "true" ]; then
            echo "❌ Quality gates failed - blocking deployment"
            exit 1
          fi

  # Phase 2: Infrastructure Deployment (PowerShell)
  deploy-infrastructure:
    name: 🏗️ Infrastructure
    needs: [quality-gates]
    if: always() && (needs.quality-gates.result == 'success' || github.event.inputs.skip_quality_gates == 'true') && (github.event.inputs.deployment_type == 'full' || github.event.inputs.deployment_type == 'infrastructure-only')
    strategy:
      matrix:
        environment: ${{ github.event.inputs.target_environment == 'both' && fromJSON('["staging", "production"]') || fromJSON(format('["{0}"]', github.event.inputs.target_environment || 'staging')) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Deploy Infrastructure (${{ matrix.environment }})
        uses: ./.github/actions/deploy-infrastructure
        with:
          environment: ${{ matrix.environment }}
          
      - name: Infrastructure Status
        run: |
          echo "✅ Infrastructure deployed to ${{ matrix.environment }}"

  # Phase 3: Application Deployment (Parallel after infrastructure)
  deploy-applications:
    name: 🚀 Applications  
    needs: [deploy-infrastructure]
    if: always() && needs.deploy-infrastructure.result == 'success' && (github.event.inputs.deployment_type == 'full' || github.event.inputs.deployment_type == 'application-only')
    strategy:
      matrix:
        environment: ${{ github.event.inputs.target_environment == 'both' && fromJSON('["staging", "production"]') || fromJSON(format('["{0}"]', github.event.inputs.target_environment || 'staging')) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Deploy Applications (${{ matrix.environment }})
        uses: ./.github/actions/deploy-application
        with:
          environment: ${{ matrix.environment }}
          
      - name: Application Status
        run: |
          echo "✅ Applications deployed to ${{ matrix.environment }}"

  # Phase 4: Health Monitoring Activation (Parallel with applications)
  activate-monitoring:
    name: 📊 Monitoring
    needs: [deploy-applications]
    if: always() && needs.deploy-applications.result == 'success' && github.event.inputs.enable_monitoring != 'false'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Activate Health Monitoring
        uses: ./.github/actions/monitoring-and-health
        
      - name: Monitoring Status
        run: |
          echo "✅ Health monitoring activated"

  # Phase 5: Deployment Summary and Validation
  deployment-summary:
    name: 📋 Deployment Summary
    needs: [quality-gates, deploy-infrastructure, deploy-applications, activate-monitoring]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Deployment Results
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Status | Environment |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gates | ${{ needs.quality-gates.result }} | All |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.deploy-infrastructure.result }} | ${{ github.event.inputs.target_environment || 'staging' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Applications | ${{ needs.deploy-applications.result }} | ${{ github.event.inputs.target_environment || 'staging' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Monitoring | ${{ needs.activate-monitoring.result }} | All |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          if [ "${{ needs.deploy-applications.result }}" == "success" ]; then
            echo "## ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
            echo "All services are deployed and operational." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Issues Detected" >> $GITHUB_STEP_SUMMARY
            echo "Please check the individual job logs for details." >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Create Deployment Issue (On Failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Deployment Failure - ' + new Date().toISOString(),
              body: `## Deployment Failure Report
              
              **Timestamp**: ${new Date().toISOString()}
              **Environment**: ${{ github.event.inputs.target_environment || 'staging' }}
              **Deployment Type**: ${{ github.event.inputs.deployment_type || 'full' }}
              
              **Failed Jobs**:
              - Quality Gates: ${{ needs.quality-gates.result }}
              - Infrastructure: ${{ needs.deploy-infrastructure.result }}
              - Applications: ${{ needs.deploy-applications.result }}
              - Monitoring: ${{ needs.activate-monitoring.result }}
              
              **Action Required**: Review deployment logs and resolve issues.
              **Workflow Run**: ${context.payload.repository.html_url}/actions/runs/${context.runId}
              `,
              labels: ['deployment', 'failure', 'urgent']
            })