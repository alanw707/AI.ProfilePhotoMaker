name: 🏗️ Deploy Infrastructure (PowerShell)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      validate_only:
        description: 'Validate only, no deployment'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      validate_only:
        description: 'Only validate template (no deployment)'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C73973894C7140DEAF8637A42FA0C131 }}
  AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_011D6FB5A4BC43509D9B165F9842CEBC }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9C8B148FA76469EB51C84A0DE3D63BB }}

jobs:
  deploy-infrastructure:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    outputs:
      deployment-status: ${{ steps.deploy.outputs.status }}
      resource-group: ${{ steps.deploy.outputs.resource_group }}
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install PowerShell Modules
        shell: pwsh
        run: |
          Write-Host "🔧 Installing Azure PowerShell modules..."
          Install-Module -Name Az -Force -AllowClobber -Scope CurrentUser -Repository PSGallery
          Import-Module Az.Accounts, Az.Resources, Az.Profile
          Write-Host "✅ Azure PowerShell modules installed"
          
      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          
      - name: Prepare Deployment Parameters
        shell: pwsh
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          STAGING_SQL_PASSWORD: ${{ secrets.STAGING_SQL_ADMIN_PASSWORD }}
          STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          PROD_SQL_PASSWORD: ${{ secrets.PROD_SQL_ADMIN_PASSWORD }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.REPLICATE_WEBHOOK_SECRET }}
        run: |
          Write-Host "🔐 Preparing deployment parameters for $env:ENVIRONMENT..."
          
          $paramFile = "infrastructure/parameters.$env:ENVIRONMENT.json"
          $tempFile = "infrastructure/parameters.$env:ENVIRONMENT.temp.json"
          
          if (Test-Path $paramFile) {
            $content = Get-Content $paramFile -Raw
            
            # Replace placeholders with actual secrets
            if ($env:ENVIRONMENT -eq "staging") {
              $content = $content -replace 'REPLACE_WITH_STAGING_SQL_PASSWORD', $env:STAGING_SQL_PASSWORD
              $content = $content -replace 'REPLACE_WITH_STAGING_JWT_SECRET', $env:STAGING_JWT_SECRET
            } else {
              $content = $content -replace 'REPLACE_WITH_PROD_SQL_PASSWORD', $env:PROD_SQL_PASSWORD  
              $content = $content -replace 'REPLACE_WITH_PROD_JWT_SECRET', $env:PROD_JWT_SECRET
            }
            
            $content = $content -replace 'REPLACE_WITH_REPLICATE_TOKEN', $env:REPLICATE_TOKEN
            $content = $content -replace 'REPLACE_WITH_WEBHOOK_SECRET', $env:WEBHOOK_SECRET
            
            $content | Out-File -FilePath $tempFile -Encoding UTF8
            Write-Host "✅ Parameters prepared for $env:ENVIRONMENT"
          } else {
            Write-Error "❌ Parameter file not found: $paramFile"
            exit 1
          }
          
      - name: Ensure Resource Group Exists
        shell: pwsh
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          $resourceGroupName = "ai-profile-photo-maker-$env:ENVIRONMENT"
          $location = "East US"
          
          Write-Host "🔍 Checking resource group: $resourceGroupName"
          
          $rg = Get-AzResourceGroup -Name $resourceGroupName -ErrorAction SilentlyContinue
          if (-not $rg) {
            Write-Host "➕ Creating resource group: $resourceGroupName"
            New-AzResourceGroup -Name $resourceGroupName -Location $location
            Write-Host "✅ Resource group created successfully"
          } else {
            Write-Host "✅ Resource group already exists"
          }
          
      - name: Validate Infrastructure Template
        shell: pwsh
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          $resourceGroupName = "ai-profile-photo-maker-$env:ENVIRONMENT"
          $templateFile = "infrastructure/main.bicep"
          $parameterFile = "infrastructure/parameters.$env:ENVIRONMENT.temp.json"
          
          Write-Host "🔍 Validating Bicep template..."
          
          try {
            $validation = Test-AzResourceGroupDeployment `
              -ResourceGroupName $resourceGroupName `
              -TemplateFile $templateFile `
              -TemplateParameterFile $parameterFile
              
            if ($validation) {
              Write-Host "⚠️ Validation warnings detected, but proceeding..."
              $validation | ForEach-Object { Write-Host "  - $($_.Message)" }
            } else {
              Write-Host "✅ Template validation passed"
            }
          } catch {
            Write-Host "⚠️ Validation failed with transient error, proceeding with deployment..."
            Write-Host "Error: $($_.Exception.Message)"
          }
          
      - name: Deploy Infrastructure
        id: deploy
        shell: pwsh
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          $resourceGroupName = "ai-profile-photo-maker-$env:ENVIRONMENT"
          $templateFile = "infrastructure/main.bicep"
          $parameterFile = "infrastructure/parameters.$env:ENVIRONMENT.temp.json"
          $deploymentName = "powershell-deployment-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          
          Write-Host "🚀 Starting infrastructure deployment..."
          Write-Host "  Environment: $env:ENVIRONMENT"
          Write-Host "  Resource Group: $resourceGroupName"
          Write-Host "  Deployment Name: $deploymentName"
          Write-Host "  Validate Only: $env:VALIDATE_ONLY"
          
          if ($env:VALIDATE_ONLY -eq "true") {
            Write-Host "🔍 Validation-only mode - no resources will be created"
            echo "status=validated" >> $env:GITHUB_OUTPUT
            echo "resource_group=$resourceGroupName" >> $env:GITHUB_OUTPUT
            return
          }
          
          try {
            $deployment = New-AzResourceGroupDeployment `
              -ResourceGroupName $resourceGroupName `
              -TemplateFile $templateFile `
              -TemplateParameterFile $parameterFile `
              -Name $deploymentName `
              -Mode Incremental `
              -Force `
              -Verbose
              
            if ($deployment.ProvisioningState -eq "Succeeded") {
              Write-Host "✅ Infrastructure deployment successful!"
              
              # Output deployment results
              Write-Host "📋 Deployment Outputs:"
              $deployment.Outputs.Keys | ForEach-Object {
                $value = $deployment.Outputs[$_].Value
                Write-Host "  $($_): $value"
              }
              
              echo "status=success" >> $env:GITHUB_OUTPUT
              echo "resource_group=$resourceGroupName" >> $env:GITHUB_OUTPUT
              
            } else {
              Write-Error "❌ Deployment failed with status: $($deployment.ProvisioningState)"
              echo "status=failed" >> $env:GITHUB_OUTPUT
              exit 1
            }
            
          } catch {
            Write-Error "❌ Deployment failed with error: $($_.Exception.Message)"
            echo "status=failed" >> $env:GITHUB_OUTPUT
            exit 1
          }
          
      - name: Cleanup Temporary Files
        shell: pwsh
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          $tempFile = "infrastructure/parameters.$env:ENVIRONMENT.temp.json"
          if (Test-Path $tempFile) {
            Remove-Item $tempFile -Force
            Write-Host "🧹 Temporary parameter file cleaned up"
          }
          
      - name: Post-Deployment Validation
        shell: pwsh
        if: steps.deploy.outputs.status == 'success'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          $resourceGroupName = "ai-profile-photo-maker-$env:ENVIRONMENT"
          
          Write-Host "🔍 Validating deployed resources..."
          
          # Check key resources exist
          $resources = Get-AzResource -ResourceGroupName $resourceGroupName
          $expectedResources = @("Microsoft.Web/sites", "Microsoft.Sql/servers", "Microsoft.Storage/storageAccounts", "Microsoft.KeyVault/vaults")
          
          $foundResources = @()
          foreach ($expectedType in $expectedResources) {
            $resource = $resources | Where-Object { $_.ResourceType -eq $expectedType }
            if ($resource) {
              $foundResources += $expectedType
              Write-Host "✅ Found: $($resource.Name) ($expectedType)"
            } else {
              Write-Warning "⚠️ Missing: $expectedType"
            }
          }
          
          Write-Host "📊 Validation Summary: $($foundResources.Count)/$($expectedResources.Count) key resources found"
          
      - name: Create Success Summary
        if: steps.deploy.outputs.status == 'success'
        run: |
          echo "## ✅ Infrastructure Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Group**: ${{ steps.deploy.outputs.resource_group }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ steps.deploy.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Infrastructure is ready for application deployment." >> $GITHUB_STEP_SUMMARY