name: 🚀 V1 PowerShell Deploy
# Simplified deployment workflow: Direct push to production registry
# 1. Deploy Infrastructure → Creates production ACR and all resources
# 2. Build & Push Images → Builds and pushes directly to production ACR
# 3. Update Container Apps → Uses production registry images directly

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests for quick deploy'
        required: false
        default: false
        type: boolean

env:
  RESOURCE_GROUP: aiprofilemaker-v1
  
permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    if: false
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: AI.ProfilePhotoMaker.UI/package-lock.json
          
      - name: 🧪 Test Backend
        run: |
          cd AI.ProfilePhotoMaker.API
          dotnet restore
          dotnet build --configuration Release
          
      - name: 🧪 Test Frontend
        run: |
          cd AI.ProfilePhotoMaker.UI
          npm ci
          npm run lint:errors-only
          npm run build:prod

  deploy:
    name: 🚀 PowerShell Deploy
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🔧 Install Azure CLI
        run: |
          echo "🔧 [SETUP] Azure CLI is pre-installed on Ubuntu runners"
          az version
          
      - name: 🔐 Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: 🏗️ Ensure Resource Group
        run: |
          echo "🏗️ [SETUP] Creating resource group if it doesn't exist..."
          
          # Check if resource group exists
          if az group show --name "${{ env.RESOURCE_GROUP }}" --output none 2>/dev/null; then
            echo "✅ [SUCCESS] Resource group already exists"
          else
            echo "📝 [INFO] Creating new resource group: ${{ env.RESOURCE_GROUP }}"
            az group create \
              --name "${{ env.RESOURCE_GROUP }}" \
              --location "East US 2" \
              --tags Environment=v1 Application=AIProfileMaker
            echo "✅ [SUCCESS] Resource group created successfully"
          fi
          
          # Show resource group details
          echo "📊 [INFO] Resource Group Details:"
          az group show --name "${{ env.RESOURCE_GROUP }}" --query "{Name:name, Location:location, Status:properties.provisioningState}" --output table
          
      - name: 🔍 Validate Bicep Template
        run: |
          echo "🔍 [VALIDATE] Validating Bicep template..."
          
          # Compile Bicep template
          echo "📝 [INFO] Compiling Bicep template..."
          az bicep build --file infrastructure/simple-deploy.bicep
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Bicep template compilation failed"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Bicep template compiled successfully"
          
          # Validate deployment
          echo "🧪 [INFO] Validating deployment..."
          az deployment group validate \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --template-file infrastructure/simple-deploy.bicep \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}" \
                        jwtSecret="${{ secrets.JWT_SECRET }}" \
                        replicateApiToken="${{ secrets.REPLICATE_API_TOKEN }}"
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Template validation failed"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Template validation completed successfully"
          
      - name: 🏗️ Deploy Infrastructure
        id: infra
        run: |
          echo "🚀 [DEPLOY] Starting infrastructure deployment..."
          
          # Cancel any running deployments first
          echo "🧹 [CLEANUP] Checking for and canceling running deployments..."
          RUNNING_DEPLOYMENTS=$(az deployment group list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?properties.provisioningState=='Running'].name" --output tsv 2>/dev/null || true)
          
          if [ -n "$RUNNING_DEPLOYMENTS" ]; then
            echo "⏹️ [CANCEL] Found running deployments, canceling them..."
            echo "$RUNNING_DEPLOYMENTS" | while read deployment; do
              echo "⏹️ [CANCEL] Canceling deployment: $deployment"
              az deployment group cancel --resource-group "${{ env.RESOURCE_GROUP }}" --name "$deployment" || true
            done
          else
            echo "✅ [INFO] No running deployments to cancel"
          fi
          
          # Generate unique deployment name
          DEPLOYMENT_NAME="deploy-$RANDOM-$(date +%Y%m%d-%H%M%S)"
          echo "📝 [INFO] Deployment name: $DEPLOYMENT_NAME"
          
          # Deploy with retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "🔄 [INFO] Attempt $RETRY_COUNT of $MAX_RETRIES"
            
            # Start deployment
            if az deployment group create \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --template-file infrastructure/simple-deploy.bicep \
              --name "$DEPLOYMENT_NAME" \
              --mode Incremental \
              --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}" \
                          jwtSecret="${{ secrets.JWT_SECRET }}" \
                          replicateApiToken="${{ secrets.REPLICATE_API_TOKEN }}" \
              --output json > deployment_result.json; then
              
              echo "✅ [SUCCESS] Deployment completed successfully!"
              break
            else
              echo "⚠️ [WARNING] Deployment attempt $RETRY_COUNT failed"
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⏳ [INFO] Waiting 30 seconds before retry..."
                sleep 30
              else
                echo "❌ [ERROR] Deployment failed after $MAX_RETRIES attempts"
                cat deployment_result.json 2>/dev/null || echo "No deployment result available"
                exit 1
              fi
            fi
          done
          
          # Get deployment outputs
          echo "📤 [INFO] Retrieving deployment outputs..."
          DEPLOYMENT_OUTPUTS=$(az deployment group show --resource-group "${{ env.RESOURCE_GROUP }}" --name "$DEPLOYMENT_NAME" --query "properties.outputs" --output json)
          
          if [ -z "$DEPLOYMENT_OUTPUTS" ] || [ "$DEPLOYMENT_OUTPUTS" = "null" ]; then
            echo "❌ [ERROR] No outputs found in deployment"
            exit 1
          fi
          
          # Extract outputs using jq
          REGISTRY_NAME=$(echo "$DEPLOYMENT_OUTPUTS" | jq -r '.containerRegistryName.value // empty')
          REGISTRY_SERVER=$(echo "$DEPLOYMENT_OUTPUTS" | jq -r '.containerRegistryLoginServer.value // empty')
          FRONTEND_URL=$(echo "$DEPLOYMENT_OUTPUTS" | jq -r '.frontendUrl.value // empty')
          BACKEND_URL=$(echo "$DEPLOYMENT_OUTPUTS" | jq -r '.backendUrl.value // empty')
          
          # Validate required outputs
          if [ -z "$REGISTRY_NAME" ] || [ -z "$REGISTRY_SERVER" ] || [ -z "$FRONTEND_URL" ] || [ -z "$BACKEND_URL" ]; then
            echo "❌ [ERROR] Missing required outputs from deployment:"
            echo "  Registry Name: '$REGISTRY_NAME'"
            echo "  Registry Server: '$REGISTRY_SERVER'"
            echo "  Frontend URL: '$FRONTEND_URL'"
            echo "  Backend URL: '$BACKEND_URL'"
            exit 1
          fi
          
          # Set GitHub outputs
          echo "registry-name=$REGISTRY_NAME" >> $GITHUB_OUTPUT
          echo "registry-server=$REGISTRY_SERVER" >> $GITHUB_OUTPUT
          echo "frontend-url=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "backend-url=$BACKEND_URL" >> $GITHUB_OUTPUT
          
          echo "📊 [INFO] Infrastructure outputs:"
          echo "  Registry: $REGISTRY_SERVER"
          echo "  Frontend: $FRONTEND_URL"
          echo "  Backend: $BACKEND_URL"
          echo "✅ [SUCCESS] Infrastructure deployment completed successfully!"
          
      - name: 🐳 Build & Push Images (Direct to Production)
        run: |
          echo "🐳 [BUILD] Building and pushing container images directly to production registry..."
          
          # Get registry information from infrastructure deployment
          REGISTRY_NAME="${{ steps.infra.outputs.registry-name }}"
          REGISTRY_SERVER="${{ steps.infra.outputs.registry-server }}"
          
          if [ -z "$REGISTRY_NAME" ] || [ -z "$REGISTRY_SERVER" ]; then
            echo "❌ [ERROR] Missing production registry information from infrastructure deployment"
            echo "  Registry Name: '$REGISTRY_NAME'"
            echo "  Registry Server: '$REGISTRY_SERVER'"
            exit 1
          fi
          
          echo "🔐 [LOGIN] Logging into production registry: $REGISTRY_NAME"
          az acr login --name "$REGISTRY_NAME"
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Failed to login to production registry"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Successfully logged into production registry"
          
          # Validate Docker build files
          echo "🔍 [VALIDATE] Checking Docker build context..."
          REQUIRED_FILES=("Dockerfile.backend" "Dockerfile.frontend" "nginx.conf" "docker-entrypoint.sh" "AI.ProfilePhotoMaker.API/AI.ProfilePhotoMaker.API.csproj" "AI.ProfilePhotoMaker.UI/package.json")
          
          MISSING_FILES=()
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING_FILES+=("$file")
            fi
          done
          
          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo "❌ [ERROR] Missing required files for Docker build:"
            for missing in "${MISSING_FILES[@]}"; do
              echo "  - $missing"
            done
            exit 1
          fi
          
          echo "✅ [SUCCESS] All required Docker build files present"
          
          # Build and push backend image directly to production registry
          echo "🔨 [BUILD] Building backend image..."
          docker build -f Dockerfile.backend -t "$REGISTRY_SERVER/aiprofilemaker-api:latest" .
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Backend image build failed"
            exit 1
          fi
          
          echo "📤 [PUSH] Pushing backend image to production registry..."
          docker push "$REGISTRY_SERVER/aiprofilemaker-api:latest"
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Backend image push failed"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Backend image built and pushed successfully"
          
          # Build and push frontend image directly to production registry
          echo "🔨 [BUILD] Building frontend image..."
          docker build -f Dockerfile.frontend -t "$REGISTRY_SERVER/aiprofilemaker-web:latest" .
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Frontend image build failed"
            exit 1
          fi
          
          echo "📤 [PUSH] Pushing frontend image to production registry..."
          docker push "$REGISTRY_SERVER/aiprofilemaker-web:latest"
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Frontend image push failed"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Frontend image built and pushed successfully"
          echo "🎉 [SUCCESS] All images built and pushed to production registry directly!"
          
          
      - name: 🔄 Update Container Apps
        run: |
          echo "🔄 [UPDATE] Updating container apps with production registry images..."
          
          REGISTRY_SERVER="${{ steps.infra.outputs.registry-server }}"
          
          if [ -z "$REGISTRY_SERVER" ]; then
            echo "❌ [ERROR] Missing registry server from infrastructure deployment"
            exit 1
          fi
          
          # Find container apps
          echo "🔍 [SEARCH] Finding container apps in resource group: ${{ env.RESOURCE_GROUP }}"
          
          BACKEND_APP=$(az containerapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?contains(name, 'api')].name" --output tsv | head -1)
          FRONTEND_APP=$(az containerapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?contains(name, 'web')].name" --output tsv | head -1)
          
          if [ -z "$BACKEND_APP" ] || [ -z "$FRONTEND_APP" ]; then
            echo "❌ [ERROR] Could not find backend or frontend apps"
            echo "  Backend: '$BACKEND_APP'"
            echo "  Frontend: '$FRONTEND_APP'"
            az containerapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[].name" --output table
            exit 1
          fi
          
          echo "📱 [INFO] Found apps - Backend: $BACKEND_APP, Frontend: $FRONTEND_APP"
          
          # Update backend app with production registry image
          echo "🔄 [UPDATE] Updating backend app: $BACKEND_APP"
          az containerapp update \
            --name "$BACKEND_APP" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "$REGISTRY_SERVER/aiprofilemaker-api:latest"
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Failed to update backend app"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Backend app updated successfully"
          
          # Update frontend app with production registry image
          echo "🔄 [UPDATE] Updating frontend app: $FRONTEND_APP"
          az containerapp update \
            --name "$FRONTEND_APP" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "$REGISTRY_SERVER/aiprofilemaker-web:latest"
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Failed to update frontend app"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Frontend app updated successfully"
          echo "🎉 [SUCCESS] All container apps updated with production registry images!"
          
      - name: 🧪 Health Check
        run: |
          echo "🧪 [HEALTH] Performing health checks..."
          
          # Wait for deployment to stabilize
          echo "⏳ [INFO] Waiting for deployment to stabilize..."
          sleep 30
          
          # Get URLs from deployment outputs
          BACKEND_URL="${{ steps.infra.outputs.backend-url }}"
          FRONTEND_URL="${{ steps.infra.outputs.frontend-url }}"
          
          if [ -z "$BACKEND_URL" ] || [ -z "$FRONTEND_URL" ]; then
            echo "⚠️ [WARNING] Missing application URLs from deployment:"
            echo "  Backend URL: '$BACKEND_URL'"
            echo "  Frontend URL: '$FRONTEND_URL'"
            echo "Deployment may have succeeded but URLs are not available yet."
          else
            # Test backend health
            echo "🔍 [TEST] Testing backend health: $BACKEND_URL/api/health"
            if curl -f -s --max-time 30 "$BACKEND_URL/api/health" > /dev/null; then
              echo "✅ [SUCCESS] Backend is healthy"
            else
              echo "⚠️ [WARNING] Backend health check failed (application may still be starting up)"
              # Fallback to legacy health endpoint
              echo "🔍 [FALLBACK] Trying legacy health endpoint: $BACKEND_URL/health"
              if curl -f -s --max-time 30 "$BACKEND_URL/health" > /dev/null; then
                echo "✅ [SUCCESS] Backend is healthy (via legacy endpoint)"
              else
                echo "❌ [WARNING] Both health endpoints failed (application may still be starting up)"
              fi
            fi
            
            # Test frontend
            echo "🔍 [TEST] Testing frontend: $FRONTEND_URL"
            if curl -f -s --max-time 30 "$FRONTEND_URL" > /dev/null; then
              echo "✅ [SUCCESS] Frontend is healthy"
            else
              echo "⚠️ [WARNING] Frontend health check failed (application may still be starting up)"
            fi
          fi
          
          echo ""
          echo "🎉 [SUCCESS] Deployment completed successfully!"
          echo "📊 [INFO] Application URLs:"
          echo "  Frontend: ${FRONTEND_URL:-'Not available'}"
          echo "  Backend API: ${BACKEND_URL:-'Not available'}"
          echo "  Registry: ${{ steps.infra.outputs.registry-server }}"