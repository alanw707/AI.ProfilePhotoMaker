name: 🚀 V1 PowerShell Deploy
# Simplified deployment workflow: Direct push to production registry
# 1. Deploy Infrastructure → Creates production ACR and all resources
# 2. Build & Push Images → Builds and pushes directly to production ACR
# 3. Update Container Apps → Uses production registry images directly

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests for quick deploy'
        required: false
        default: false
        type: boolean

env:
  RESOURCE_GROUP: aiprofilemaker-v1
  
permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    if: false
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: AI.ProfilePhotoMaker.UI/package-lock.json
          
      - name: 🧪 Test Backend
        run: |
          cd AI.ProfilePhotoMaker.API
          dotnet restore
          dotnet build --configuration Release
          
      - name: 🧪 Test Frontend
        run: |
          cd AI.ProfilePhotoMaker.UI
          npm ci
          npm run lint:errors-only
          npm run build:prod

  deploy:
    name: 🚀 PowerShell Deploy
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🔧 Install Azure CLI
        run: |
          echo "🔧 [SETUP] Azure CLI is pre-installed on Ubuntu runners"
          az version
          
      - name: 🔐 Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: 🏗️ Ensure Resource Group
        run: |
          echo "🏗️ [SETUP] Creating resource group if it doesn't exist..."
          
          # Check if resource group exists
          if az group show --name "${{ env.RESOURCE_GROUP }}" --output none 2>/dev/null; then
            echo "✅ [SUCCESS] Resource group already exists"
          else
            echo "📝 [INFO] Creating new resource group: ${{ env.RESOURCE_GROUP }}"
            az group create \
              --name "${{ env.RESOURCE_GROUP }}" \
              --location "East US 2" \
              --tags Environment=v1 Application=AIProfileMaker
            echo "✅ [SUCCESS] Resource group created successfully"
          fi
          
          # Show resource group details
          echo "📊 [INFO] Resource Group Details:"
          az group show --name "${{ env.RESOURCE_GROUP }}" --query "{Name:name, Location:location, Status:properties.provisioningState}" --output table
          
      - name: 🔍 Validate Bicep Template
        run: |
          echo "🔍 [VALIDATE] Validating Bicep template..."
          
          # Compile Bicep template
          echo "📝 [INFO] Compiling Bicep template..."
          az bicep build --file infrastructure/simple-deploy.bicep
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Bicep template compilation failed"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Bicep template compiled successfully"
          
          # Validate deployment
          echo "🧪 [INFO] Validating deployment..."
          az deployment group validate \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --template-file infrastructure/simple-deploy.bicep \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}" \
                        jwtSecret="${{ secrets.JWT_SECRET }}" \
                        replicateApiToken="${{ secrets.REPLICATE_API_TOKEN }}"
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Template validation failed"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Template validation completed successfully"
          
      - name: 🏗️ Deploy Infrastructure
        id: infra
        run: |
          echo "🚀 [DEPLOY] Starting infrastructure deployment..."
          
          # Cancel any running deployments first
          echo "🧹 [CLEANUP] Checking for and canceling running deployments..."
          RUNNING_DEPLOYMENTS=$(az deployment group list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?properties.provisioningState=='Running'].name" --output tsv 2>/dev/null || true)
          
          if [ -n "$RUNNING_DEPLOYMENTS" ]; then
            echo "⏹️ [CANCEL] Found running deployments, canceling them..."
            echo "$RUNNING_DEPLOYMENTS" | while read deployment; do
              echo "⏹️ [CANCEL] Canceling deployment: $deployment"
              az deployment group cancel --resource-group "${{ env.RESOURCE_GROUP }}" --name "$deployment" || true
            done
          else
            echo "✅ [INFO] No running deployments to cancel"
          fi
          
          # Generate unique deployment name
          DEPLOYMENT_NAME="deploy-$RANDOM-$(date +%Y%m%d-%H%M%S)"
          echo "📝 [INFO] Deployment name: $DEPLOYMENT_NAME"
          
          # Deploy with retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "🔄 [INFO] Attempt $RETRY_COUNT of $MAX_RETRIES"
            
            # Start deployment
            if az deployment group create \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --template-file infrastructure/simple-deploy.bicep \
              --name "$DEPLOYMENT_NAME" \
              --mode Incremental \
              --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}" \
                          jwtSecret="${{ secrets.JWT_SECRET }}" \
                          replicateApiToken="${{ secrets.REPLICATE_API_TOKEN }}" \
              --output json > deployment_result.json; then
              
              echo "✅ [SUCCESS] Deployment completed successfully!"
              break
            else
              echo "⚠️ [WARNING] Deployment attempt $RETRY_COUNT failed"
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⏳ [INFO] Waiting 30 seconds before retry..."
                sleep 30
              else
                echo "❌ [ERROR] Deployment failed after $MAX_RETRIES attempts"
                cat deployment_result.json 2>/dev/null || echo "No deployment result available"
                exit 1
              fi
            fi
          done
          
          # Get deployment outputs
          echo "📤 [INFO] Retrieving deployment outputs..."
          DEPLOYMENT_OUTPUTS=$(az deployment group show --resource-group "${{ env.RESOURCE_GROUP }}" --name "$DEPLOYMENT_NAME" --query "properties.outputs" --output json)
          
          if [ -z "$DEPLOYMENT_OUTPUTS" ] || [ "$DEPLOYMENT_OUTPUTS" = "null" ]; then
            echo "❌ [ERROR] No outputs found in deployment"
            exit 1
          fi
          
          # Extract outputs using jq
          REGISTRY_NAME=$(echo "$DEPLOYMENT_OUTPUTS" | jq -r '.containerRegistryName.value // empty')
          REGISTRY_SERVER=$(echo "$DEPLOYMENT_OUTPUTS" | jq -r '.containerRegistryLoginServer.value // empty')
          FRONTEND_URL=$(echo "$DEPLOYMENT_OUTPUTS" | jq -r '.frontendUrl.value // empty')
          BACKEND_URL=$(echo "$DEPLOYMENT_OUTPUTS" | jq -r '.backendUrl.value // empty')
          
          # Validate required outputs
          if [ -z "$REGISTRY_NAME" ] || [ -z "$REGISTRY_SERVER" ] || [ -z "$FRONTEND_URL" ] || [ -z "$BACKEND_URL" ]; then
            echo "❌ [ERROR] Missing required outputs from deployment:"
            echo "  Registry Name: '$REGISTRY_NAME'"
            echo "  Registry Server: '$REGISTRY_SERVER'"
            echo "  Frontend URL: '$FRONTEND_URL'"
            echo "  Backend URL: '$BACKEND_URL'"
            exit 1
          fi
          
          # Set GitHub outputs
          echo "registry-name=$REGISTRY_NAME" >> $GITHUB_OUTPUT
          echo "registry-server=$REGISTRY_SERVER" >> $GITHUB_OUTPUT
          echo "frontend-url=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "backend-url=$BACKEND_URL" >> $GITHUB_OUTPUT
          
          echo "📊 [INFO] Infrastructure outputs:"
          echo "  Registry: $REGISTRY_SERVER"
          echo "  Frontend: $FRONTEND_URL"
          echo "  Backend: $BACKEND_URL"
          echo "✅ [SUCCESS] Infrastructure deployment completed successfully!"
          
      - name: 🐳 Build & Push Images (Direct to Production)
        run: |
          echo "🐳 [BUILD] Building and pushing container images directly to production registry..."
          
          # Get registry information from infrastructure deployment
          REGISTRY_NAME="${{ steps.infra.outputs.registry-name }}"
          REGISTRY_SERVER="${{ steps.infra.outputs.registry-server }}"
          
          if [ -z "$REGISTRY_NAME" ] || [ -z "$REGISTRY_SERVER" ]; then
            echo "❌ [ERROR] Missing production registry information from infrastructure deployment"
            echo "  Registry Name: '$REGISTRY_NAME'"
            echo "  Registry Server: '$REGISTRY_SERVER'"
            exit 1
          fi
          
          echo "🔐 [LOGIN] Logging into production registry: $REGISTRY_NAME"
          az acr login --name "$REGISTRY_NAME"
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Failed to login to production registry"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Successfully logged into production registry"
          
          # Validate Docker build files
          echo "🔍 [VALIDATE] Checking Docker build context..."
          REQUIRED_FILES=("Dockerfile.backend" "Dockerfile.frontend" "nginx.conf" "docker-entrypoint.sh" "AI.ProfilePhotoMaker.API/AI.ProfilePhotoMaker.API.csproj" "AI.ProfilePhotoMaker.UI/package.json")
          
          MISSING_FILES=()
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING_FILES+=("$file")
            fi
          done
          
          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo "❌ [ERROR] Missing required files for Docker build:"
            for missing in "${MISSING_FILES[@]}"; do
              echo "  - $missing"
            done
            exit 1
          fi
          
          echo "✅ [SUCCESS] All required Docker build files present"
          
          # Build and push backend image directly to production registry
          echo "🔨 [BUILD] Building backend image..."
          docker build -f Dockerfile.backend -t "$REGISTRY_SERVER/aiprofilemaker-api:latest" .
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Backend image build failed"
            exit 1
          fi
          
          echo "📤 [PUSH] Pushing backend image to production registry..."
          docker push "$REGISTRY_SERVER/aiprofilemaker-api:latest"
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Backend image push failed"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Backend image built and pushed successfully"
          
          # Build and push frontend image directly to production registry
          echo "🔨 [BUILD] Building frontend image..."
          docker build -f Dockerfile.frontend -t "$REGISTRY_SERVER/aiprofilemaker-web:latest" .
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Frontend image build failed"
            exit 1
          fi
          
          echo "📤 [PUSH] Pushing frontend image to production registry..."
          docker push "$REGISTRY_SERVER/aiprofilemaker-web:latest"
          
          if [ $? -ne 0 ]; then
            echo "❌ [ERROR] Frontend image push failed"
            exit 1
          fi
          
          echo "✅ [SUCCESS] Frontend image built and pushed successfully"
          echo "🎉 [SUCCESS] All images built and pushed to production registry directly!"
          
          
      - name: 🔄 Update Container Apps
        run: |
          echo "🔄 [UPDATE] Updating container apps with production registry images..."
          
          REGISTRY_SERVER="${{ steps.infra.outputs.registry-server }}"
          
          if [ -z "$REGISTRY_SERVER" ]; then
            echo "❌ [ERROR] Missing registry server from infrastructure deployment"
            exit 1
          fi
          
          # Function to check infrastructure deployment status
          check_infrastructure_status() {
            echo "🔍 [CHECK] Verifying infrastructure deployment status..."
            
            # Check if resource group exists and is provisioned
            RG_STATUS=$(az group show --name "${{ env.RESOURCE_GROUP }}" --query "properties.provisioningState" --output tsv 2>/dev/null || echo "NotFound")
            echo "📊 [INFO] Resource Group Status: $RG_STATUS"
            
            if [ "$RG_STATUS" != "Succeeded" ]; then
              echo "⚠️ [WARNING] Resource group is not in succeeded state: $RG_STATUS"
            fi
            
            # Check Container Apps Environment
            CONTAINER_ENV_COUNT=$(az containerapp env list --resource-group "${{ env.RESOURCE_GROUP }}" --query "length([?contains(name, 'aipm-env-v1')])" --output tsv 2>/dev/null || echo "0")
            echo "📊 [INFO] Container Apps Environment Count: $CONTAINER_ENV_COUNT"
            
            # Check Container Registry
            REGISTRY_COUNT=$(az acr list --resource-group "${{ env.RESOURCE_GROUP }}" --query "length([?contains(name, 'aipm')])" --output tsv 2>/dev/null || echo "0")
            echo "📊 [INFO] Container Registry Count: $REGISTRY_COUNT"
            
            return 0
          }
          
          # Function to discover container apps with multiple strategies
          discover_container_apps() {
            echo "🔍 [DISCOVERY] Starting comprehensive container app discovery..."
            
            # Strategy 1: List all container apps for debugging
            echo "📋 [DEBUG] All container apps in resource group:"
            ALL_APPS=$(az containerapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[].{Name:name, State:properties.provisioningState, FQDN:properties.configuration.ingress.fqdn}" --output table 2>/dev/null || echo "Failed to list apps")
            echo "$ALL_APPS"
            
            # Strategy 2: Exact name matching (most reliable)
            echo "🎯 [STRATEGY-1] Trying exact name matching..."
            BACKEND_APP_EXACT=$(az containerapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?name=='aipm-api-v1'].name" --output tsv 2>/dev/null | head -1)
            FRONTEND_APP_EXACT=$(az containerapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?name=='aipm-web-v1'].name" --output tsv 2>/dev/null | head -1)
            
            if [ -n "$BACKEND_APP_EXACT" ] && [ -n "$FRONTEND_APP_EXACT" ]; then
              echo "✅ [SUCCESS] Found apps with exact matching:"
              echo "  Backend: '$BACKEND_APP_EXACT'"
              echo "  Frontend: '$FRONTEND_APP_EXACT'"
              BACKEND_APP="$BACKEND_APP_EXACT"
              FRONTEND_APP="$FRONTEND_APP_EXACT"
              return 0
            fi
            
            # Strategy 3: Pattern matching with 'api' and 'web'
            echo "🔍 [STRATEGY-2] Trying pattern matching..."
            BACKEND_APP_PATTERN=$(az containerapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?contains(name, 'api')].name" --output tsv 2>/dev/null | head -1)
            FRONTEND_APP_PATTERN=$(az containerapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?contains(name, 'web')].name" --output tsv 2>/dev/null | head -1)
            
            if [ -n "$BACKEND_APP_PATTERN" ] && [ -n "$FRONTEND_APP_PATTERN" ]; then
              echo "✅ [SUCCESS] Found apps with pattern matching:"
              echo "  Backend: '$BACKEND_APP_PATTERN'"
              echo "  Frontend: '$FRONTEND_APP_PATTERN'"
              BACKEND_APP="$BACKEND_APP_PATTERN"
              FRONTEND_APP="$FRONTEND_APP_PATTERN"
              return 0
            fi
            
            # Strategy 4: Prefix matching
            echo "🔍 [STRATEGY-3] Trying prefix matching..."
            BACKEND_APP_PREFIX=$(az containerapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?starts_with(name, 'aipm-api')].name" --output tsv 2>/dev/null | head -1)
            FRONTEND_APP_PREFIX=$(az containerapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?starts_with(name, 'aipm-web')].name" --output tsv 2>/dev/null | head -1)
            
            if [ -n "$BACKEND_APP_PREFIX" ] && [ -n "$FRONTEND_APP_PREFIX" ]; then
              echo "✅ [SUCCESS] Found apps with prefix matching:"
              echo "  Backend: '$BACKEND_APP_PREFIX'"
              echo "  Frontend: '$FRONTEND_APP_PREFIX'"
              BACKEND_APP="$BACKEND_APP_PREFIX"
              FRONTEND_APP="$FRONTEND_APP_PREFIX"
              return 0
            fi
            
            # Strategy 5: All apps fallback (risky but informative)
            echo "🔍 [STRATEGY-4] Analyzing all available apps..."
            ALL_APP_NAMES=$(az containerapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[].name" --output tsv 2>/dev/null)
            
            if [ -z "$ALL_APP_NAMES" ]; then
              echo "❌ [ERROR] No container apps found in resource group"
              return 1
            fi
            
            echo "📋 [INFO] Available container apps:"
            echo "$ALL_APP_NAMES" | while read app; do
              echo "  - $app"
            done
            
            # Try to infer from available apps
            BACKEND_CANDIDATES=$(echo "$ALL_APP_NAMES" | grep -i "api\|backend" | head -1)
            FRONTEND_CANDIDATES=$(echo "$ALL_APP_NAMES" | grep -i "web\|frontend\|ui" | head -1)
            
            if [ -n "$BACKEND_CANDIDATES" ] && [ -n "$FRONTEND_CANDIDATES" ]; then
              echo "🤔 [INFERENCE] Found potential candidates:"
              echo "  Backend candidate: '$BACKEND_CANDIDATES'"
              echo "  Frontend candidate: '$FRONTEND_CANDIDATES'"
              BACKEND_APP="$BACKEND_CANDIDATES"
              FRONTEND_APP="$FRONTEND_CANDIDATES"
              return 0
            fi
            
            return 1
          }
          
          # Function to wait for app readiness
          wait_for_app_readiness() {
            local app_name=$1
            local app_type=$2
            local max_wait=300  # 5 minutes
            local wait_interval=15
            local elapsed=0
            
            echo "⏳ [WAIT] Waiting for $app_type app '$app_name' to be ready..."
            
            while [ $elapsed -lt $max_wait ]; do
              APP_STATE=$(az containerapp show --name "$app_name" --resource-group "${{ env.RESOURCE_GROUP }}" --query "properties.provisioningState" --output tsv 2>/dev/null || echo "Unknown")
              
              if [ "$APP_STATE" = "Succeeded" ]; then
                echo "✅ [SUCCESS] $app_type app '$app_name' is ready (state: $APP_STATE)"
                return 0
              elif [ "$APP_STATE" = "Failed" ]; then
                echo "❌ [ERROR] $app_type app '$app_name' failed to provision (state: $APP_STATE)"
                return 1
              else
                echo "🔄 [INFO] $app_type app '$app_name' is still provisioning (state: $APP_STATE), waiting ${wait_interval}s..."
                sleep $wait_interval
                elapsed=$((elapsed + wait_interval))
              fi
            done
            
            echo "⚠️ [WARNING] Timeout waiting for $app_type app '$app_name' to be ready"
            return 1
          }
          
          # Execute infrastructure status check
          check_infrastructure_status
          
          # Execute container app discovery with retries
          MAX_DISCOVERY_RETRIES=3
          DISCOVERY_RETRY=0
          BACKEND_APP=""
          FRONTEND_APP=""
          
          while [ $DISCOVERY_RETRY -lt $MAX_DISCOVERY_RETRIES ]; do
            DISCOVERY_RETRY=$((DISCOVERY_RETRY + 1))
            echo "🔄 [RETRY] Discovery attempt $DISCOVERY_RETRY of $MAX_DISCOVERY_RETRIES"
            
            if discover_container_apps; then
              echo "✅ [SUCCESS] Container app discovery completed"
              break
            else
              if [ $DISCOVERY_RETRY -lt $MAX_DISCOVERY_RETRIES ]; then
                WAIT_TIME=$((DISCOVERY_RETRY * 30))
                echo "⏳ [WAIT] Discovery failed, waiting ${WAIT_TIME}s before retry..."
                sleep $WAIT_TIME
              else
                echo "❌ [ERROR] Container app discovery failed after $MAX_DISCOVERY_RETRIES attempts"
                echo ""
                echo "🔍 [DIAGNOSIS] Deployment diagnosis:"
                echo "  1. Infrastructure may still be deploying"
                echo "  2. Container Apps Environment may not be ready"
                echo "  3. Bicep deployment may have partially failed"
                echo "  4. App names may not match expected patterns"
                echo ""
                echo "💡 [SUGGESTION] Check the infrastructure deployment logs and ensure all resources are created"
                exit 1
              fi
            fi
          done
          
          # Validate apps were found
          if [ -z "$BACKEND_APP" ] || [ -z "$FRONTEND_APP" ]; then
            echo "❌ [ERROR] Failed to identify container apps:"
            echo "  Backend: '$BACKEND_APP'"
            echo "  Frontend: '$FRONTEND_APP'"
            exit 1
          fi
          
          echo "📱 [INFO] Final app selection:"
          echo "  Backend: $BACKEND_APP"
          echo "  Frontend: $FRONTEND_APP"
          
          # Wait for apps to be ready before updating
          wait_for_app_readiness "$BACKEND_APP" "Backend"
          wait_for_app_readiness "$FRONTEND_APP" "Frontend"
          
          # Update backend app with production registry image with retry logic
          echo "🔄 [UPDATE] Updating backend app: $BACKEND_APP"
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "🔄 [INFO] Backend update attempt $RETRY_COUNT of $MAX_RETRIES"
            
            if az containerapp update \
              --name "$BACKEND_APP" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "$REGISTRY_SERVER/aiprofilemaker-api:latest"; then
              
              echo "✅ [SUCCESS] Backend app updated successfully!"
              break
            else
              echo "⚠️ [WARNING] Backend update attempt $RETRY_COUNT failed"
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                WAIT_TIME=$((RETRY_COUNT * 5))
                echo "⏳ [INFO] Waiting $WAIT_TIME seconds before retry..."
                sleep $WAIT_TIME
              else
                echo "❌ [ERROR] Backend update failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done
          
          # Update frontend app with production registry image with retry logic
          echo "🔄 [UPDATE] Updating frontend app: $FRONTEND_APP"
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "🔄 [INFO] Frontend update attempt $RETRY_COUNT of $MAX_RETRIES"
            
            if az containerapp update \
              --name "$FRONTEND_APP" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "$REGISTRY_SERVER/aiprofilemaker-web:latest"; then
              
              echo "✅ [SUCCESS] Frontend app updated successfully!"
              break
            else
              echo "⚠️ [WARNING] Frontend update attempt $RETRY_COUNT failed"
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                WAIT_TIME=$((RETRY_COUNT * 5))
                echo "⏳ [INFO] Waiting $WAIT_TIME seconds before retry..."
                sleep $WAIT_TIME
              else
                echo "❌ [ERROR] Frontend update failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done
          echo "🎉 [SUCCESS] All container apps updated with production registry images!"
          
      - name: 🧪 Health Check & Deployment Validation
        run: |
          echo "🧪 [HEALTH] Performing comprehensive health checks and deployment validation..."
          
          # Function to validate deployment completeness
          validate_deployment() {
            echo "✅ [VALIDATE] Checking deployment completeness..."
            
            local validation_errors=0
            
            # Check if all expected resources exist
            echo "🔍 [CHECK] Validating infrastructure resources..."
            
            # Container Apps Environment
            ENV_EXISTS=$(az containerapp env list --resource-group "${{ env.RESOURCE_GROUP }}" --query "length([?contains(name, 'aipm-env-v1')])" --output tsv 2>/dev/null || echo "0")
            if [ "$ENV_EXISTS" = "0" ]; then
              echo "❌ [ERROR] Container Apps Environment not found"
              validation_errors=$((validation_errors + 1))
            else
              echo "✅ [SUCCESS] Container Apps Environment exists"
            fi
            
            # Container Registry
            REGISTRY_EXISTS=$(az acr list --resource-group "${{ env.RESOURCE_GROUP }}" --query "length([?contains(name, 'aipm')])" --output tsv 2>/dev/null || echo "0")
            if [ "$REGISTRY_EXISTS" = "0" ]; then
              echo "❌ [ERROR] Container Registry not found"
              validation_errors=$((validation_errors + 1))
            else
              echo "✅ [SUCCESS] Container Registry exists"
            fi
            
            # Container Apps
            BACKEND_EXISTS=$(az containerapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "length([?name=='aipm-api-v1'])" --output tsv 2>/dev/null || echo "0")
            FRONTEND_EXISTS=$(az containerapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "length([?name=='aipm-web-v1'])" --output tsv 2>/dev/null || echo "0")
            
            if [ "$BACKEND_EXISTS" = "0" ]; then
              echo "❌ [ERROR] Backend Container App not found"
              validation_errors=$((validation_errors + 1))
            else
              echo "✅ [SUCCESS] Backend Container App exists"
            fi
            
            if [ "$FRONTEND_EXISTS" = "0" ]; then
              echo "❌ [ERROR] Frontend Container App not found"
              validation_errors=$((validation_errors + 1))
            else
              echo "✅ [SUCCESS] Frontend Container App exists"
            fi
            
            # SQL Server
            SQL_EXISTS=$(az sql server list --resource-group "${{ env.RESOURCE_GROUP }}" --query "length([?contains(name, 'aipm-sql-v1')])" --output tsv 2>/dev/null || echo "0")
            if [ "$SQL_EXISTS" = "0" ]; then
              echo "❌ [ERROR] SQL Server not found"
              validation_errors=$((validation_errors + 1))
            else
              echo "✅ [SUCCESS] SQL Server exists"
            fi
            
            # Storage Account
            STORAGE_EXISTS=$(az storage account list --resource-group "${{ env.RESOURCE_GROUP }}" --query "length([?contains(name, 'aipmstv1')])" --output tsv 2>/dev/null || echo "0")
            if [ "$STORAGE_EXISTS" = "0" ]; then
              echo "❌ [ERROR] Storage Account not found"
              validation_errors=$((validation_errors + 1))
            else
              echo "✅ [SUCCESS] Storage Account exists"
            fi
            
            return $validation_errors
          }
          
          # Function to check container app health with multiple strategies
          check_app_health() {
            local app_name=$1
            local app_type=$2
            local expected_port=$3
            
            echo "🩺 [HEALTH] Checking $app_type app: $app_name"
            
            # Get app status
            local app_status=$(az containerapp show --name "$app_name" --resource-group "${{ env.RESOURCE_GROUP }}" --query "properties.provisioningState" --output tsv 2>/dev/null || echo "Unknown")
            echo "📊 [STATUS] $app_type provisioning state: $app_status"
            
            # Get app URL
            local app_url=$(az containerapp show --name "$app_name" --resource-group "${{ env.RESOURCE_GROUP }}" --query "properties.configuration.ingress.fqdn" --output tsv 2>/dev/null || echo "")
            
            if [ -n "$app_url" ]; then
              echo "🌐 [URL] $app_type URL: https://$app_url"
              
              # Try multiple health check approaches
              if [ "$app_type" = "Backend" ]; then
                # Backend health checks
                echo "🔍 [TEST] Testing backend health endpoints..."
                
                # Try main health endpoint
                if curl -f -s --max-time 30 "https://$app_url/api/health" > /dev/null 2>&1; then
                  echo "✅ [SUCCESS] Backend health endpoint responding"
                  return 0
                elif curl -f -s --max-time 30 "https://$app_url/health" > /dev/null 2>&1; then
                  echo "✅ [SUCCESS] Backend legacy health endpoint responding"
                  return 0
                elif curl -f -s --max-time 30 "https://$app_url/" > /dev/null 2>&1; then
                  echo "⚠️ [PARTIAL] Backend root endpoint responding (health endpoint may not be ready)"
                  return 0
                else
                  echo "❌ [FAILED] Backend not responding to any health checks"
                  return 1
                fi
              else
                # Frontend health checks
                echo "🔍 [TEST] Testing frontend availability..."
                
                if curl -f -s --max-time 30 "https://$app_url/" > /dev/null 2>&1; then
                  echo "✅ [SUCCESS] Frontend responding"
                  return 0
                else
                  echo "❌ [FAILED] Frontend not responding"
                  return 1
                fi
              fi
            else
              echo "⚠️ [WARNING] No URL found for $app_type app"
              return 1
            fi
          }
          
          # Wait for deployment to stabilize
          echo "⏳ [WAIT] Waiting for deployment to stabilize (60s)..."
          sleep 60
          
          # Validate deployment completeness first
          echo ""
          echo "🔍 [VALIDATION] Validating deployment completeness..."
          if validate_deployment; then
            echo "✅ [SUCCESS] All infrastructure resources are present"
          else
            echo "⚠️ [WARNING] Some infrastructure resources may be missing or still deploying"
          fi
          
          # Get URLs from deployment outputs with fallback
          BACKEND_URL="${{ steps.infra.outputs.backend-url }}"
          FRONTEND_URL="${{ steps.infra.outputs.frontend-url }}"
          REGISTRY_SERVER="${{ steps.infra.outputs.registry-server }}"
          
          echo ""
          echo "📊 [INFO] Deployment outputs:"
          echo "  Backend URL: '${BACKEND_URL:-'Not available'}'"
          echo "  Frontend URL: '${FRONTEND_URL:-'Not available'}'"
          echo "  Registry: '${REGISTRY_SERVER:-'Not available'}'"
          
          # Fallback URL discovery if outputs are missing
          if [ -z "$BACKEND_URL" ] || [ -z "$FRONTEND_URL" ]; then
            echo "🔍 [FALLBACK] Attempting to discover URLs from container apps..."
            
            # Try to get URLs directly from container apps
            BACKEND_FQDN=$(az containerapp show --name "aipm-api-v1" --resource-group "${{ env.RESOURCE_GROUP }}" --query "properties.configuration.ingress.fqdn" --output tsv 2>/dev/null || echo "")
            FRONTEND_FQDN=$(az containerapp show --name "aipm-web-v1" --resource-group "${{ env.RESOURCE_GROUP }}" --query "properties.configuration.ingress.fqdn" --output tsv 2>/dev/null || echo "")
            
            if [ -n "$BACKEND_FQDN" ]; then
              BACKEND_URL="https://$BACKEND_FQDN"
              echo "✅ [DISCOVERED] Backend URL: $BACKEND_URL"
            fi
            
            if [ -n "$FRONTEND_FQDN" ]; then
              FRONTEND_URL="https://$FRONTEND_FQDN"
              echo "✅ [DISCOVERED] Frontend URL: $FRONTEND_URL"
            fi
          fi
          
          # Perform health checks if URLs are available
          health_check_results=0
          
          if [ -n "$BACKEND_URL" ]; then
            echo ""
            if check_app_health "aipm-api-v1" "Backend" "8080"; then
              echo "✅ [SUCCESS] Backend health check passed"
            else
              echo "❌ [FAILED] Backend health check failed"
              health_check_results=$((health_check_results + 1))
            fi
          else
            echo "⚠️ [SKIP] Backend health check skipped - no URL available"
          fi
          
          if [ -n "$FRONTEND_URL" ]; then
            echo ""
            if check_app_health "aipm-web-v1" "Frontend" "80"; then
              echo "✅ [SUCCESS] Frontend health check passed"
            else
              echo "❌ [FAILED] Frontend health check failed"
              health_check_results=$((health_check_results + 1))
            fi
          else
            echo "⚠️ [SKIP] Frontend health check skipped - no URL available"
          fi
          
          # Final deployment summary
          echo ""
          echo "🎯 [SUMMARY] Deployment Summary:"
          echo "============================================"
          
          if [ $health_check_results -eq 0 ]; then
            echo "🎉 [SUCCESS] Deployment completed successfully!"
            echo "✅ All components are healthy and responding"
          else
            echo "⚠️ [PARTIAL] Deployment completed with warnings"
            echo "❌ $health_check_results health check(s) failed"
            echo "💡 Applications may still be starting up or have configuration issues"
          fi
          
          echo ""
          echo "📱 [ENDPOINTS] Application Access Points:"
          echo "  🌐 Frontend: ${FRONTEND_URL:-'⚠️  Not available'}"
          echo "  🔧 Backend API: ${BACKEND_URL:-'⚠️  Not available'}"
          echo "  📦 Registry: ${REGISTRY_SERVER:-'⚠️  Not available'}"
          echo ""
          
          if [ -n "$FRONTEND_URL" ] && [ -n "$BACKEND_URL" ]; then
            echo "🚀 [READY] Your AI Profile Photo Maker is deployed!"
            echo "   Visit the frontend URL to start using the application."
          else
            echo "⏳ [PENDING] Deployment may still be finalizing."
            echo "   Check the Azure portal for final URL availability."
          fi