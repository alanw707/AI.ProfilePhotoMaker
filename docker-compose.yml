version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    environment:
      - API_URL=http://localhost:5000/api
      - BASE_URL=http://localhost:5000
      - ENVIRONMENT=development
    depends_on:
      - backend
    networks:
      - ai-profile-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=db;Database=aiprofilephotomaker;User Id=sa;Password=${DB_PASSWORD:-DefaultDevPassword123!};TrustServerCertificate=true;
      - Jwt__Secret=${JWT_SECRET:-default-dev-jwt-secret-change-in-production-use-32-chars-minimum}
      - Jwt__ValidAudience=http://localhost:80
      - Jwt__ValidIssuer=http://localhost:5000
      - Replicate__ApiToken=${REPLICATE_API_TOKEN:-placeholder-replicate-token}
      - AzureStorage__ConnectionString=UseDevelopmentStorage=true
    depends_on:
      - db
      - azurite
    networks:
      - ai-profile-network
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD:-DefaultDevPassword123!}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - ai-profile-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    networks:
      - ai-profile-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - ai-profile-network

networks:
  ai-profile-network:
    driver: bridge

volumes:
  sqlserver_data:
  azurite_data: