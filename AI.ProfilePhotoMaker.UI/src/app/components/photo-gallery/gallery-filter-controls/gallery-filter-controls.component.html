<div class="gallery-header">
  <div class="header-left">
    <h3>{{ title }}</h3>
    <div class="filter-controls">
      <select class="filter-select" [value]="filterType" (change)="onFilterChange($event)">
        <option value="all">All Images</option>
        <option value="generated">Generated</option>
        <option value="original">Original</option>
        <option value="enhanced">Enhanced</option>
      </select>
    </div>
  </div>
  <div class="header-center">
    <div class="view-toggle">
      <button
        class="toggle-btn"
        [class.active]="viewMode === 'grid'"
        (click)="setViewMode('grid')"
        aria-label="Grid view">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="7" height="7" stroke="currentColor" stroke-width="2" />
          <rect x="14" y="3" width="7" height="7" stroke="currentColor" stroke-width="2" />
          <rect x="3" y="14" width="7" height="7" stroke="currentColor" stroke-width="2" />
          <rect x="14" y="14" width="7" height="7" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>
      <button
        class="toggle-btn"
        [class.active]="viewMode === 'list'"
        (click)="setViewMode('list')"
        aria-label="List view">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <line x1="8" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" />
          <line x1="8" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" />
          <line x1="8" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" />
          <line x1="3" y1="6" x2="3.01" y2="6" stroke="currentColor" stroke-width="2" />
          <line x1="3" y1="12" x2="3.01" y2="12" stroke="currentColor" stroke-width="2" />
          <line x1="3" y1="18" x2="3.01" y2="18" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>
    </div>
  </div>
  <div class="header-right">
    <div class="action-controls" *ngIf="shouldShowBulkActions">
      <button class="action-btn select-all-btn" (click)="onSelectAll()">
        {{ selectAllText }}
      </button>
      <button class="action-btn download-btn" (click)="onDownloadSelected()" [disabled]="selectedImages.length === 0">
        Download ({{ selectedImages.length }})
      </button>
    </div>
  </div>
</div>

<div class="pagination-controls" *ngIf="filteredImages.length > 0">
  <div class="page-size-control">
    <label for="page-size">Items per page:</label>
    <select id="page-size" class="page-size-select" [value]="pageSize" (change)="onPageSizeChange($event)">
      <option value="12">12 per page</option>
      <option value="24">24 per page</option>
      <option value="48">48 per page</option>
    </select>
  </div>
</div>
