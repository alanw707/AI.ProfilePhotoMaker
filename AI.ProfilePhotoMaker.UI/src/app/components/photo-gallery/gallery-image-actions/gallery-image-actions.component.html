<!-- Grid View Actions -->
<ng-container *ngIf="viewMode === 'grid'">
  <!-- View Button (positioned in image overlay) -->
  <button 
    class="view-btn" 
    *ngIf="showViewButton"
    (click)="onView($event)"
    [disabled]="!isCompleted"
    title="View Image">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
    </svg>
  </button>

  <!-- Action Buttons (positioned in image info) -->
  <div class="image-actions" *ngIf="!showViewButton">
    <button 
      class="action-btn download-btn" 
      (click)="onDownload($event)"
      [disabled]="!isCompleted"
      title="Download">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M21 15V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V15" stroke="currentColor" stroke-width="2"/>
        <polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2"/>
        <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>
    <button 
      class="action-btn share-btn" 
      (click)="onShare($event)"
      [disabled]="!isCompleted"
      title="Share">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="2"/>
        <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
        <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke="currentColor" stroke-width="2"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>
    <button 
      class="action-btn delete-btn" 
      (click)="onDelete($event)"
      title="Delete">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <polyline points="3,6 5,6 21,6" stroke="currentColor" stroke-width="2"/>
        <path d="M19,6V20C19,21.1046 18.1046,22 17,22H7C5.89543,22 5,21.1046 5,20V6M8,6V4C8,2.89543 8.89543,2 10,2H14C15.1046,2 16,2.89543 16,4V6" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>
  </div>
</ng-container>

<!-- List View Actions -->
<div class="list-actions" *ngIf="viewMode === 'list'">
  <button 
    class="action-btn view-btn" 
    (click)="onView($event)"
    [disabled]="!isCompleted"
    title="View Image">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
    </svg>
  </button>
  <button 
    class="action-btn download-btn" 
    (click)="onDownload($event)"
    [disabled]="!isCompleted">
    Download
  </button>
  <button 
    class="action-btn share-btn" 
    (click)="onShare($event)"
    [disabled]="!isCompleted">
    Share
  </button>
  <button 
    class="action-btn delete-btn" 
    (click)="onDelete($event)">
    Delete
  </button>
</div>
