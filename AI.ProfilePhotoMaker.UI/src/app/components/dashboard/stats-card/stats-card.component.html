<div
  class="stat-card"
  *ngIf="showCard"
  [class.clickable]="isClickable && !isLoading"
  [class.loading]="isLoading"
  (click)="onCardClick()">
  <!-- Header with label and icon -->
  <div class="stat-header">
    <p class="card-label">{{ label }}</p>
    <div class="stat-icon">{{ icon }}</div>
  </div>

  <!-- Main content with value and growth indicator -->
  <div class="stat-content">
    <!-- Loading state -->
    <h3 *ngIf="isLoading">Loading...</h3>

    <!-- Normal display -->
    <h3 *ngIf="!isLoading" [class.model-status]="isModelStatus">{{ value }}</h3>
  </div>
</div>
