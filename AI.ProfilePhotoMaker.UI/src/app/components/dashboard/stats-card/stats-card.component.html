<div class="stat-card" 
     *ngIf="showCard" 
     [class.clickable]="isClickable && !isLoading"
     [class.loading]="isLoading"
     (click)="onCardClick()">
  <div class="stat-icon">{{icon}}</div>
  <div class="stat-content">
    <!-- Loading state -->
    <h3 *ngIf="isLoading" class="loading-text">Loading...</h3>
    
    <!-- Normal display -->
    <h3 *ngIf="!isLoading" [class.model-status]="isModelStatus">{{value}}</h3>
    
    <!-- Clean label without info icon -->
    <p class="card-label">{{label}}</p>
  </div>
  
  <!-- Click indicator for clickable cards -->
  <div class="click-indicator" *ngIf="isClickable && !isLoading">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>
