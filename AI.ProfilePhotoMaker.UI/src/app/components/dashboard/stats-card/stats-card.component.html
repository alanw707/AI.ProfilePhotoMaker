<div class="stat-card" *ngIf="showCard">
  <div class="stat-icon">{{icon}}</div>
  <div class="stat-content">
    <!-- Loading state -->
    <h3 *ngIf="isLoading" class="loading-text">Loading...</h3>
    
    <!-- Normal display -->
    <h3 *ngIf="!isLoading" [class.model-status]="isModelStatus">{{value}}</h3>
    
    <!-- Clean label without info icon -->
    <p class="card-label">{{label}}</p>
    
    <!-- Optional hint text for credits card -->
    <a *ngIf="showSettingsHint && !isLoading" routerLink="/settings" class="settings-hint">View Credits Breakdown</a>
  </div>
</div>
