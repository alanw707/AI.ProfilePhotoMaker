<button (click)="toggleTheme()" class="theme-toggle" type="button" aria-label="Toggle theme">
  <svg
    *ngIf="(currentTheme$ | async) === 'light'"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true">
    <circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1" x2="12" y2="3"></line>
    <line x1="12" y1="21" x2="12" y2="23"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="1" y1="12" x2="3" y2="12"></line>
    <line x1="21" y1="12" x2="23" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
  </svg>
  <svg
    *ngIf="(currentTheme$ | async) === 'dark'"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true">
    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
  </svg>
</button>

<div class="marketing-header">
  <div class="menu-overlay" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

  <div class="header-inner">
    <a class="brand" routerLink="/" (click)="closeAllMenus()" aria-label="AI Profile Photo Maker home">
      <img src="/assets/Logo.PNG" alt="AI Profile Photo Maker" />
      <span>AI Profile Photo Maker</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-controls="marketing-nav"
      aria-label="Toggle navigation">
      <span class="toggle-line"></span>
      <span class="toggle-line"></span>
      <span class="toggle-line"></span>
    </button>

    <nav id="marketing-nav" class="nav" [class.open]="isMobileMenuOpen" aria-label="Marketing navigation">
      <div
        class="nav-group"
        [class.open]="isMenuOpen('features')"
        (mouseenter)="openMenu('features')"
        (mouseleave)="closeMenu('features')">
        <button
          class="nav-link nav-link-button"
          type="button"
          (click)="toggleMenu('features')"
          [attr.aria-expanded]="isMenuOpen('features')"
          aria-haspopup="true"
          aria-controls="features-menu">
          Features
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div
          id="features-menu"
          class="dropdown"
          [class.open]="isMenuOpen('features')"
          [attr.aria-hidden]="!isMenuOpen('features')">
          <a routerLink="/features" (click)="closeAllMenus()">Overview</a>
          <a routerLink="/how-it-works" (click)="closeAllMenus()">How it works</a>
          <a routerLink="/examples" (click)="closeAllMenus()">Examples</a>
          <a routerLink="/ai-headshot-generator" (click)="closeAllMenus()">AI headshot generator</a>
          <a routerLink="/help" (click)="closeAllMenus()">Help & FAQ</a>
        </div>
      </div>

      <div
        class="nav-group"
        [class.open]="isMenuOpen('use-cases')"
        (mouseenter)="openMenu('use-cases')"
        (mouseleave)="closeMenu('use-cases')">
        <button
          class="nav-link nav-link-button"
          type="button"
          (click)="toggleMenu('use-cases')"
          [attr.aria-expanded]="isMenuOpen('use-cases')"
          aria-haspopup="true"
          aria-controls="use-cases-menu">
          Use Cases
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div
          id="use-cases-menu"
          class="dropdown"
          [class.open]="isMenuOpen('use-cases')"
          [attr.aria-hidden]="!isMenuOpen('use-cases')">
          <a routerLink="/linkedin-headshots" (click)="closeAllMenus()">LinkedIn headshots</a>
          <a routerLink="/professional-headshots" (click)="closeAllMenus()">Professional headshots</a>
          <a routerLink="/headshots-for-job-search" (click)="closeAllMenus()">Headshots for job search</a>
          <a routerLink="/realtor-headshots" (click)="closeAllMenus()">Realtor headshots</a>
          <a routerLink="/lawyer-headshots" (click)="closeAllMenus()">Lawyer headshots</a>
          <a routerLink="/doctor-headshots" (click)="closeAllMenus()">Doctor headshots</a>
          <a routerLink="/corporate-headshot" (click)="closeAllMenus()">Corporate headshot</a>
        </div>
      </div>

      <div
        class="nav-group"
        [class.open]="isMenuOpen('compare')"
        (mouseenter)="openMenu('compare')"
        (mouseleave)="closeMenu('compare')">
        <button
          class="nav-link nav-link-button"
          type="button"
          (click)="toggleMenu('compare')"
          [attr.aria-expanded]="isMenuOpen('compare')"
          aria-haspopup="true"
          aria-controls="compare-menu">
          Compare
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div
          id="compare-menu"
          class="dropdown"
          [class.open]="isMenuOpen('compare')"
          [attr.aria-hidden]="!isMenuOpen('compare')">
          <a routerLink="/compare/aragon-ai" (click)="closeAllMenus()">Aragon AI</a>
          <a routerLink="/compare/headshotpro" (click)="closeAllMenus()">HeadshotPro</a>
        </div>
      </div>

      <button class="nav-link nav-link-button" type="button" (click)="navigateToPricing()">Pricing</button>
      <button class="nav-link nav-link-button" type="button" (click)="navigateToReviews()">Reviews</button>
      <a class="nav-link" routerLink="/blog" (click)="closeAllMenus()">Blog</a>

      <ng-container *ngIf="!isAuthenticated; else authenticatedActions">
        <a class="nav-link ghost" routerLink="/auth/login" (click)="closeAllMenus()">Login</a>
        <a
          class="nav-link cta"
          routerLink="/auth/register"
          [queryParams]="getRegisterQueryParams()"
          (click)="onRegisterLinkClick($event)">
          Get Started
        </a>
      </ng-container>
      <ng-template #authenticatedActions>
        <button class="nav-link nav-link-button cta" type="button" (click)="navigateToDashboard()">
          Go to Dashboard
        </button>
        <button class="nav-link nav-link-button logout" type="button" (click)="logout()">Logout</button>
      </ng-template>
    </nav>
  </div>
</div>
