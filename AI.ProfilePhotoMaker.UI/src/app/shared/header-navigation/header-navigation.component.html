<div
  class="navigation-overlay"
  *ngIf="isMobileMenuOpen"
  (click)="closeMobileMenu()"
  (keydown.enter)="closeMobileMenu()"
  (keydown.space)="$event.preventDefault(); closeMobileMenu()"
  role="button"
  tabindex="0"
  aria-label="Close navigation"></div>

<header class="app-header" [class.menu-open]="isMobileMenuOpen">
  <div class="header-content">
    <a routerLink="/" class="logo-section" title="Go to home page" (click)="closeMobileMenu()">
      <img src="assets/Logo.PNG" alt="AI Profile Photo Maker" class="header-logo" />
      <span class="logo-title">AI Profile Photo Maker</span>
    </a>

    <nav
      id="primary-navigation"
      class="nav-menu"
      [class.mobile-open]="isMobileMenuOpen"
      aria-label="Primary navigation">
      <a routerLink="/pricing" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">Packages</a>
      <a
        routerLink="/app/enhance"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
        (click)="closeMobileMenu()">
        Photo workspace
      </a>
      <a routerLink="/app/gallery" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">My photos</a>
      <a
        *ngIf="isAuthenticated"
        routerLink="/app/settings"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMobileMenu()">
        Settings
      </a>
      <a
        *ngIf="isAuthenticated"
        routerLink="/app/support"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMobileMenu()">
        Support
      </a>
    </nav>

    <div class="header-actions">
      <button
        class="theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="'Switch to ' + (themeService.isDark() ? 'light' : 'dark') + ' theme'">
        <svg *ngIf="!themeService.isDark()" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M20.35 15.35A9 9 0 0 1 8.65 3.65 9 9 0 1 0 20.35 15.35Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round" />
        </svg>
        <svg *ngIf="themeService.isDark()" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.8" />
          <path
            d="M12 2.5v2M12 19.5v2M4.65 4.65l1.4 1.4M17.95 17.95l1.4 1.4M2.5 12h2M19.5 12h2M4.65 19.35l1.4-1.4M17.95 6.05l1.4-1.4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round" />
        </svg>
      </button>

      <ng-container *ngIf="isAuthenticated; else guestSection">
        <div class="user-section">
          <span class="user-avatar" aria-hidden="true">{{ (userName || 'U').charAt(0).toUpperCase() }}</span>
          <span class="user-info">
            <strong>{{ userName || 'Account' }}</strong>
            <small>{{ userEmail }}</small>
          </span>
          <button class="logout-button" type="button" (click)="logout()">Sign out</button>
        </div>
      </ng-container>

      <ng-template #guestSection>
        <div class="guest-actions">
          <a routerLink="/auth/login" class="button button-secondary">Log in</a>
          <a routerLink="/auth/register" class="button button-primary">Get started</a>
        </div>
      </ng-template>

      <button
        class="mobile-menu-toggle"
        type="button"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-controls="primary-navigation"
        aria-label="Toggle navigation">
        <svg *ngIf="!isMobileMenuOpen" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <svg *ngIf="isMobileMenuOpen" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>
</header>
