# Ultra-Compressed Application Deployment Pipeline
# Advanced Azure deployment with canary, blue-green, and rollback strategies

trigger: none # Triggered by quality gates pipeline

pr: none

parameters:
- name: environment
  displayName: 'Target Environment'
  type: string
  default: 'staging'
  values:
  - staging
  - production

- name: deploymentStrategy
  displayName: 'Deployment Strategy'
  type: string
  default: 'canary'
  values:
  - canary
  - bluegreen
  - runonce

- name: skipHealthCheck
  displayName: 'Skip Health Check'
  type: boolean
  default: false

variables:
  vmImageName: 'ubuntu-22.04'
  azureSubscription: 'ProfilePhotoMaker-ServiceConnection'
  resourceGroupName: 'rg-profilephotomaker-${{ parameters.environment }}'
  frontendAppName: 'app-profilephoto-frontend-${{ parameters.environment }}'
  apiAppName: 'app-profilephoto-api-${{ parameters.environment }}'
  keyVaultName: 'kv-profilephoto-${{ parameters.environment }}'

pool:
  vmImage: $(vmImageName)

stages:
# 📋 Pre-deployment Validation Stage
- stage: PreDeployment
  displayName: '📋 Pre-Deploy'
  jobs:
  - job: ValidateEnvironment
    displayName: 'Environment Validation'
    steps:
    - checkout: none
    
    # 🔍 Download and validate artifacts
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'specific'
        project: '$(System.TeamProject)'
        pipeline: 'Quality Gates Pipeline'
        buildVersionToDownload: 'latest'
        artifactName: 'deployment-packages'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: 'Download artifacts'
    
    # ✅ Validate artifact integrity
    - script: |
        echo "🔍 Validating artifact integrity..."
        cd $(System.ArtifactsDirectory)/deployment-packages
        
        # Check required files exist
        required_files=("frontend-*.zip" "api-*.zip" "build-metadata.json")
        for pattern in "${required_files[@]}"; do
          if ! ls $pattern 1> /dev/null 2>&1; then
            echo "❌ Missing required file: $pattern"
            exit 1
          fi
        done
        
        # Validate metadata
        if ! jq -e '.qualityGates | all' build-metadata.json; then
          echo "❌ Quality gates validation failed"
          exit 1
        fi
        
        echo "✅ Artifact validation passed"
      displayName: 'Validate artifacts'
    
    # 🌐 Environment health check
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "🌐 Validating Azure environment..."
          
          # Check resource group exists
          if ! az group show --name $(resourceGroupName) &>/dev/null; then
            echo "❌ Resource group $(resourceGroupName) not found"
            exit 1
          fi
          
          # Check App Services exist
          if ! az webapp show --name $(frontendAppName) --resource-group $(resourceGroupName) &>/dev/null; then
            echo "❌ Frontend app $(frontendAppName) not found"
            exit 1
          fi
          
          if ! az webapp show --name $(apiAppName) --resource-group $(resourceGroupName) &>/dev/null; then
            echo "❌ API app $(apiAppName) not found"
            exit 1
          fi
          
          # Check Key Vault access
          if ! az keyvault show --name $(keyVaultName) &>/dev/null; then
            echo "❌ Key Vault $(keyVaultName) not accessible"
            exit 1
          fi
          
          echo "✅ Environment validation passed"
      displayName: 'Validate Azure environment'

# 🚀 API Deployment Stage
- stage: DeployAPI
  displayName: '🚀 Deploy API'
  dependsOn: PreDeployment
  condition: succeeded()
  jobs:
  - deployment: DeployAPIJob
    displayName: 'API Deployment'
    environment: 'profilephotomaker-${{ parameters.environment }}-api'
    strategy:
      ${{ if eq(parameters.deploymentStrategy, 'canary') }}:
        canary:
          increments: [25, 50, 100]
          preDeploy:
            steps:
            - template: templates/api-predeploy.yml
              parameters:
                environment: ${{ parameters.environment }}
          deploy:
            steps:
            - template: templates/api-deploy.yml
              parameters:
                environment: ${{ parameters.environment }}
                strategy: $(strategy.name)
                increment: $(strategy.increment)
          postRouteTraffic:
            pool: server
            steps:
            - template: templates/health-check.yml
              parameters:
                appName: $(apiAppName)
                healthEndpoint: '/health'
                maxRetries: 10
          on:
            failure:
              steps:
              - template: templates/rollback.yml
                parameters:
                  appName: $(apiAppName)
                  environment: ${{ parameters.environment }}
            success:
              steps:
              - script: echo "✅ API canary deployment successful"
      ${{ elseif eq(parameters.deploymentStrategy, 'bluegreen') }}:
        blueGreen:
          preDeploy:
            steps:
            - template: templates/api-predeploy.yml
              parameters:
                environment: ${{ parameters.environment }}
          deploy:
            steps:
            - template: templates/api-bluegreen-deploy.yml
              parameters:
                environment: ${{ parameters.environment }}
          postDeploy:
            steps:
            - template: templates/api-bluegreen-switch.yml
              parameters:
                environment: ${{ parameters.environment }}
      ${{ else }}:
        runOnce:
          preDeploy:
            steps:
            - template: templates/api-predeploy.yml
              parameters:
                environment: ${{ parameters.environment }}
          deploy:
            steps:
            - template: templates/api-deploy.yml
              parameters:
                environment: ${{ parameters.environment }}
                strategy: 'runonce'
                increment: 100

# 🎨 Frontend Deployment Stage
- stage: DeployFrontend
  displayName: '🎨 Deploy Frontend'
  dependsOn: DeployAPI
  condition: succeeded()
  jobs:
  - deployment: DeployFrontendJob
    displayName: 'Frontend Deployment'
    environment: 'profilephotomaker-${{ parameters.environment }}-frontend'
    strategy:
      ${{ if eq(parameters.deploymentStrategy, 'canary') }}:
        canary:
          increments: [25, 50, 100]
          preDeploy:
            steps:
            - template: templates/frontend-predeploy.yml
              parameters:
                environment: ${{ parameters.environment }}
          deploy:
            steps:
            - template: templates/frontend-deploy.yml
              parameters:
                environment: ${{ parameters.environment }}
                strategy: $(strategy.name)
                increment: $(strategy.increment)
          postRouteTraffic:
            pool: server
            steps:
            - template: templates/frontend-health-check.yml
              parameters:
                appName: $(frontendAppName)
                maxRetries: 10
          on:
            failure:
              steps:
              - template: templates/rollback.yml
                parameters:
                  appName: $(frontendAppName)
                  environment: ${{ parameters.environment }}
            success:
              steps:
              - script: echo "✅ Frontend canary deployment successful"
      ${{ elseif eq(parameters.deploymentStrategy, 'bluegreen') }}:
        blueGreen:
          preDeploy:
            steps:
            - template: templates/frontend-predeploy.yml
              parameters:
                environment: ${{ parameters.environment }}
          deploy:
            steps:
            - template: templates/frontend-bluegreen-deploy.yml
              parameters:
                environment: ${{ parameters.environment }}
          postDeploy:
            steps:
            - template: templates/frontend-bluegreen-switch.yml
              parameters:
                environment: ${{ parameters.environment }}
      ${{ else }}:
        runOnce:
          preDeploy:
            steps:
            - template: templates/frontend-predeploy.yml
              parameters:
                environment: ${{ parameters.environment }}
          deploy:
            steps:
            - template: templates/frontend-deploy.yml
              parameters:
                environment: ${{ parameters.environment }}
                strategy: 'runonce'
                increment: 100

# 🔍 Post-Deployment Validation Stage
- stage: PostDeployment
  displayName: '🔍 Post-Deploy'
  dependsOn: 
  - DeployAPI
  - DeployFrontend
  condition: succeeded()
  jobs:
  - job: ValidationTests
    displayName: 'Validation Tests'
    steps:
    - checkout: self
      fetchDepth: 1
    
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    
    # 🧪 Smoke tests
    - script: |
        npm ci
        
        # Set environment URLs
        export API_URL="https://$(apiAppName).azurewebsites.net"
        export FRONTEND_URL="https://$(frontendAppName).azurewebsites.net"
        
        # Run smoke tests
        npm run test:smoke -- --env=${{ parameters.environment }}
      displayName: 'Run smoke tests'
    
    # 🎭 E2E tests with Playwright
    - script: |
        npx playwright install --with-deps chromium
        
        export BASE_URL="https://$(frontendAppName).azurewebsites.net"
        npx playwright test --project=chromium --reporter=junit
      displayName: 'Run E2E tests'
      continueOnError: ${{ parameters.skipHealthCheck }}
    
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'test-results/junit.xml'
        testRunTitle: 'Post-Deployment Tests'
        failTaskOnFailedTests: true

  # 📊 Performance validation
  - job: PerformanceValidation
    displayName: 'Performance Validation'
    dependsOn: ValidationTests
    condition: and(succeeded(), ne('${{ parameters.skipHealthCheck }}', true))
    steps:
    - script: |
        # Install K6
        sudo apt-get update
        sudo apt-get install -y ca-certificates gnupg
        curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install -y k6
        
        # Run load test against deployed environment
        export BASE_URL="https://$(frontendAppName).azurewebsites.net"
        export API_URL="https://$(apiAppName).azurewebsites.net"
        
        k6 run --out json=perf-results.json tests/performance/deployment-validation.js
      displayName: 'Performance validation'
    
    # 📈 Performance analysis
    - script: |
        python3 -c "
        import json
        import sys
        
        with open('perf-results.json', 'r') as f:
            data = json.load(f)
            
        metrics = data.get('metrics', {})
        response_time = metrics.get('http_req_duration', {}).get('avg', 0)
        error_rate = metrics.get('http_req_failed', {}).get('rate', 0)
        
        print(f'📊 Performance Results:')
        print(f'   Response Time: {response_time:.2f}ms')
        print(f'   Error Rate: {error_rate:.2%}')
        
        # Validate against thresholds
        if response_time > 3000:  # 3s threshold for production
            print(f'❌ Response time threshold exceeded: {response_time}ms > 3000ms')
            sys.exit(1)
            
        if error_rate > 0.01:  # 1% error threshold
            print(f'❌ Error rate threshold exceeded: {error_rate:.2%} > 1%')
            sys.exit(1)
            
        print('✅ Performance validation passed')
        "
      displayName: 'Analyze performance results'

# 📈 Deployment Metrics and Notification
- stage: Metrics
  displayName: '📈 Metrics'
  dependsOn: PostDeployment
  condition: always()
  jobs:
  - job: DeploymentMetrics
    displayName: 'Deployment Metrics'
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "📊 Collecting deployment metrics..."
          
          # Get deployment status
          DEPLOYMENT_STATUS=${{ dependencies.PostDeployment.result }}
          
          # Update deployment tags
          az webapp update --name $(apiAppName) --resource-group $(resourceGroupName) \
            --set tags.LastDeployment="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            tags.DeploymentStatus="$DEPLOYMENT_STATUS" \
            tags.BuildId="$(Build.BuildId)"
          
          az webapp update --name $(frontendAppName) --resource-group $(resourceGroupName) \
            --set tags.LastDeployment="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            tags.DeploymentStatus="$DEPLOYMENT_STATUS" \
            tags.BuildId="$(Build.BuildId)"
          
          echo "✅ Deployment metrics updated"
      displayName: 'Update deployment metrics'
    
    # 📧 Success notification
    - script: |
        echo "🎉 Deployment completed successfully!"
        echo "📱 Frontend: https://$(frontendAppName).azurewebsites.net"
        echo "🔌 API: https://$(apiAppName).azurewebsites.net"
        echo "🏗️ Build: $(Build.BuildId)"
        echo "🌿 Branch: $(Build.SourceBranch)"
      condition: succeeded()
      displayName: 'Success notification'
    
    # 🚨 Failure notification  
    - script: |
        echo "❌ Deployment failed or was cancelled"
        echo "🔍 Check pipeline logs for details"
        echo "🔄 Consider rollback if needed"
      condition: failed()
      displayName: 'Failure notification'