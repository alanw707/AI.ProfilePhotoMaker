# Health Check Template - Comprehensive monitoring with retry logic
parameters:
- name: appName
  type: string
- name: healthEndpoint
  type: string
  default: '/health'
- name: maxRetries
  type: number
  default: 5
- name: retryDelay
  type: number
  default: 30

steps:
# 🔍 Comprehensive health validation
- task: AzureCLI@2
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'  
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "🔍 Starting comprehensive health check for ${{ parameters.appName }}"
      
      BASE_URL="https://${{ parameters.appName }}.azurewebsites.net"
      HEALTH_URL="$BASE_URL${{ parameters.healthEndpoint }}"
      
      # Health check with exponential backoff
      check_health() {
        local attempt=$1
        local delay=$((attempt * ${{ parameters.retryDelay }}))
        
        echo "🔍 Health check attempt $attempt/${{ parameters.maxRetries }}"
        
        # Basic connectivity test
        if ! curl -f -s --max-time 30 "$HEALTH_URL" > /tmp/health_response.json; then
          echo "❌ Health endpoint unreachable"
          return 1
        fi
        
        # Parse health response
        if ! jq -e '.status == "healthy" or .status == "ok"' /tmp/health_response.json > /dev/null; then
          echo "❌ Health status not healthy"
          cat /tmp/health_response.json
          return 1
        fi
        
        # Check critical metrics
        response_time=$(curl -o /dev/null -s -w '%{time_total}' "$HEALTH_URL")
        if (( $(echo "$response_time > 5.0" | bc -l) )); then
          echo "⚠️ Slow response time: ${response_time}s"
        fi
        
        return 0
      }
      
      # Retry logic with exponential backoff
      for attempt in $(seq 1 ${{ parameters.maxRetries }}); do
        if check_health $attempt; then
          echo "✅ Health check passed on attempt $attempt"
          break
        else
          if [ $attempt -eq ${{ parameters.maxRetries }} ]; then
            echo "❌ Health check failed after ${{ parameters.maxRetries }} attempts"
            exit 1
          fi
          
          delay=$((attempt * ${{ parameters.retryDelay }}))
          echo "⏳ Waiting ${delay}s before retry..."
          sleep $delay
        fi
      done
      
      # Extended validation for production
      if [[ "$(environment)" == "production" ]]; then
        echo "🔬 Running extended production health checks..."
        
        # Check database connectivity
        if curl -f -s "$BASE_URL/health/database" > /tmp/db_health.json; then
          if jq -e '.database.connected == true' /tmp/db_health.json > /dev/null; then
            echo "✅ Database connectivity verified"
          else
            echo "❌ Database connectivity failed"
            exit 1
          fi
        fi
        
        # Check external dependencies
        if curl -f -s "$BASE_URL/health/dependencies" > /tmp/deps_health.json; then
          failed_deps=$(jq -r '.dependencies[] | select(.status != "healthy") | .name' /tmp/deps_health.json)
          if [ -n "$failed_deps" ]; then
            echo "❌ Failed dependencies: $failed_deps"
            exit 1
          else
            echo "✅ All dependencies healthy"
          fi
        fi
        
        # Memory and performance check
        if curl -f -s "$BASE_URL/health/metrics" > /tmp/metrics.json; then
          memory_usage=$(jq -r '.memory.usage_percent' /tmp/metrics.json)
          cpu_usage=$(jq -r '.cpu.usage_percent' /tmp/metrics.json)
          
          if (( $(echo "$memory_usage > 85" | bc -l) )); then
            echo "⚠️ High memory usage: ${memory_usage}%"
          fi
          
          if (( $(echo "$cpu_usage > 80" | bc -l) )); then
            echo "⚠️ High CPU usage: ${cpu_usage}%"
          fi
          
          echo "📊 Resource usage - Memory: ${memory_usage}%, CPU: ${cpu_usage}%"
        fi
      fi
      
      echo "✅ Comprehensive health check completed successfully"
  displayName: 'Health Check with Retry'
  timeoutInMinutes: 15

# 📊 Collect and validate metrics
- script: |
    echo "📊 Collecting application metrics..."
    
    BASE_URL="https://${{ parameters.appName }}.azurewebsites.net"
    
    # Performance baseline test
    echo "⚡ Running performance baseline..."
    for i in {1..5}; do
      response_time=$(curl -o /dev/null -s -w '%{time_total}' "$BASE_URL${{ parameters.healthEndpoint }}")
      echo "Response time $i: ${response_time}s"
    done
    
    # Check error rates via Application Insights (if available)
    if az extension show --name application-insights > /dev/null 2>&1; then
      echo "📈 Querying Application Insights for error rates..."
      # Query last 5 minutes for any errors
      az monitor app-insights query \
        --app $(ApplicationInsightsAppId) \
        --analytics-query "requests | where timestamp > ago(5m) | summarize errorRate = (countif(success == false) * 100.0) / count()" \
        --output tsv --query 'tables[0].rows[0][0]' > /tmp/error_rate.txt
      
      error_rate=$(cat /tmp/error_rate.txt || echo "0")
      if (( $(echo "$error_rate > 5" | bc -l) )); then
        echo "⚠️ High error rate detected: ${error_rate}%"
      else
        echo "✅ Error rate acceptable: ${error_rate}%"
      fi
    fi
    
    echo "✅ Metrics collection completed"
  displayName: 'Collect Metrics'
  continueOnError: true

# 🚨 Alert on health check failure
- script: |
    echo "🚨 Health check failed - initiating alert procedures"
    echo "📧 Sending failure notifications..."
    echo "🔄 Preparing for potential rollback..."
    
    # Log failure details
    echo "Failure Details:" > /tmp/failure_report.txt
    echo "App: ${{ parameters.appName }}" >> /tmp/failure_report.txt
    echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/failure_report.txt
    echo "Build: $(Build.BuildId)" >> /tmp/failure_report.txt
    echo "Environment: $(environment)" >> /tmp/failure_report.txt
    
    cat /tmp/failure_report.txt
  condition: failed()
  displayName: 'Health Check Failure Alert'