# API Deployment Template - Ultra-compressed with advanced patterns
parameters:
- name: environment
  type: string
- name: strategy
  type: string
  default: 'runonce'
- name: increment
  type: number
  default: 100

steps:
- checkout: none

- task: DownloadBuildArtifacts@1
  inputs:
    buildType: 'current'
    artifactName: 'deployment-packages'
    downloadPath: '$(System.ArtifactsDirectory)'
  displayName: 'Download API package'

# 🔐 Retrieve secrets from Key Vault
- task: AzureKeyVault@2
  inputs:
    azureSubscription: '$(azureSubscription)'
    KeyVaultName: '$(keyVaultName)'
    SecretsFilter: '*'
    RunAsPreJob: false
  displayName: 'Get secrets'

# 🚀 Deploy API with strategy-specific configuration
- task: AzureWebApp@1
  inputs:
    azureSubscription: '$(azureSubscription)'
    appType: 'webAppLinux'
    appName: '$(apiAppName)'
    package: '$(System.ArtifactsDirectory)/deployment-packages/api-*.zip'
    runtimeStack: 'NODE|20-lts'
    appSettings: |
      -NODE_ENV ${{ parameters.environment }}
      -PORT 8080
      -DATABASE_URL "$(DatabaseConnectionString)"
      -JWT_SECRET "$(JwtSecret)"
      -STORAGE_ACCOUNT_NAME "$(StorageAccountName)"
      -STORAGE_ACCOUNT_KEY "$(StorageAccountKey)"
      -APPLICATION_INSIGHTS_CONNECTION_STRING "$(ApplicationInsightsConnectionString)"
      -DEPLOYMENT_SLOT "${{ parameters.strategy }}"
      -TRAFFIC_PERCENTAGE "${{ parameters.increment }}"
  displayName: 'Deploy API (${{ parameters.strategy }} - ${{ parameters.increment }}%)'

# 🔄 Configure deployment slot for canary/blue-green
- task: AzureCLI@2
  condition: ne('${{ parameters.strategy }}', 'runonce')
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # Configure traffic routing for canary deployment
      if [ "${{ parameters.strategy }}" = "canary" ]; then
        echo "🎯 Configuring canary traffic: ${{ parameters.increment }}%"
        az webapp traffic-routing set \
          --resource-group $(resourceGroupName) \
          --name $(apiAppName) \
          --distribution staging=${{ parameters.increment }}
      fi
      
      # Configure slot settings for blue-green
      if [ "${{ parameters.strategy }}" = "bluegreen" ]; then
        echo "🔄 Configuring blue-green deployment"
        az webapp deployment slot create \
          --resource-group $(resourceGroupName) \
          --name $(apiAppName) \
          --slot staging \
          --configuration-source $(apiAppName)
      fi
  displayName: 'Configure deployment strategy'

# ⚡ Warm up API endpoints
- script: |
    echo "🔥 Warming up API endpoints..."
    sleep 30  # Allow deployment to settle
    
    BASE_URL="https://$(apiAppName).azurewebsites.net"
    if [ "${{ parameters.strategy }}" = "canary" ] && [ "${{ parameters.increment }}" -lt 100 ]; then
      BASE_URL="https://$(apiAppName)-staging.azurewebsites.net"
    fi
    
    # Health check with retry
    for i in {1..10}; do
      if curl -f -s "$BASE_URL/health" > /dev/null; then
        echo "✅ Health check passed on attempt $i"
        break
      else
        echo "⏳ Health check failed, retry $i/10..."
        sleep 10
      fi
      
      if [ $i -eq 10 ]; then
        echo "❌ Health check failed after 10 attempts"
        exit 1
      fi
    done
    
    # Warm up critical endpoints
    endpoints=("/api/auth/verify" "/api/profile/generate" "/api/health/detailed")
    for endpoint in "${endpoints[@]}"; do
      echo "🔥 Warming up: $endpoint"
      curl -s "$BASE_URL$endpoint" || echo "⚠️ Warmup failed: $endpoint"
    done
    
    echo "✅ API warmup completed"
  displayName: 'Warm up API'
  continueOnError: true