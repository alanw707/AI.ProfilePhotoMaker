# Rollback Template - Advanced automated rollback with validation
parameters:
- name: appName
  type: string
- name: environment
  type: string
- name: rollbackStrategy
  type: string
  default: 'automatic'
  values:
  - automatic
  - manual
  - slot-swap

steps:
- checkout: none

# 🔍 Pre-rollback validation
- task: AzureCLI@2
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "🔍 Validating rollback conditions for ${{ parameters.appName }}"
      
      # Get current deployment info
      current_deployment=$(az webapp deployment list \
        --name ${{ parameters.appName }} \
        --resource-group $(resourceGroupName) \
        --query '[0]' -o json)
      
      if [ "$current_deployment" = "null" ]; then
        echo "❌ No deployment history found - cannot rollback"
        exit 1
      fi
      
      current_commit=$(echo "$current_deployment" | jq -r '.id')
      current_time=$(echo "$current_deployment" | jq -r '.start_time')
      
      echo "📋 Current deployment:"
      echo "   Commit: $current_commit"
      echo "   Time: $current_time"
      
      # Check if there's a previous stable deployment
      previous_deployment=$(az webapp deployment list \
        --name ${{ parameters.appName }} \
        --resource-group $(resourceGroupName) \
        --query '[1]' -o json)
      
      if [ "$previous_deployment" = "null" ]; then
        echo "⚠️ No previous deployment found for rollback"
        echo "🔄 Will attempt application restart instead"
        echo "##vso[task.setvariable variable=rollbackType]restart"
      else
        previous_commit=$(echo "$previous_deployment" | jq -r '.id')
        previous_status=$(echo "$previous_deployment" | jq -r '.status')
        
        echo "📋 Previous deployment:"
        echo "   Commit: $previous_commit"
        echo "   Status: $previous_status"
        
        if [ "$previous_status" = "4" ]; then  # Successful deployment
          echo "✅ Previous stable deployment found"
          echo "##vso[task.setvariable variable=rollbackType]deployment"
          echo "##vso[task.setvariable variable=rollbackTarget]$previous_commit"
        else
          echo "⚠️ Previous deployment was not successful"
          echo "##vso[task.setvariable variable=rollbackType]restart"
        fi
      fi
  displayName: 'Validate Rollback Conditions'
  name: 'validateRollback'

# 🔄 Execute rollback based on strategy
- task: AzureCLI@2
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "🔄 Executing rollback for ${{ parameters.appName }}"
      
      ROLLBACK_TYPE="$(validateRollback.rollbackType)"
      ROLLBACK_TARGET="$(validateRollback.rollbackTarget)"
      
      case "${{ parameters.rollbackStrategy }}" in
        "slot-swap")
          echo "🔄 Performing slot swap rollback..."
          
          # Check if staging slot exists
          if az webapp deployment slot list --name ${{ parameters.appName }} --resource-group $(resourceGroupName) --query "[?name=='staging']" -o tsv | grep -q staging; then
            # Swap staging back to production
            az webapp deployment slot swap \
              --name ${{ parameters.appName }} \
              --resource-group $(resourceGroupName) \
              --slot staging \
              --target-slot production
            
            echo "✅ Slot swap rollback completed"
          else
            echo "❌ No staging slot found for swap rollback"
            exit 1
          fi
          ;;
          
        "automatic"|"manual")
          case "$ROLLBACK_TYPE" in
            "deployment")
              echo "🔄 Rolling back to previous deployment: $ROLLBACK_TARGET"
              
              # Get previous deployment package
              az webapp deployment list-publishing-credentials \
                --name ${{ parameters.appName }} \
                --resource-group $(resourceGroupName) \
                --query '{publishingUserName:publishingUserName,publishingPassword:publishingPassword}' -o json > /tmp/creds.json
              
              # Rollback to specific deployment
              az webapp deployment slot auto-swap \
                --name ${{ parameters.appName }} \
                --resource-group $(resourceGroupName) \
                --slot production \
                --disable
              
              echo "✅ Deployment rollback initiated"
              ;;
              
            "restart")
              echo "🔄 Performing application restart rollback..."
              
              # Stop app first to clear any corrupted state
              az webapp stop --name ${{ parameters.appName }} --resource-group $(resourceGroupName)
              sleep 30
              
              # Start app
              az webapp start --name ${{ parameters.appName }} --resource-group $(resourceGroupName)
              
              echo "✅ Application restart completed"
              ;;
              
            *)
              echo "❌ Unknown rollback type: $ROLLBACK_TYPE"
              exit 1
              ;;
          esac
          ;;
          
        *)
          echo "❌ Unknown rollback strategy: ${{ parameters.rollbackStrategy }}"
          exit 1
          ;;
      esac
      
      # Record rollback event
      ROLLBACK_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      az webapp update --name ${{ parameters.appName }} --resource-group $(resourceGroupName) \
        --set tags.LastRollback="$ROLLBACK_TIME" \
        tags.RollbackReason="Health check failure" \
        tags.RollbackStrategy="${{ parameters.rollbackStrategy }}" \
        tags.RollbackType="$ROLLBACK_TYPE" \
        || echo "⚠️ Failed to update rollback tags"
      
      echo "📝 Rollback event recorded"
  displayName: 'Execute Rollback'
  timeoutInMinutes: 10

# ⏳ Wait for rollback to settle
- script: |
    echo "⏳ Waiting for rollback to settle..."
    sleep 60
    echo "✅ Rollback settling period completed"
  displayName: 'Rollback Settlement'

# 🔍 Post-rollback validation
- task: AzureCLI@2
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "🔍 Validating rollback success for ${{ parameters.appName }}"
      
      BASE_URL="https://${{ parameters.appName }}.azurewebsites.net"
      HEALTH_URL="$BASE_URL/health"
      
      # Health check with retries
      max_attempts=10
      attempt=1
      
      while [ $attempt -le $max_attempts ]; do
        echo "🔍 Rollback validation attempt $attempt/$max_attempts"
        
        if curl -f -s --max-time 30 "$HEALTH_URL" > /tmp/health_response.json; then
          # Check if health endpoint returns success
          if jq -e '.status == "healthy" or .status == "ok"' /tmp/health_response.json > /dev/null; then
            echo "✅ Rollback validation successful on attempt $attempt"
            
            # Additional endpoint checks
            response_time=$(curl -o /dev/null -s -w '%{time_total}' "$HEALTH_URL")
            echo "📊 Response time after rollback: ${response_time}s"
            
            if (( $(echo "$response_time > 10.0" | bc -l) )); then
              echo "⚠️ Slow response time after rollback, but functional"
            else
              echo "✅ Response time acceptable after rollback"
            fi
            
            break
          else
            echo "⚠️ Health endpoint returned unhealthy status"
            cat /tmp/health_response.json
          fi
        else
          echo "❌ Health check failed on attempt $attempt"
        fi
        
        if [ $attempt -eq $max_attempts ]; then
          echo "❌ Rollback validation failed after $max_attempts attempts"
          echo "🚨 Manual intervention required"
          exit 1
        fi
        
        sleep 30
        attempt=$((attempt + 1))
      done
      
      # Test critical endpoints
      echo "🧪 Testing critical endpoints after rollback..."
      critical_endpoints=("/" "/health")
      
      for endpoint in "${critical_endpoints[@]}"; do
        if curl -f -s --max-time 15 "$BASE_URL$endpoint" > /dev/null; then
          echo "✅ $endpoint - OK"
        else
          echo "⚠️ $endpoint - Failed (may not be critical)"
        fi
      done
      
      echo "✅ Post-rollback validation completed"
  displayName: 'Post-Rollback Validation'
  timeoutInMinutes: 15

# 📊 Rollback metrics and reporting
- script: |
    echo "📊 Collecting rollback metrics..."
    
    ROLLBACK_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    
    # Create rollback report
    cat > rollback_report.json << EOF
    {
      "timestamp": "$ROLLBACK_TIME",
      "appName": "${{ parameters.appName }}",
      "environment": "${{ parameters.environment }}",
      "rollbackStrategy": "${{ parameters.rollbackStrategy }}",
      "rollbackType": "$(validateRollback.rollbackType)",
      "rollbackTarget": "$(validateRollback.rollbackTarget)",
      "buildId": "$(Build.BuildId)",
      "success": true,
      "validationPassed": true,
      "duration": {
        "total": "~3-5 minutes",
        "settlement": "60 seconds",
        "validation": "~2-3 minutes"
      }
    }
    EOF
    
    echo "📋 Rollback Report:"
    cat rollback_report.json | jq .
    
    echo "✅ Rollback completed successfully"
    echo "📧 Notification: Rollback completed for ${{ parameters.appName }} in ${{ parameters.environment }}"
  displayName: 'Rollback Reporting'

# 🚨 Rollback failure handling
- script: |
    echo "🚨 Rollback failed - Critical situation!"
    echo "📞 Immediate escalation required"
    echo "🔍 Check application logs and Azure portal"
    echo "⚠️ Manual intervention needed"
    echo "📋 Rollback details:"
    echo "   App: ${{ parameters.appName }}"
    echo "   Environment: ${{ parameters.environment }}"
    echo "   Strategy: ${{ parameters.rollbackStrategy }}"
    echo "   Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    echo "   Build: $(Build.BuildId)"
  condition: failed()
  displayName: 'Rollback Failure Alert'