# Validation & Rollback Pipeline - Ultra-compressed automated validation and rollback
# Triggered on deployment failures or health check alerts

trigger: none

parameters:
- name: targetEnvironment
  displayName: 'Target Environment'
  type: string
  default: 'staging'
  values:
  - staging
  - production

- name: validationType
  displayName: 'Validation Type'
  type: string
  default: 'comprehensive'
  values:
  - quick
  - comprehensive
  - security-focused

- name: rollbackTrigger
  displayName: 'Rollback Trigger'
  type: string
  default: 'auto'
  values:
  - auto
  - manual
  - force

variables:
  vmImageName: 'ubuntu-22.04'
  azureSubscription: 'ProfilePhotoMaker-ServiceConnection'
  resourceGroupName: 'rg-profilephotomaker-${{ parameters.targetEnvironment }}'
  frontendAppName: 'app-profilephoto-frontend-${{ parameters.targetEnvironment }}'
  apiAppName: 'app-profilephoto-api-${{ parameters.targetEnvironment }}'

pool:
  vmImage: $(vmImageName)

stages:
# 🔍 Validation Stage - Comprehensive deployment validation
- stage: DeploymentValidation
  displayName: '🔍 Validation'
  jobs:
  - job: ApplicationValidation
    displayName: 'Application Validation'
    strategy:
      matrix:
        ${{ if or(eq(parameters.validationType, 'comprehensive'), eq(parameters.validationType, 'quick')) }}:
          Functional:
            validationType: 'functional'
            testSuite: 'smoke'
            timeout: 10
          Performance:
            validationType: 'performance'
            testSuite: 'load'
            timeout: 15
        ${{ if or(eq(parameters.validationType, 'comprehensive'), eq(parameters.validationType, 'security-focused')) }}:
          Security:
            validationType: 'security'
            testSuite: 'security'
            timeout: 20
        ${{ if eq(parameters.validationType, 'comprehensive') }}:
          Integration:
            validationType: 'integration'
            testSuite: 'e2e'
            timeout: 25
    
    timeoutInMinutes: 30
    steps:
    - checkout: self
      fetchDepth: 1
    
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    
    # 🔧 Setup test environment
    - script: |
        echo "🔧 Setting up $(validationType) validation environment"
        npm ci
        
        # Set environment variables
        export TARGET_ENV="${{ parameters.targetEnvironment }}"
        export API_URL="https://$(apiAppName).azurewebsites.net"
        export FRONTEND_URL="https://$(frontendAppName).azurewebsites.net"
        export VALIDATION_TYPE="$(validationType)"
        
        echo "🌐 Target URLs:"
        echo "   API: $API_URL"
        echo "   Frontend: $FRONTEND_URL"
        echo "   Validation: $(validationType)"
      displayName: 'Setup Test Environment'
    
    # 🧪 Execute validation tests
    - script: |
        echo "🧪 Running $(validationType) validation tests"
        
        case "$(validationType)" in
          "functional")
            echo "🔍 Functional smoke tests"
            npm run test:smoke -- --env=${{ parameters.targetEnvironment }} --reporter=junit --outputFile=functional-results.xml
            ;;
          "performance")
            echo "⚡ Performance validation"
            # Install K6 for performance testing
            sudo apt-get update && sudo apt-get install -y k6
            k6 run --out json=performance-results.json tests/performance/validation.js
            ;;
          "security")
            echo "🛡️ Security validation"
            npm run test:security -- --env=${{ parameters.targetEnvironment }} --reporter=junit --outputFile=security-results.xml
            # Additional OWASP ZAP scan
            docker run -v $(pwd):/zap/wrk/:rw -t owasp/zap2docker-stable zap-baseline.py -t $FRONTEND_URL -J security-scan.json || true
            ;;
          "integration")
            echo "🔗 Integration E2E tests"
            npx playwright install --with-deps
            npx playwright test --project=chromium --reporter=junit
            ;;
        esac
      displayName: 'Execute $(validationType) Tests'
      timeoutInMinutes: $(timeout)
      continueOnError: true
    
    # 📊 Analyze test results
    - script: |
        echo "📊 Analyzing $(validationType) test results"
        
        VALIDATION_PASSED=true
        ISSUES_FOUND=()
        
        case "$(validationType)" in
          "functional")
            if [ -f "functional-results.xml" ]; then
              failures=$(xmllint --xpath "count(//failure)" functional-results.xml 2>/dev/null || echo "0")
              if [ "$failures" -gt "0" ]; then
                VALIDATION_PASSED=false
                ISSUES_FOUND+=("$failures functional test failures")
              fi
            else
              VALIDATION_PASSED=false
              ISSUES_FOUND+=("Functional test results not found")
            fi
            ;;
          "performance")
            if [ -f "performance-results.json" ]; then
              avg_response_time=$(jq -r '.metrics.http_req_duration.avg // 0' performance-results.json)
              error_rate=$(jq -r '.metrics.http_req_failed.rate // 0' performance-results.json)
              
              if (( $(echo "$avg_response_time > 5000" | bc -l) )); then
                VALIDATION_PASSED=false
                ISSUES_FOUND+=("High response time: ${avg_response_time}ms")
              fi
              
              if (( $(echo "$error_rate > 0.05" | bc -l) )); then
                VALIDATION_PASSED=false
                ISSUES_FOUND+=("High error rate: $(echo "$error_rate * 100" | bc)%")
              fi
            else
              VALIDATION_PASSED=false
              ISSUES_FOUND+=("Performance test results not found")
            fi
            ;;
          "security")
            if [ -f "security-scan.json" ]; then
              high_risk=$(jq -r '.site[0].alerts[] | select(.riskdesc | contains("High")) | length' security-scan.json 2>/dev/null || echo "0")
              if [ "$high_risk" -gt "0" ]; then
                VALIDATION_PASSED=false
                ISSUES_FOUND+=("$high_risk high-risk security issues found")
              fi
            fi
            
            if [ -f "security-results.xml" ]; then
              failures=$(xmllint --xpath "count(//failure)" security-results.xml 2>/dev/null || echo "0")
              if [ "$failures" -gt "0" ]; then
                VALIDATION_PASSED=false
                ISSUES_FOUND+=("$failures security test failures")
              fi
            fi
            ;;
          "integration")
            if [ -f "test-results/junit.xml" ]; then
              failures=$(xmllint --xpath "count(//failure)" test-results/junit.xml 2>/dev/null || echo "0")
              if [ "$failures" -gt "0" ]; then
                VALIDATION_PASSED=false
                ISSUES_FOUND+=("$failures E2E test failures")
              fi
            else
              VALIDATION_PASSED=false
              ISSUES_FOUND+=("E2E test results not found")
            fi
            ;;
        esac
        
        # Generate validation report
        cat > validation_report_$(validationType).json << EOF
        {
          "validationType": "$(validationType)",
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "environment": "${{ parameters.targetEnvironment }}",
          "passed": $VALIDATION_PASSED,
          "issues": $(printf '%s\n' "${ISSUES_FOUND[@]}" | jq -R . | jq -s .),
          "recommendation": "$(if [ "$VALIDATION_PASSED" = "true" ]; then echo "proceed"; else echo "rollback"; fi)"
        }
        EOF
        
        echo "📋 $(validationType) Validation Report:"
        cat validation_report_$(validationType).json | jq .
        
        # Set pipeline variables
        echo "##vso[task.setvariable variable=validationPassed;isOutput=true]$VALIDATION_PASSED"
        echo "##vso[task.setvariable variable=issueCount;isOutput=true]${#ISSUES_FOUND[@]}"
        
        if [ "$VALIDATION_PASSED" = "false" ]; then
          echo "❌ $(validationType) validation failed"
          exit 1
        else
          echo "✅ $(validationType) validation passed"
        fi
      displayName: 'Analyze $(validationType) Results'
      name: 'validation'
    
    # 📊 Publish test results
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: |
          functional-results.xml
          security-results.xml
          test-results/junit.xml
        testRunTitle: '$(validationType) Validation Tests'
        failTaskOnFailedTests: false
      displayName: 'Publish Test Results'

# 🔄 Rollback Decision Stage
- stage: RollbackDecision
  displayName: '🔄 Rollback Decision'
  dependsOn: DeploymentValidation
  condition: or(failed(), eq('${{ parameters.rollbackTrigger }}', 'force'))
  jobs:
  - job: EvaluateRollback
    displayName: 'Evaluate Rollback Need'
    steps:
    - checkout: none
    
    # 🧮 Aggregate validation results
    - script: |
        echo "🧮 Aggregating validation results for rollback decision"
        
        # Collect results from matrix jobs
        TOTAL_VALIDATIONS=0
        FAILED_VALIDATIONS=0
        CRITICAL_FAILURES=0
        
        # Analyze each validation type
        validation_types=("functional" "performance" "security" "integration")
        
        for validation_type in "${validation_types[@]}"; do
          # Check if this validation was run based on parameters
          case "${{ parameters.validationType }}" in
            "quick")
              if [[ "$validation_type" != "functional" && "$validation_type" != "performance" ]]; then
                continue
              fi
              ;;
            "security-focused")
              if [[ "$validation_type" != "functional" && "$validation_type" != "security" ]]; then
                continue
              fi
              ;;
            "comprehensive")
              # All validations run
              ;;
          esac
          
          TOTAL_VALIDATIONS=$((TOTAL_VALIDATIONS + 1))
          
          # Simulate validation result check (in real scenario, get from dependencies)
          if [[ "${{ dependencies.DeploymentValidation.result }}" == "Failed" ]]; then
            FAILED_VALIDATIONS=$((FAILED_VALIDATIONS + 1))
            
            # Security and functional failures are critical
            if [[ "$validation_type" == "security" || "$validation_type" == "functional" ]]; then
              CRITICAL_FAILURES=$((CRITICAL_FAILURES + 1))
            fi
          fi
        done
        
        echo "📊 Validation Summary:"
        echo "   Total: $TOTAL_VALIDATIONS"
        echo "   Failed: $FAILED_VALIDATIONS"
        echo "   Critical: $CRITICAL_FAILURES"
        
        # Rollback decision logic
        ROLLBACK_REQUIRED=false
        ROLLBACK_REASON=""
        
        if [ "${{ parameters.rollbackTrigger }}" = "force" ]; then
          ROLLBACK_REQUIRED=true
          ROLLBACK_REASON="Force rollback requested"
        elif [ $CRITICAL_FAILURES -gt 0 ]; then
          ROLLBACK_REQUIRED=true
          ROLLBACK_REASON="Critical validation failures ($CRITICAL_FAILURES)"
        elif [ $TOTAL_VALIDATIONS -gt 0 ] && [ $FAILED_VALIDATIONS -eq $TOTAL_VALIDATIONS ]; then
          ROLLBACK_REQUIRED=true
          ROLLBACK_REASON="All validations failed"
        elif [ $FAILED_VALIDATIONS -gt 0 ] && [ "${{ parameters.rollbackTrigger }}" = "auto" ]; then
          # Calculate failure percentage
          failure_percentage=$((FAILED_VALIDATIONS * 100 / TOTAL_VALIDATIONS))
          if [ $failure_percentage -ge 50 ]; then
            ROLLBACK_REQUIRED=true
            ROLLBACK_REASON="High failure rate: ${failure_percentage}%"
          fi
        fi
        
        echo "🎯 Rollback Decision: $ROLLBACK_REQUIRED"
        echo "📝 Reason: $ROLLBACK_REASON"
        
        # Set variables for next stage
        echo "##vso[task.setvariable variable=rollbackRequired;isOutput=true]$ROLLBACK_REQUIRED"
        echo "##vso[task.setvariable variable=rollbackReason;isOutput=true]$ROLLBACK_REASON"
        
        if [ "$ROLLBACK_REQUIRED" = "true" ]; then
          echo "🚨 Rollback will be initiated"
        else
          echo "✅ No rollback required - deployment validated"
        fi
      displayName: 'Aggregate Results & Decision'
      name: 'rollbackDecision'

# 🔄 Rollback Execution Stage
- stage: RollbackExecution
  displayName: '🔄 Rollback Execution'
  dependsOn: 
  - DeploymentValidation
  - RollbackDecision
  condition: eq(dependencies.RollbackDecision.outputs['EvaluateRollback.rollbackDecision.rollbackRequired'], 'true')
  jobs:
  - deployment: RollbackDeployment
    displayName: 'Execute Rollback'
    environment: 'profilephotomaker-${{ parameters.targetEnvironment }}-rollback'
    strategy:
      runOnce:
        deploy:
          steps:
          # 🔄 Rollback API
          - template: templates/rollback.yml
            parameters:
              appName: $(apiAppName)
              environment: ${{ parameters.targetEnvironment }}
              rollbackStrategy: 'automatic'
          
          # 🔄 Rollback Frontend
          - template: templates/rollback.yml
            parameters:
              appName: $(frontendAppName)
              environment: ${{ parameters.targetEnvironment }}
              rollbackStrategy: 'automatic'
          
          # 🔍 Post-rollback validation
          - template: templates/health-check.yml
            parameters:
              appName: $(apiAppName)
              healthEndpoint: '/health'
              maxRetries: 5
          
          - template: templates/health-check.yml
            parameters:
              appName: $(frontendAppName)
              healthEndpoint: '/health'
              maxRetries: 5

# 📊 Post-Action Reporting
- stage: Reporting
  displayName: '📊 Reporting'
  dependsOn: 
  - DeploymentValidation
  - RollbackDecision
  - RollbackExecution
  condition: always()
  jobs:
  - job: GenerateReport
    displayName: 'Generate Final Report'
    steps:
    - checkout: none
    
    - script: |
        echo "📊 Generating comprehensive validation & rollback report"
        
        # Collect all results
        VALIDATION_RESULT="${{ dependencies.DeploymentValidation.result }}"
        ROLLBACK_REQUIRED="${{ dependencies.RollbackDecision.outputs['EvaluateRollback.rollbackDecision.rollbackRequired'] }}"
        ROLLBACK_REASON="${{ dependencies.RollbackDecision.outputs['EvaluateRollback.rollbackDecision.rollbackReason'] }}"
        ROLLBACK_RESULT="${{ dependencies.RollbackExecution.result }}"
        
        # Create comprehensive report
        cat > final_report.json << EOF
        {
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "environment": "${{ parameters.targetEnvironment }}",
          "validationType": "${{ parameters.validationType }}",
          "rollbackTrigger": "${{ parameters.rollbackTrigger }}",
          "buildId": "$(Build.BuildId)",
          "results": {
            "validation": {
              "overall": "$VALIDATION_RESULT",
              "passed": $([ "$VALIDATION_RESULT" = "Succeeded" ] && echo "true" || echo "false")
            },
            "rollback": {
              "required": $(echo "$ROLLBACK_REQUIRED" | tr '[:upper:]' '[:lower:]'),
              "reason": "$ROLLBACK_REASON",
              "executed": $([ -n "$ROLLBACK_RESULT" ] && echo "true" || echo "false"),
              "successful": $([ "$ROLLBACK_RESULT" = "Succeeded" ] && echo "true" || echo "false")
            }
          },
          "summary": {
            "action": "$(if [ "$ROLLBACK_REQUIRED" = "true" ]; then echo "rollback_executed"; else echo "validation_passed"; fi)",
            "status": "$(if [ "$VALIDATION_RESULT" = "Succeeded" ] || [ "$ROLLBACK_RESULT" = "Succeeded" ]; then echo "resolved"; else echo "requires_attention"; fi)"
          },
          "nextSteps": $(if [ "$VALIDATION_RESULT" = "Succeeded" ]; then echo '["Monitor deployment health"]'; elif [ "$ROLLBACK_RESULT" = "Succeeded" ]; then echo '["Investigate root cause", "Fix issues", "Redeploy when ready"]'; else echo '["Manual intervention required", "Check logs", "Contact operations team"]'; fi)
        }
        EOF
        
        echo "📋 Final Report:"
        cat final_report.json | jq .
        
        # Summary
        if [ "$VALIDATION_RESULT" = "Succeeded" ]; then
          echo "✅ Deployment validation passed - no action needed"
        elif [ "$ROLLBACK_RESULT" = "Succeeded" ]; then
          echo "🔄 Rollback completed successfully - investigate and fix issues"
        else
          echo "🚨 Manual intervention required - check logs and contact operations"
        fi
        
        # Archive report
        echo "##vso[artifact.upload containerfolder=ValidationReports;artifactname=validation-report-$(date +%Y%m%d-%H%M)]final_report.json"
      displayName: 'Generate Final Report'