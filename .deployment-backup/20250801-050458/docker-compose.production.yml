version: '3.8'

# Production-ready Docker Compose configuration
# Use this for local production testing or as Azure deployment fallback

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: final
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - API_URL=${API_URL:-http://backend:80/api}
      - BASE_URL=${BASE_URL:-http://localhost:5000}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-profile-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: final
    ports:
      - "${BACKEND_PORT:-5000}:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:-Server=db;Database=aiprofilephotomaker;User Id=sa;Password=${DB_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=true;}
      - Jwt__Secret=${JWT_SECRET:-your-super-secret-jwt-key-here-change-in-production}
      - Jwt__ValidAudience=${JWT_AUDIENCE:-http://localhost:80}
      - Jwt__ValidIssuer=${JWT_ISSUER:-http://localhost:5000}
      - Replicate__ApiToken=${REPLICATE_API_TOKEN:-your-replicate-api-token}
      - AzureStorage__ConnectionString=${AZURE_STORAGE_CONNECTION:-UseDevelopmentStorage=true}
      - Redis__ConnectionString=${REDIS_CONNECTION:-redis:6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-profile-network
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD:-YourStrong@Passw0rd}
      - MSSQL_PID=Express
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - ai-profile-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD:-YourStrong@Passw0rd} -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-profile-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Nginx reverse proxy for production-like setup
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ai-profile-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Azure Storage Emulator (for local development)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
      - "${AZURITE_QUEUE_PORT:-10001}:10001"
      - "${AZURITE_TABLE_PORT:-10002}:10002"
    volumes:
      - azurite_data:/data
    networks:
      - ai-profile-network
    restart: unless-stopped
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0

networks:
  ai-profile-network:
    driver: bridge
    name: ai-profile-network

volumes:
  sqlserver_data:
    name: ai-profile-sqlserver-data
  azurite_data:
    name: ai-profile-azurite-data
  redis_data:
    name: ai-profile-redis-data
  uploads_data:
    name: ai-profile-uploads-data
  logs_data:
    name: ai-profile-logs-data