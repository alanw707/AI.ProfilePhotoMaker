# Ultra-Compressed Quality Gates Pipeline for Azure Deployment
# 8-step validation cycle with advanced automation and security gates

trigger:
  branches:
    include: ['main', 'develop', 'feature/*']
  paths:
    exclude: ['docs/', '*.md']

variables:
  vmImageName: 'ubuntu-22.04'
  nodeVersion: '20.x'
  pythonVersion: '3.11'
  
pool:
  vmImage: $(vmImageName)

stages:
# 🧪 Quality Gates Stage - Multi-layer validation
- stage: QualityGates
  displayName: '🧪 Quality Gates'
  jobs:
  - job: ParallelValidation
    displayName: 'Parallel Quality Validation'
    strategy:
      matrix:
        Syntax:
          validationType: 'syntax'
          displayName: '📝 Syntax & Lint'
        Security:
          validationType: 'security'
          displayName: '🛡️ Security Scan'
        Performance:
          validationType: 'performance'
          displayName: '⚡ Performance Test'
        Types:
          validationType: 'types'
          displayName: '🔍 Type Check'
    steps:
    - checkout: self
      fetchDepth: 1
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
    
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(pythonVersion)
    
    # 🔄 Install dependencies with caching
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: 'npm | "$(Agent.OS)"'
        path: $(npm_config_cache)
      displayName: 'Cache npm'
    
    - script: npm ci
      displayName: 'Install deps'
    
    # 📝 Gate 1: Syntax & Lint Validation
    - script: |
        case "$(validationType)" in
          "syntax")
            echo "▶️ Syntax validation"
            npm run lint -- --format=junit --output-file=lint-results.xml
            npm run format:check
            ;;
          "security")
            echo "▶️ Security scanning"
            npm audit --audit-level=moderate --json > security-audit.json
            npx @cyclone-dx/cyclone-dx-npm --output-format JSON --output-file sbom.json
            ;;
          "performance")
            echo "▶️ Performance testing"
            npm run test:perf -- --reporter=xunit --outputFile=perf-results.xml
            ;;
          "types")
            echo "▶️ Type checking"
            npm run type-check
            npx tsc --noEmit --skipLibCheck
            ;;
        esac
      displayName: 'Quality gate validation'
      continueOnError: false
    
    # 📊 Publish results with failure detection
    - task: PublishTestResults@2
      condition: eq(variables['validationType'], 'syntax')
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'lint-results.xml'
        testRunTitle: 'Lint Results'
        failTaskOnFailedTests: true
    
    - task: PublishTestResults@2
      condition: eq(variables['validationType'], 'performance')
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'perf-results.xml'
        testRunTitle: 'Performance Tests'
        failTaskOnFailedTests: true

# 🧪 Comprehensive Testing Stage
- stage: Testing
  displayName: '🧪 Testing'
  dependsOn: QualityGates
  condition: succeeded()
  jobs:
  - job: UnitTests
    displayName: 'Unit Tests'
    steps:
    - checkout: self
      fetchDepth: 1
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
    - script: npm ci
      displayName: 'Install deps'
    - script: |
        npm run test:unit -- --coverage --reporter=cobertura --outputFile=coverage/cobertura-coverage.xml
        npm run test:unit -- --reporter=junit --outputFile=unit-test-results.xml
      displayName: 'Run unit tests'
    
    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'unit-test-results.xml'
        testRunTitle: 'Unit Tests'
        failTaskOnFailedTests: true
    
    - task: PublishCodeCoverageResults@2
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: 'coverage/cobertura-coverage.xml'
        reportDirectory: 'coverage'
        failIfCoverageEmpty: true

  - job: IntegrationTests
    displayName: 'Integration Tests'
    dependsOn: UnitTests
    steps:
    - checkout: self
      fetchDepth: 1
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
    - script: npm ci
      displayName: 'Install deps'
    - script: |
        npm run test:integration -- --reporter=junit --outputFile=integration-test-results.xml
      displayName: 'Run integration tests'
    
    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'integration-test-results.xml'
        testRunTitle: 'Integration Tests'
        failTaskOnFailedTests: true

# 🔐 Security Deep Scan Stage
- stage: SecurityValidation
  displayName: '🔐 Security'
  dependsOn: Testing
  condition: succeeded()
  jobs:
  - job: AdvancedSecurity
    displayName: 'Advanced Security Scan'
    steps:
    - checkout: self
      fetchDepth: 0 # Full history for security analysis
    
    # 🔍 SAST Scanning
    - task: AdvancedSecurity-Codeql-Init@1
      inputs:
        languages: 'javascript,typescript'
        buildMode: 'autobuild'
    
    - task: AdvancedSecurity-Codeql-Autobuild@1
    
    - task: AdvancedSecurity-Codeql-Analyze@1
    
    # 🔒 Dependency Scanning
    - task: AdvancedSecurity-Dependency-Scanning@1
      displayName: 'Dependency vulnerability scan'
    
    # 🛡️ Container Security (if applicable)
    - script: |
        if [ -f "Dockerfile" ]; then
          docker build -t temp-security-scan .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd):/src aquasec/trivy image temp-security-scan --format json --output security-scan.json
        fi
      displayName: 'Container security scan'
      continueOnError: true

# ⚡ Performance Validation Stage
- stage: PerformanceValidation
  displayName: '⚡ Performance'
  dependsOn: SecurityValidation
  condition: succeeded()
  jobs:
  - job: LoadTesting
    displayName: 'Load Testing'
    timeoutInMinutes: 30
    steps:
    - checkout: self
      fetchDepth: 1
    
    # 🎯 Performance testing with K6
    - script: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates gnupg
        curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install -y k6
      displayName: 'Install K6'
    
    - script: |
        k6 run --out json=performance-results.json tests/performance/load-test.js
      displayName: 'Run load tests'
      continueOnError: true
    
    # 📊 Performance metrics validation
    - script: |
        python3 -c "
        import json
        with open('performance-results.json', 'r') as f:
            data = json.load(f)
            avg_response_time = data.get('metrics', {}).get('http_req_duration', {}).get('avg', 0)
            if avg_response_time > 2000:  # 2s threshold
                print(f'❌ Performance failed: {avg_response_time}ms > 2000ms')
                exit(1)
            else:
                print(f'✅ Performance passed: {avg_response_time}ms')
        "
      displayName: 'Validate performance metrics'

# 🎯 Final Validation & Artifact Creation
- stage: ArtifactCreation
  displayName: '🎯 Artifacts'
  dependsOn: 
  - QualityGates
  - Testing
  - SecurityValidation
  - PerformanceValidation
  condition: succeeded()
  jobs:
  - job: BuildArtifacts
    displayName: 'Build & Package'
    steps:
    - checkout: self
      fetchDepth: 1
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
    
    - script: npm ci
      displayName: 'Install deps'
    
    - script: |
        npm run build:production
        npm run build:api
      displayName: 'Build applications'
    
    # 📦 Create deployment packages
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'dist/frontend'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/frontend-$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Package frontend'
    
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'dist/api'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/api-$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Package API'
    
    # 🏷️ Generate build metadata
    - script: |
        cat > $(Build.ArtifactStagingDirectory)/build-metadata.json << EOF
        {
          "buildId": "$(Build.BuildId)",
          "buildNumber": "$(Build.BuildNumber)",
          "sourceVersion": "$(Build.SourceVersion)",
          "sourceBranch": "$(Build.SourceBranch)",
          "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "qualityGates": {
            "syntax": true,
            "security": true,
            "tests": true,
            "performance": true
          }
        }
        EOF
      displayName: 'Generate metadata'
    
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'deployment-packages'
        publishLocation: 'Container'
      displayName: 'Publish artifacts'

# 🚨 Failure notification and cleanup
- stage: FailureHandling
  displayName: '🚨 Failure Handling'
  dependsOn: 
  - QualityGates
  - Testing
  - SecurityValidation
  - PerformanceValidation
  condition: failed()
  jobs:
  - job: NotifyFailure
    displayName: 'Failure Notification'
    steps:
    - script: |
        echo "❌ Quality gates failed - deployment blocked"
        echo "🔍 Check logs for specific failures"
        echo "📊 Review test results and security scans"
      displayName: 'Log failure details'
    
    # 📧 Notification logic (customize for your team)
    - task: EmailReport@1
      condition: always()
      inputs:
        sendMailConditionConfig: 'OnFailure'
        subject: '🚨 Quality Gates Failed - $(Build.DefinitionName) #$(Build.BuildNumber)'
        to: '$(Build.RequestedForEmail)'
        body: |
          Quality gates failed for build $(Build.BuildNumber).
          
          Branch: $(Build.SourceBranch)
          Commit: $(Build.SourceVersion)
          
          Please check the pipeline logs for details.
      continueOnError: true