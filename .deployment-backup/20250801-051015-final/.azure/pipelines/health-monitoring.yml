# Health Monitoring & Alerting Pipeline - Ultra-compressed advanced monitoring
# Automated health checks, alerting, and self-healing mechanisms

trigger:
  schedules:
  - cron: "*/15 * * * *"  # Every 15 minutes
    displayName: Health Check Schedule
    branches:
      include:
      - main
    always: true

parameters:
- name: environment
  displayName: 'Environment to Monitor'
  type: string
  default: 'production'
  values:
  - staging
  - production

- name: alertThreshold
  displayName: 'Alert Threshold (failures before alert)'
  type: number
  default: 3

variables:
  vmImageName: 'ubuntu-22.04'
  azureSubscription: 'ProfilePhotoMaker-ServiceConnection'
  resourceGroupName: 'rg-profilephotomaker-${{ parameters.environment }}'
  frontendAppName: 'app-profilephoto-frontend-${{ parameters.environment }}'
  apiAppName: 'app-profilephoto-api-${{ parameters.environment }}'
  keyVaultName: 'kv-profilephoto-${{ parameters.environment }}'
  actionGroupName: 'ag-profilephoto-${{ parameters.environment }}'
  
pool:
  vmImage: $(vmImageName)

stages:
# 🔍 Health Monitoring Stage
- stage: HealthMonitoring
  displayName: '🔍 Health Monitoring'
  jobs:
  - job: SystemHealthCheck
    displayName: 'System Health Check'
    strategy:
      matrix:
        Frontend:
          appName: $(frontendAppName)
          appType: 'frontend'
          healthEndpoint: '/health'
          criticalEndpoints: '/, /login, /generate'
        API:
          appName: $(apiAppName)
          appType: 'api'
          healthEndpoint: '/health'
          criticalEndpoints: '/health, /api/auth/verify, /api/profile/generate'
    steps:
    - checkout: none
    
    # 🔍 Comprehensive health validation
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "🔍 Starting health monitoring for $(appName)"
          
          # Initialize metrics
          HEALTH_SCORE=100
          ISSUES_FOUND=()
          METRICS_FILE="/tmp/health_metrics_$(appType).json"
          
          # Function to check endpoint health
          check_endpoint() {
            local url=$1
            local endpoint=$2
            local timeout=${3:-10}
            
            echo "🌐 Checking: $url$endpoint"
            
            # Measure response time and status
            response=$(curl -w "@-" -o /tmp/response.json -s --max-time $timeout "$url$endpoint" <<'EOF'
          {
            "time_total": %{time_total},
            "http_code": %{http_code},
            "size_download": %{size_download},
            "time_connect": %{time_connect},
            "time_starttransfer": %{time_starttransfer}
          }
          EOF
          )
            
            if [ $? -eq 0 ]; then
              http_code=$(echo "$response" | jq -r '.http_code')
              time_total=$(echo "$response" | jq -r '.time_total')
              
              if [ "$http_code" = "200" ]; then
                if (( $(echo "$time_total > 5.0" | bc -l) )); then
                  echo "⚠️ Slow response: ${time_total}s"
                  HEALTH_SCORE=$((HEALTH_SCORE - 10))
                  ISSUES_FOUND+=("Slow response on $endpoint: ${time_total}s")
                else
                  echo "✅ Healthy: ${time_total}s"
                fi
              else
                echo "❌ HTTP $http_code"
                HEALTH_SCORE=$((HEALTH_SCORE - 25))
                ISSUES_FOUND+=("HTTP $http_code on $endpoint")
              fi
            else
              echo "❌ Connection failed"
              HEALTH_SCORE=$((HEALTH_SCORE - 30))
              ISSUES_FOUND+=("Connection failed on $endpoint")
            fi
          }
          
          # Check application health
          BASE_URL="https://$(appName).azurewebsites.net"
          
          # Primary health endpoint
          check_endpoint "$BASE_URL" "$(healthEndpoint)"
          
          # Critical endpoints
          IFS=', ' read -ra ENDPOINTS <<< "$(criticalEndpoints)"
          for endpoint in "${ENDPOINTS[@]}"; do
            check_endpoint "$BASE_URL" "$endpoint" 15
          done
          
          # Azure App Service specific checks
          echo "🔧 Checking Azure App Service metrics..."
          
          # Get App Service metrics
          app_metrics=$(az monitor metrics list \
            --resource "/subscriptions/$(az account show --query id -o tsv)/resourceGroups/$(resourceGroupName)/providers/Microsoft.Web/sites/$(appName)" \
            --metric "CpuPercentage,MemoryPercentage,HttpResponseTime,Http2xx,Http4xx,Http5xx" \
            --interval PT5M \
            --aggregation Average \
            --output json)
          
          # Parse and evaluate metrics
          cpu_avg=$(echo "$app_metrics" | jq -r '.value[] | select(.name.value=="CpuPercentage") | .timeseries[0].data[-1].average // 0')
          memory_avg=$(echo "$app_metrics" | jq -r '.value[] | select(.name.value=="MemoryPercentage") | .timeseries[0].data[-1].average // 0')
          response_time=$(echo "$app_metrics" | jq -r '.value[] | select(.name.value=="HttpResponseTime") | .timeseries[0].data[-1].average // 0')
          http_2xx=$(echo "$app_metrics" | jq -r '.value[] | select(.name.value=="Http2xx") | .timeseries[0].data[-1].total // 0')
          http_4xx=$(echo "$app_metrics" | jq -r '.value[] | select(.name.value=="Http4xx") | .timeseries[0].data[-1].total // 0')
          http_5xx=$(echo "$app_metrics" | jq -r '.value[] | select(.name.value=="Http5xx") | .timeseries[0].data[-1].total // 0')
          
          echo "📊 Resource Metrics:"
          echo "   CPU: ${cpu_avg}%"
          echo "   Memory: ${memory_avg}%"
          echo "   Response Time: ${response_time}ms"
          echo "   HTTP 2xx: $http_2xx"
          echo "   HTTP 4xx: $http_4xx"
          echo "   HTTP 5xx: $http_5xx"
          
          # Evaluate thresholds
          if (( $(echo "$cpu_avg > 80" | bc -l) )); then
            HEALTH_SCORE=$((HEALTH_SCORE - 15))
            ISSUES_FOUND+=("High CPU usage: ${cpu_avg}%")
          fi
          
          if (( $(echo "$memory_avg > 85" | bc -l) )); then
            HEALTH_SCORE=$((HEALTH_SCORE - 15))
            ISSUES_FOUND+=("High memory usage: ${memory_avg}%")
          fi
          
          if (( $(echo "$response_time > 3000" | bc -l) )); then
            HEALTH_SCORE=$((HEALTH_SCORE - 20))
            ISSUES_FOUND+=("High response time: ${response_time}ms")
          fi
          
          # Calculate error rate
          total_requests=$((http_2xx + http_4xx + http_5xx))
          if [ $total_requests -gt 0 ]; then
            error_rate=$(echo "scale=2; ($http_4xx + $http_5xx) * 100 / $total_requests" | bc)
            if (( $(echo "$error_rate > 5" | bc -l) )); then
              HEALTH_SCORE=$((HEALTH_SCORE - 25))
              ISSUES_FOUND+=("High error rate: ${error_rate}%")
            fi
          fi
          
          # Generate health report
          cat > "$METRICS_FILE" << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "appName": "$(appName)",
            "appType": "$(appType)",
            "environment": "${{ parameters.environment }}",
            "healthScore": $HEALTH_SCORE,
            "metrics": {
              "cpuPercentage": $cpu_avg,
              "memoryPercentage": $memory_avg,
              "responseTimeMs": $response_time,
              "http2xx": $http_2xx,
              "http4xx": $http_4xx,
              "http5xx": $http_5xx,
              "errorRate": ${error_rate:-0}
            },
            "issues": $(printf '%s\n' "${ISSUES_FOUND[@]}" | jq -R . | jq -s .),
            "status": "$([ $HEALTH_SCORE -ge 75 ] && echo "healthy" || ([ $HEALTH_SCORE -ge 50 ] && echo "degraded" || echo "unhealthy"))"
          }
          EOF
          
          echo "📊 Health Score: $HEALTH_SCORE/100"
          echo "🏥 Status: $([ $HEALTH_SCORE -ge 75 ] && echo "✅ Healthy" || ([ $HEALTH_SCORE -ge 50 ] && echo "⚠️ Degraded" || echo "❌ Unhealthy"))"
          
          # Set pipeline variables for alerting
          echo "##vso[task.setvariable variable=healthScore;isOutput=true]$HEALTH_SCORE"
          echo "##vso[task.setvariable variable=healthStatus;isOutput=true]$([ $HEALTH_SCORE -ge 75 ] && echo "healthy" || ([ $HEALTH_SCORE -ge 50 ] && echo "degraded" || echo "unhealthy"))"
          
          # Fail job if critically unhealthy
          if [ $HEALTH_SCORE -lt 30 ]; then
            echo "🚨 Critical health failure detected!"
            exit 1
          fi
      displayName: 'Health Check & Metrics Collection'
      name: 'healthCheck'
    
    # 📊 Store metrics in Azure Monitor
    - task: AzureCLI@2
      condition: always()
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "📊 Storing custom metrics in Azure Monitor..."
          
          METRICS_FILE="/tmp/health_metrics_$(appType).json"
          if [ -f "$METRICS_FILE" ]; then
            HEALTH_SCORE=$(jq -r '.healthScore' "$METRICS_FILE")
            STATUS=$(jq -r '.status' "$METRICS_FILE")
            
            # Send custom metrics to Azure Monitor
            az monitor metrics generate \
              --resource "/subscriptions/$(az account show --query id -o tsv)/resourceGroups/$(resourceGroupName)/providers/Microsoft.Web/sites/$(appName)" \
              --metric-name "HealthScore" \
              --metric-value $HEALTH_SCORE \
              --dimension "AppType=$(appType)" "Environment=${{ parameters.environment }}" \
              || echo "⚠️ Failed to send custom metrics"
            
            echo "✅ Health score $HEALTH_SCORE stored for $(appName)"
          fi
      displayName: 'Store Custom Metrics'

# 🚨 Alerting & Auto-Remediation Stage
- stage: AlertingAndRemediation
  displayName: '🚨 Alerting & Remediation'
  dependsOn: HealthMonitoring
  condition: or(failed(), eq(dependencies.HealthMonitoring.outputs['SystemHealthCheck.healthCheck.healthStatus'], 'unhealthy'))
  jobs:
  - job: AlertAndRemediate
    displayName: 'Alert & Auto-Remediation'
    steps:
    - checkout: none
    
    # 🚨 Send alerts
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "🚨 Health issues detected - initiating alert procedures"
          
          # Get health status from previous stage
          FRONTEND_STATUS="${{ dependencies.HealthMonitoring.outputs['SystemHealthCheck.healthCheck.healthStatus'] }}"
          API_STATUS="${{ dependencies.HealthMonitoring.outputs['SystemHealthCheck.healthCheck.healthStatus'] }}"
          
          # Create alert payload
          ALERT_PAYLOAD=$(cat << EOF
          {
            "schemaId": "azureMonitorCommonAlertSchema",
            "data": {
              "essentials": {
                "alertRule": "ProfilePhotoMaker Health Alert",
                "severity": "Sev1",
                "signalType": "Metric",
                "monitorCondition": "Fired",
                "description": "Health monitoring detected issues in ${{ parameters.environment }} environment"
              },
              "alertContext": {
                "condition": {
                  "allOf": [
                    {
                      "metricName": "HealthScore",
                      "operator": "LessThan",
                      "threshold": "50",
                      "timeAggregation": "Average"
                    }
                  ]
                }
              }
            }
          }
          EOF
          )
          
          # Send to Action Group
          az monitor action-group test-notifications create \
            --resource-group $(resourceGroupName) \
            --action-group-name $(actionGroupName) \
            --notification-type "email" \
            --alert-type "servicehealth" \
            || echo "⚠️ Failed to send alert notification"
          
          echo "📧 Alert notifications sent"
      displayName: 'Send Health Alerts'
    
    # 🔄 Auto-remediation attempts
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "🔄 Attempting auto-remediation..."
          
          # Restart unhealthy apps
          apps=("$(frontendAppName)" "$(apiAppName)")
          for app in "${apps[@]}"; do
            echo "🔄 Restarting $app..."
            az webapp restart --name "$app" --resource-group $(resourceGroupName)
            
            # Wait and verify restart
            sleep 60
            
            # Quick health check after restart
            health_url="https://$app.azurewebsites.net/health"
            if curl -f -s --max-time 30 "$health_url" > /dev/null; then
              echo "✅ $app restarted successfully"
            else
              echo "❌ $app restart failed or still unhealthy"
            fi
          done
          
          echo "🔄 Auto-remediation completed"
      displayName: 'Auto-Remediation'
      continueOnError: true
    
    # 📞 Escalation procedures
    - script: |
        echo "📞 Initiating escalation procedures..."
        echo "🚨 Severity: High"
        echo "🌍 Environment: ${{ parameters.environment }}"
        echo "⏰ Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "🔗 Pipeline: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
        echo "📋 Next Steps:"
        echo "   1. Review pipeline logs"
        echo "   2. Check Application Insights"
        echo "   3. Verify Azure resources"
        echo "   4. Contact on-call engineer if needed"
      displayName: 'Escalation Procedures'

# 📊 Reporting Stage
- stage: Reporting
  displayName: '📊 Reporting'
  dependsOn: 
  - HealthMonitoring
  - AlertingAndRemediation
  condition: always()
  jobs:
  - job: GenerateReport
    displayName: 'Generate Health Report'
    steps:
    - checkout: none
    
    - script: |
        echo "📊 Generating health monitoring report..."
        
        # Create comprehensive report
        cat > health_report.json << EOF
        {
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "environment": "${{ parameters.environment }}",
          "monitoringRun": {
            "buildId": "$(Build.BuildId)",
            "buildNumber": "$(Build.BuildNumber)",
            "triggeredBy": "$(Build.Reason)"
          },
          "summary": {
            "overallStatus": "${{ dependencies.HealthMonitoring.result }}",
            "alertsTriggered": "${{ eq(dependencies.AlertingAndRemediation.result, 'Succeeded') }}",
            "autoRemediationAttempted": "${{ eq(dependencies.AlertingAndRemediation.result, 'Succeeded') }}"
          },
          "nextMonitoring": "$(date -u -d '+15 minutes' +%Y-%m-%dT%H:%M:%SZ)"
        }
        EOF
        
        echo "📋 Health Report Generated:"
        cat health_report.json | jq .
        
        # Archive report
        echo "##vso[artifact.upload containerfolder=HealthReports;artifactname=health-report-$(date +%Y%m%d-%H%M)]health_report.json"
      displayName: 'Generate Report'